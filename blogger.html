<style>
  .stock-box { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
  .stock-search { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
  .stock-table { width: 100%; border-collapse: collapse; text-align: right; }
  .stock-table th, .stock-table td { padding: 8px; border-bottom: 1px solid #ddd; }
  .stock-table th:first-child, .stock-table td:first-child { text-align: left; }
  .up { color: #d93025; font-weight: bold; }
  .down { color: #1a73e8; font-weight: bold; }
</style>

<div class="stock-box">
  <input type="text" id="searchInput" class="stock-search" placeholder="종목 검색 (예: AAPL)" onkeyup="filterData()">
  <div id="updateTime" style="font-size:12px; color:#666; margin-bottom: 5px;"></div>

  <table class="stock-table">
    <thead>
      <tr>
        <th>종목</th>
        <th>현재가 ($)</th>
        <th>등락률</th>
        <th>거래량</th>
      </tr>
    </thead>
    <tbody id="stockTbody">
      <tr><td colspan="4" style="text-align:center;">데이터를 불러오는 중...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const DATA_URL = "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/data.json";
  let stockData = [];

  async function init() {
    try {
      const res = await fetch(`${DATA_URL}?v=${Date.now()}`);
      const json = await res.json();
      stockData = json.stocks || [];
      const intervalLabel = json.interval ? ` · ${json.interval} 봉` : "";
      document.getElementById("updateTime").innerText = `최종 갱신: ${json.updated_at || "-"}${intervalLabel}`;
      renderTable(stockData);
    } catch (e) {
      console.error(e);
      document.getElementById("stockTbody").innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">데이터 로드 실패</td></tr>';
    }
  }

  function renderTable(list) {
    const tbody = document.getElementById("stockTbody");
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">표시할 종목이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(s => `
      <tr>
        <td><strong>${s.s}</strong></td>
        <td>$${Number(s.p).toFixed(2)}</td>
        <td class="${s.c >= 0 ? 'up' : 'down'}">${s.c >= 0 ? '+' : ''}${Number(s.cp).toFixed(2)}%</td>
        <td>${Number(s.v || 0).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  function filterData() {
    const q = document.getElementById("searchInput").value.trim().toUpperCase();
    renderTable(stockData.filter(s => !q || s.s.includes(q)));
  }

  init();
</script>
