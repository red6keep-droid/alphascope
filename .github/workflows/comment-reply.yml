name: Comment Reply

on:
  schedule:
    # 5분마다 새 댓글 감지. 일정 실행은 알림 발송을 켠다.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Telegram 알림 발송 (true) / dry-run (false)'
        type: boolean
        required: false
        default: false
      test_comment:
        description: '가상 댓글 텍스트 (예: 오늘 리포트 잘 봤습니다!)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: comment-reply
  cancel-in-progress: true

env:
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.5-flash
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  # 일정 실행(inputs 없음) = 발송 on, 수동 dispatch는 체크박스로 결정
  SEND_NOTIFICATION: ${{ inputs.notify || 'true' }}

jobs:
  comment-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r experiments/comment-reply/requirements.txt

      # actions/checkout은 fetch refspec을 main으로 좁혀둔다. 목적지를 명시하지
      # 않으면 FETCH_HEAD만 갱신되고 ref가 만들어지지 않아, 저장된 상태가 있어도
      # 매번 '첫 실행'으로 오판해 baseline(=알림 없음)으로 빠진다.
      - name: Load previous state
        run: |
          STATE=experiments/comment-reply/output/state.json
          if git fetch origin comment-state:refs/comment-state 2>/dev/null; then
            if git show "refs/comment-state:$STATE" > state.json.tmp 2>/dev/null; then
              mkdir -p experiments/comment-reply/output
              mv state.json.tmp "$STATE"
              echo "이전 상태 불러옴: $(cat "$STATE")"
            fi
          fi
          if [ ! -f "$STATE" ]; then
            rm -f state.json.tmp
            echo "이전 상태 없음 (첫 실행)"
          fi

      - name: Run comment reply
        env:
          SEND: ${{ env.SEND_NOTIFICATION }}
          TEST_COMMENT: ${{ inputs.test_comment }}
        run: |
          ARGS=()
          if [ "$SEND" = "true" ]; then ARGS+=(--send); fi
          if [ -n "$TEST_COMMENT" ]; then ARGS+=(--test-comment "$TEST_COMMENT"); fi
          python experiments/comment-reply/main.py "${ARGS[@]}"

      - name: Save state (comment-state branch)
        if: always()
        run: |
          STATE=experiments/comment-reply/output/state.json
          if [ ! -f "$STATE" ]; then
            echo "state.json 없음 — 저장을 건너뜁니다."
            exit 0
          fi
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # --orphan은 인덱스를 유지한다. 리셋하지 않으면 리포 전체가 커밋된다.
          git checkout --orphan comment-state
          git reset
          # output/ 은 .gitignore 대상이라 -f 없이는 git add가 종료코드 1로 죽는다.
          git add -f "$STATE"
          git commit -m "Update comment state [skip ci]" || echo "상태 변경 없음"
          git push --force origin comment-state:comment-state

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comment-reply-log
          path: experiments/comment-reply/output/