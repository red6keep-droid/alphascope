name: Trump Trend

# 트럼프 SNS 트렌드 파이프라인. 별도 글 시리즈("트럼프 발언 트렌드 — YYYY년 M월 D일")로 게시한다.
#
# 게시 게이트: 저장소 변수 TRUMP_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다.
# (Settings → Secrets and variables → Actions → Variables). 그 전까지는 그림자 모드 —
# 리포트는 만들지만 Blogger에 올리지 않는다. 수동 실행은 publish 입력으로 개별 결정.
#
# 상태(Gemini 분류 결과 · 일봉 CSV)와 산출물은 trump-state 브랜치에 저장한다.
# 2026-09-18부터 매일 이전 커밋 위에 새 커밋을 쌓는다 (일반 push). 특정 날의 리포트·분류 결과를
# git log로 되찾을 수 있고, 잘못 덮어써도 전날로 돌릴 수 있다. 하루 약 150KB(압축 후).
# 브랜치는 저장소 파일을 건드리지 않고 임시 인덱스 + commit-tree 로 만든다 — checkout 하면
# 방금 만든 output/state 가 옛 버전으로 덮어써지기 때문이다 (gitignore 파일은 git이 보호하지 않는다).

on:
  schedule:
    # 매일 22:30 UTC = 07:30 KST. 미국 정규장(20:00 UTC 마감) 종가가 yfinance에 확정된 뒤,
    # 그 사이 올라온 게시물까지 한 번에 잡는다. 주말도 돈다 — 게시물은 주말에도 올라온다.
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      max_batches:
        description: 'Gemini 분류 최대 배치 수 (배치당 15건)'
        type: number
        required: false
        default: 40
      narrate:
        description: 'Gemini 서술 생성'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: trump-trend
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  STATE_DIR: experiments/trump-trend/output/state
  # 스케줄: 저장소 변수로 결정. 수동: 입력값으로 결정.
  DO_PUBLISH: ${{ (github.event_name == 'schedule' && vars.TRUMP_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  trump-trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # publish.py가 daily-report의 publish_blogger를 가져다 쓰므로 그쪽 의존성(google-auth)도 필요하다.
      - name: Install dependencies
        run: |
          pip install -r experiments/trump-trend/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이전 실행의 분류 결과. 없으면 첫 실행 — 90일 백필이 여러 날에 걸쳐 진행된다.
      # actions/checkout은 fetch refspec을 main으로 좁혀두므로 목적지 ref를 명시한다.
      - name: Load state (trump-state branch)
        run: |
          if git fetch origin trump-state:refs/trump-state 2>/dev/null; then
            mkdir -p "$STATE_DIR"
            if git archive refs/trump-state "$STATE_DIR" | tar -x; then
              echo "분류 결과 불러옴: $(wc -l < "$STATE_DIR/classifications.jsonl" 2>/dev/null || echo 0)행"
              echo "일봉 불러옴: $(wc -l < "$STATE_DIR/daily_bars.csv" 2>/dev/null || echo 0)행 (없으면 2년치를 새로 받는다)"
            fi
          else
            echo "이전 상태 없음 (첫 실행)"
          fi

      - name: Run pipeline
        run: |
          ARGS="--import-state $STATE_DIR/classifications.jsonl --export-state $STATE_DIR/classifications.jsonl"
          ARGS="$ARGS --import-bars $STATE_DIR/daily_bars.csv --export-bars $STATE_DIR/daily_bars.csv"
          ARGS="$ARGS --max-batches ${{ inputs.max_batches || 40 }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.narrate }}" = "true" ]; then
            ARGS="$ARGS --narrate"
          fi
          if [ "$DO_PUBLISH" = "true" ]; then
            echo "게시 모드 — Blogger에 올린다."
            ARGS="$ARGS --publish"
          else
            echo "그림자 모드 — 게시하지 않는다. (스케줄 게시는 저장소 변수 TRUMP_PUBLISH=true 로 켠다)"
          fi
          python experiments/trump-trend/main.py $ARGS

      # 분류 결과가 있으면 뒤 단계가 실패했어도 저장한다 — Gemini 호출을 헛되게 하지 않기 위해.
      - name: Save state + report (trump-state branch)
        if: always()
        run: |
          if [ ! -f "$STATE_DIR/classifications.jsonl" ]; then
            echo "저장할 상태 없음 — 건너뜁니다."
            exit 0
          fi
          OUT=experiments/trump-trend/output
          for f in trump_report.md trump_report.html trump_analysis.json narrative.json title.txt post_url.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE_DIR/$f"
          done
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # 임시 인덱스에 state 디렉터리만 담아 트리를 만든다. 작업 트리와 main 인덱스는 건드리지 않는다.
          # 경로만 만든다(-u) — 0바이트 파일이 있으면 git이 "index file smaller than expected"로 죽는다.
          # output/ 은 .gitignore 대상이라 -f 가 필요하다.
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/trump-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update trump-trend state [skip ci]")"
          else
            echo "trump-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update trump-trend state [skip ci]")"
          fi
          # force 없음: 원격이 앞서 있으면 거부된다 (concurrency 그룹이 겹침을 막지만, 거부되는 쪽이 안전하다).
          git push origin "$COMMIT:refs/heads/trump-state"
          echo "저장: $COMMIT"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trump-trend-report
          path: |
            experiments/trump-trend/output/trump_report.md
            experiments/trump-trend/output/trump_report.html
            experiments/trump-trend/output/trump_analysis.json
            experiments/trump-trend/output/narrative.json
          if-no-files-found: ignore
          retention-days: 14
