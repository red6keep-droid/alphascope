name: KR Stocks

# 한국 종목 고정 페이지(목록 1 + 종목 35) · 홈 한국 탭 데이터 kr.json (experiments/kr-stocks, doc/기획/종목-레이더-기획.md 11절, 2026-10-24).
# 미국 종목(nvda-report.yml 안의 stock-radar 단계)과 같은 규칙으로, 시각 · 브랜치 · 상태만 따로:
#   - 평일 16:10 KST(한국 장 마감 15:30 뒤). GitHub cron 07:10 UTC 월~금. 휴장일은 오늘 봉이 없어 게시하지 않는다(fresh.txt).
#   - 그래프는 kr-images 브랜치(그날 그림만, 이력 없음) — 미국 radar-images 와 다른 브랜치 (둘 다 force push 라 같은 브랜치면 서로 지운다).
#   - 이어서 쌓는 파일(순위 교체 상태 · 페이지 해시 · 발행 목록 · 고점 회복 통계)은 kr-state 브랜치.
#   - 다른 워크플로와 같은 분에 gh-pages · Blogger 에 쓰지 않는다 (운영지침 11절: 리포트 :00 · :15 · :30, 시세 :07 · :22 · :37 · :52, 뉴스 :45) → :10.
#
# 게시 게이트: 저장소 변수 KR_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다. 수동 실행은 publish 입력으로.
# 한국 증시 리포트(글 1편, experiments/kr-market-report, 2026-10-27)는 따로 KR_REPORT_PUBLISH — 종목 페이지 첫 발행을 확인한 뒤 켠다.
#   꺼져 있으면 매 실행 dry-run 만. 수동 실행은 report 입력으로.
# 시세는 yfinance(미국과 같은 소스 · 같은 약관 위험, 예비 없음 — 운영지침 D4-7 · D4-15), 자금 흐름은 한국은행 ECOS(ECOS_API_KEY).

on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '10 8 * * 1-5'   # 수능일 전용 17:10 KST — 그날은 장이 10:00~16:30 이라 16:10 은 마감 전 (2026-11-05 사용자). 평일엔 when 잡이 건너뛴다
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      force:
        description: '오늘 봉이 없어도 게시 (휴장일 · 지난 종가로 디자인만 다시 올릴 때)'
        type: boolean
        required: false
        default: false
      report:
        description: '한국 증시 리포트 글도 게시 (publish 와 함께)'
        type: boolean
        required: false
        default: false
      update:
        description: '오늘 리포트 글이 이미 있으면 본문을 새로 덮어쓰기 (report 와 함께, 자료 빠진 글 다시 채울 때)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: kr-stocks
  cancel-in-progress: false

env:
  ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
  DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}   # 관세청 품목별 수출 (방산, 2026-10-31)
  DART_API_KEY: ${{ secrets.DART_API_KEY }}   # `실적과 기대` 분기 매출 (collect_kr_dart.py, 2026-10-25) — 없으면 Yahoo 매출
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # `오늘` 탭 방송 뉴스 (experiments/media_feed.py, 2026-10-25) — 없으면 방송 줄 없이
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  KR_DIR: experiments/kr-stocks
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.KR_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  DO_REPORT: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.KR_REPORT_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.report) }}
  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
  UPDATE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.update == true }}   # 2026-11-09 사용자: 같은 날 리포트 글 본문 덮어쓰기

jobs:
  # 수능일 게이트 (2026-11-05 사용자): 수능일(universe_kr.EXAM_DAYS)은 장이 한 시간 늦게 끝나 16:10 예약을 건너뛰고 17:10 예약만 돈다.
  # 평일은 반대. 어느 예약이 깨웠는지는 github.event.schedule(cron 문자열)로 가른다 — 시각으로 가르면 예약 지연(정각 몰림) 때 평일 실행이 17시 뒤로 밀려 잘못 건너뛴다.
  # 수동 실행은 늘 돈다.
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.exam.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: experiments/kr-stocks/universe_kr.py
          sparse-checkout-cone-mode: false
      - id: exam
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          EXAM="$(python3 -c "import sys; sys.path.insert(0, 'experiments/kr-stocks'); import universe_kr as U; print(' '.join(U.EXAM_DAYS))")"
          D="$(TZ=Asia/Seoul date +%F)"
          exam=false; case " $EXAM " in *" $D "*) exam=true;; esac
          skip=false
          if [ "$SCHEDULE" = "10 7 * * 1-5" ] && [ "$exam" = true ]; then skip=true; fi    # 평일 16:10 예약 — 수능일엔 마감 전이라 건너뜀
          if [ "$SCHEDULE" = "10 8 * * 1-5" ] && [ "$exam" != true ]; then skip=true; fi   # 17:10 예약 — 수능일에만
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "KST $D · 수능일=$exam · 예약='$SCHEDULE' · 건너뜀=$skip"

  kr-stocks:
    needs: when
    if: needs.when.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 수집 · 그래프는 nvda-report 의 의존성(yfinance · matplotlib · requests), 게시는 daily-report 의 publish_blogger(google-auth)
      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이어서 쌓는 파일 — 순위 교체 상태 · 페이지 해시 · 발행 목록 · 고점 회복 통계(일주일 캐시)
      - name: Load state (kr-state branch)
        run: |
          mkdir -p "$KR_DIR/data"
          if git fetch state kr-state:refs/kr-state 2>/dev/null; then
            git archive refs/kr-state "$KR_DIR/data" | tar -x && echo "상태 불러옴: $(ls "$KR_DIR/data" | tr '\n' ' ')"
          else
            echo "이전 상태 없음 (첫 실행)"
          fi
          # 캘린더 탭의 미국 경제 일정(FOMC · 물가 · 고용) — 엔비디아 리포트가 쌓는 calendar.jsonl (render_kr.us_calendar, 2026-10-25)
          git fetch state nvda-state:refs/remotes/state/nvda-state 2>/dev/null || echo "nvda-state 없음 — 미국 일정 없이"

      - name: Collect · analyze · render
        id: run_kr
        run: python "$KR_DIR/main_kr.py"

      # 한국 증시 리포트 — 방금 받은 자료(data/*.json)로 그리기만. 코스피 그래프는 아래 kr-images 에 함께 올린다
      - name: Render KR market report
        continue-on-error: true
        run: python experiments/kr-market-report/main.py --cached

      - name: Decide publish
        id: gate
        run: |
          FRESH="$(cat "$KR_DIR/output/fresh.txt" 2>/dev/null || echo 0)"
          if [ "$DO_PUBLISH" = "true" ] && { [ "$FRESH" = "1" ] || [ "$FORCE" = "true" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "게시한다 (fresh=$FRESH force=$FORCE)"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            if [ "$DO_PUBLISH" != "true" ]; then echo "그림자 모드 — 게시하지 않는다 (스케줄 게시는 저장소 변수 KR_PUBLISH=true)"; python "$KR_DIR/publish_pages_kr.py" --dry || true
            else echo "오늘 봉 없음(휴장일 또는 지연) — 게시하지 않는다. 강제하려면 force=true"; fi
          fi

      # 그래프 — kr-images 브랜치를 그날 그림만으로 새로 만들어 덮어쓴다 (이력 없음, 2026-10-20 사용자: 이미지는 휘발성)
      - name: Deploy charts (kr-images branch, no history)
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-stocks/output/images/radar-*.png') != ''
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          SUB="$(for f in "$KR_DIR"/output/images/radar-*.png experiments/kr-market-report/output/images/kospi-price-*.png; do
            [ -f "$f" ] || continue
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
          done | git mktree)"
          TREE="$(printf '040000 tree %s\timages\n' "$SUB" | git mktree)"
          COMMIT="$(git commit-tree "$TREE" -m "KR stock charts $(date -u +%F) [skip ci]")"
          git push --force origin "$COMMIT:refs/heads/kr-images"
          for f in "$KR_DIR"/output/images/radar-*.png; do
            curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@kr-images/images/$(basename "$f")" || true
          done
          curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@kr-images/images/kospi-price-$(date -u +%F).png" || true
          echo "한국 종목 · 코스피 그래프 $(git ls-tree "$SUB" | wc -l)장 → kr-images"

      - name: Publish pages (한국 시총 TOP 10 · 종목 35)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: python "$KR_DIR/publish_pages_kr.py"

      # 한국 증시 리포트 글 — 하루 1편, 이미 있으면 건너뜀 (publish_report.py). 그래프가 kr-images 에 올라간 뒤
      - name: Publish KR market report
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-market-report/output/report_body.html') != ''
        continue-on-error: true
        run: |
          if [ "$DO_REPORT" = "true" ] && [ "$UPDATE_REPORT" = "true" ]; then python experiments/kr-market-report/publish_report.py --update
          elif [ "$DO_REPORT" = "true" ]; then python experiments/kr-market-report/publish_report.py
          else echo "리포트 그림자 모드 (저장소 변수 KR_REPORT_PUBLISH=true 로 켠다)"; python experiments/kr-market-report/publish_report.py --dry; fi

      # 홈 한국 탭 데이터 — 발행된 페이지만 링크 (pages_live.json)
      - name: Home kr.json
        if: steps.gate.outputs.go == 'true'
        run: |
          python "$KR_DIR/home_feed_kr.py"
          mkdir -p deploy-home && cp "$KR_DIR/output/home/kr.json" deploy-home/kr.json

      # 홈 한국 증시 카드 재료 cards/kr-report.json (H31, 2026-11-05) — 아래 kr.json 푸시에 같이 얹는다(푸시 추가 없음).
      # 글 주소는 publish_report.py 가 output/post_meta.json 에 남긴다(게시한 날 · 이미 게시된 날 모두). 실패해도 홈은 피드로 돈다
      - name: Home card kr-report.json
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-market-report/output/post_meta.json') != ''
        continue-on-error: true
        run: python experiments/daily-report/home_card.py --card kr-report --body experiments/kr-market-report/output/report_body.html --meta experiments/kr-market-report/output/post_meta.json --out deploy-home/cards/kr-report.json

      - name: Deploy kr.json to gh-pages
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home
          publish_branch: gh-pages
          keep_files: true

      - name: Purge kr.json cache
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != ''
        continue-on-error: true
        run: |
          # 푸시 직후 퍼지는 jsDelivr 가 아직 옛 커밋을 보고 전날 파일을 다시 붙잡는다(11-05 stocks.json) — 잠깐 기다린다
          sleep 10
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/kr.json" || true
          [ -f deploy-home/cards/kr-report.json ] && curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/cards/kr-report.json" || true

      # 상태 저장 — snapshot · flows 는 매번 새로 받으므로 빼고, 이어서 쌓는 것만
      - name: Save state (kr-state branch)
        if: always()
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          python experiments/record_store.py run-log "$KR_DIR/data" kr "${{ steps.run_kr.outcome }}" "job=${{ job.status }}"   # 실행 한 줄 — data/records/runs (2026-11-07, A3-3-2 의 1)
          # 임시 인덱스로 실제 경로(experiments/kr-stocks/data/…)를 그대로 올린다 — records/ 하위 폴더(매일 기록, 2026-11-01)까지 (옛: 파일만 mktree)
          export GIT_INDEX_FILE="$(mktemp -u)"
          for f in rank_state.json page_hashes.json pages_live.json history.json dart_fin.json dart_fin_all.json dart_corp.json dart_company.json dart_earn.json est_history.json report_posts.json flows.json; do   # flows.json = 마지막으로 받은 ECOS 자금 흐름 — 다음 날 ECOS 가 실패하면 이것을 쓴다 (2026-11-09 사용자)   # DART 캐시 — 이미 받은 보고서를 다시 부르지 않게 (2026-10-25)
            [ -f "$KR_DIR/data/$f" ] && git add -f "$KR_DIR/data/$f" || true
          done
          [ -d "$KR_DIR/data/records" ] && git add -f "$KR_DIR/data/records" || true   # 카드 판정 · 애널리스트 · 방송 의견 (stock_records, 데이터-기록-계획 A5-4)
          if [ -z "$(git ls-files)" ]; then unset GIT_INDEX_FILE; echo "저장할 상태 없음"; exit 0; fi
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/kr-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then echo "변경 없음"; exit 0; fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update kr-stocks state [skip ci]")"
          else
            COMMIT="$(git commit-tree "$TREE" -m "Update kr-stocks state [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/kr-state"
          echo "저장: $COMMIT"
