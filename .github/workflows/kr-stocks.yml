name: KR Stocks

# 한국 종목 고정 페이지(목록 1 + 종목 35) · 홈 한국 탭 데이터 kr.json (experiments/kr-stocks, doc/기획/종목-레이더-기획.md 11절, 2026-10-24).
# 미국 종목(nvda-report.yml 안의 stock-radar 단계)과 같은 규칙으로, 시각 · 브랜치 · 상태만 따로:
#   - 평일 15:50 KST(한국 장 마감 15:30 + 야후 지연 시세 20분, 2026-11-20 사용자 — 옛 16:10). 맨 앞 wait_close.py 가 종가 확정을 확인하고(늦으면 16:10 까지 기다림) 수집. GitHub cron 06:50 UTC 월~금. 휴장일은 오늘 봉이 없어 게시하지 않는다(fresh.txt).
#   - 그래프는 kr-images 브랜치(그날 그림만, 이력 없음) — 미국 radar-images 와 다른 브랜치 (둘 다 force push 라 같은 브랜치면 서로 지운다).
#   - 이어서 쌓는 파일(순위 교체 상태 · 페이지 해시 · 발행 목록 · 고점 회복 통계)은 kr-state 브랜치.
#   - 다른 워크플로와 같은 분에 gh-pages · Blogger 에 쓰지 않는다 (운영지침 11절: 리포트 :00 · :15 · :30, 시세 :07 · :22 · :37 · :52, 뉴스 :45) → :10.
#
# 게시 게이트: 저장소 변수 KR_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다. 수동 실행은 publish 입력으로.
# 한국 증시 리포트(글 1편, experiments/kr-market-report, 2026-10-27)는 따로 KR_REPORT_PUBLISH — 종목 페이지 첫 발행을 확인한 뒤 켠다.
#   꺼져 있으면 매 실행 dry-run 만. 수동 실행은 report 입력으로.
# 시세는 yfinance(미국과 같은 소스 · 같은 약관 위험, 예비 없음 — 운영지침 D4-7 · D4-15), 자금 흐름은 한국은행 ECOS(ECOS_API_KEY).

on:
  schedule:
    - cron: '50 6 * * 1-5'   # 15:50 KST (2026-11-20 사용자, 옛 '10 7' = 16:10)
    - cron: '50 7 * * 1-5'   # 수능일 전용 16:50 KST — 그날은 장이 10:00~16:30 (2026-11-05 사용자, 옛 17:10). 평일엔 when 잡이 건너뛴다
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      force:
        description: '오늘 봉이 없어도 게시 (휴장일 · 지난 종가로 디자인만 다시 올릴 때)'
        type: boolean
        required: false
        default: false
      report:
        description: '한국 증시 리포트 글도 게시 (publish 와 함께)'
        type: boolean
        required: false
        default: false
      update:
        description: '오늘 리포트 글이 이미 있으면 본문을 새로 덮어쓰기 (report 와 함께, 자료 빠진 글 다시 채울 때)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read   # 예비 중복 확인(when 잡의 run_guard.py)이 실행 목록을 읽는다

concurrency:
  group: kr-stocks
  cancel-in-progress: false

env:
  ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
  DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}   # 관세청 품목별 수출 (방산, 2026-10-31)
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}         # 마지막 봉 = 거래소 값(한국투자증권 실전, collect_kr._fix_last) — 없거나 실패면 네이버 (2026-11-23 사용자)
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}   # `실적과 기대` 분기 매출 (collect_kr_dart.py, 2026-10-25) — 없으면 Yahoo 매출
  # 한국 증시 리포트 뉴스 탭의 같은 뉴스 묶기(news_stories, 사슬 news-alt) — 키가 없어 매번 낱말 규칙으로 떨어졌다 (2026-11-12). 실행당 1~2회 · 하루 약 4회
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # `오늘` 탭 방송 뉴스 (experiments/media_feed.py, 2026-10-25) — 없으면 방송 줄 없이
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  KR_DIR: experiments/kr-stocks
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.KR_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  DO_REPORT: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.KR_REPORT_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.report) }}
  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
  UPDATE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.update == true }}   # 2026-11-09 사용자: 같은 날 리포트 글 본문 덮어쓰기

jobs:
  # 수능일 게이트 (2026-11-05 사용자): 수능일(universe_kr.EXAM_DAYS)은 장이 한 시간 늦게 끝나 15:50 예약을 건너뛰고 16:50 예약만 돈다.
  # 평일은 반대. 어느 예약이 깨웠는지는 github.event.schedule(cron 문자열)로 가른다 — 시각으로 가르면 예약 지연(정각 몰림) 때 평일 실행이 17시 뒤로 밀려 잘못 건너뛴다.
  # 수동 실행은 늘 돈다.
  # 예비 중복 (2026-11-17 사용자): GitHub 예비가 Worker 실행보다 몇 시간 늦게 와도(11-16 16:10 예비 → 11-17 01:57) 같은 칸을 이미 했으면 건너뛴다.
  #   그날 예비가 30분 다시 받고 홈 증시 전망 파일을 02:28 판으로 덮었다. 확인 = .github/scripts/run_guard.py (본 잡 kr-stocks 성공 · 도는 중)
  # 수능일 Worker (2026-11-17): Worker 실행(15:50)은 schedule 문자열이 없어 위 게이트를 지나 마감(16:30) 전에 돌 뻔했다 → 16:50 KST 까지 기다린 뒤 돈다.
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 수능일 Worker 실행이 15:50 → 16:50 대기 + 종가 확인 최대 20분
    outputs:
      skip: ${{ steps.exam.outputs.skip == 'true' || steps.dup.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            experiments/kr-stocks/universe_kr.py
            experiments/kr-stocks/wait_close.py
            .github/scripts/run_guard.py
          sparse-checkout-cone-mode: false
      - id: exam
        env:
          SCHEDULE: ${{ github.event.schedule }}
          WORKER: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled == true }}
        run: |
          EXAM="$(python3 -c "import sys; sys.path.insert(0, 'experiments/kr-stocks'); import universe_kr as U; print(' '.join(U.EXAM_DAYS))")"
          D="$(TZ=Asia/Seoul date +%F)"
          exam=false; case " $EXAM " in *" $D "*) exam=true;; esac
          skip=false
          if [ "$SCHEDULE" = "50 6 * * 1-5" ] && [ "$exam" = true ]; then skip=true; fi    # 평일 15:50 예약 — 수능일엔 마감 전이라 건너뜀
          if [ "$SCHEDULE" = "50 7 * * 1-5" ] && [ "$exam" != true ]; then skip=true; fi   # 16:50 예약 — 수능일에만
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "KST $D · 수능일=$exam · 예약='$SCHEDULE' · Worker=$WORKER · 건너뜀=$skip"
          if [ "$WORKER" = true ] && [ "$exam" = true ]; then
            wait=$(( $(TZ=Asia/Seoul date -d "$D 16:50" +%s) - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then echo "수능일 — 장 마감(16:30) + 지연 시세 20분 = 16:50 까지 ${wait}초 기다림"; sleep "$wait"; fi
          fi
      - id: dup
        if: github.event_name == 'schedule' && steps.exam.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 .github/scripts/run_guard.py --workflow kr-stocks.yml --job kr-stocks
      # 종가 확정 확인 (2026-11-20 사용자): 15:50 시작 — 야후 지연 시세에 오늘 마감(15:30) 거래가 떴나 보고, 아직이면 2분마다 16:10 까지.
      # 본 잡이 아니라 여기서 기다린다 — 본 잡 시간 제한 55분은 수집 · 게시에만 (11-20 수집 34분 + 게시 7분 날 대기 20분까지 넣으면 61분 → 끊김).
      # 정시 실행만(수동 · 다시 돌리기는 이미 늦은 시각이라 바로). 휴장일은 기다리지 않는다. 실패해도 본 잡은 돈다
      - name: Wait for KR close (야후 종가 확정)
        if: env.IS_SCHEDULED == 'true' && steps.exam.outputs.skip != 'true' && steps.dup.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 experiments/kr-stocks/wait_close.py

  kr-stocks:
    needs: when
    if: needs.when.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 40 → 55 (2026-11-20 사용자): 그날 수집이 33.7분(평소 9분) 걸려 16:50 에 마지막 단계(캐시 지우기)에서 끊기고 forecast-kr 도 건너뜀
    timeout-minutes: 65   # 55 → 65 (2026-11-20): 수집 상한 40 + 게시 약 7 + 여유
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 방송 요약 날짜 파일 캐시 (experiments/media_feed.py, 2026-11-16 수집기 요청 News-doc/블로그-Firestore-읽기-줄이기.md).
      # 그제 이전 edition 만 들어 있다 — 실행마다 Firestore 는 오늘 · 어제 묶음만 읽는다. 키 = 워크플로 · KST 날짜(하루 한 번 저장, 날짜가 바뀌면 전날 것을 이어 받는다)
      - name: Media feed day key
        id: mfkey
        run: echo "d=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore media feed cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/alphascope-media
          key: media-feed-${{ github.workflow }}-${{ steps.mfkey.outputs.d }}
          restore-keys: media-feed-${{ github.workflow }}-

      # 수집 · 그래프는 nvda-report 의 의존성(yfinance · matplotlib · requests), 게시는 daily-report 의 publish_blogger(google-auth)
      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이어서 쌓는 파일 — 순위 교체 상태 · 페이지 해시 · 발행 목록 · 고점 회복 통계(일주일 캐시)
      - name: Load state (kr-state branch)
        run: |
          mkdir -p "$KR_DIR/data"
          if git fetch state kr-state:refs/kr-state 2>/dev/null; then
            git archive refs/kr-state "$KR_DIR/data" | tar -x && echo "상태 불러옴: $(ls "$KR_DIR/data" | tr '\n' ' ')"
          else
            echo "이전 상태 없음 (첫 실행)"
          fi
          # 캘린더 탭의 미국 경제 일정(FOMC · 물가 · 고용) — 엔비디아 리포트가 쌓는 calendar.jsonl (render_kr.us_calendar, 2026-10-25)
          git fetch state nvda-state:refs/remotes/state/nvda-state 2>/dev/null || echo "nvda-state 없음 — 미국 일정 없이"
          # 집 IP 실행(home-ip.yml, 14:30 KST)이 받아 둔 미래에셋 TIGER 구성 — GitHub 주소로는 403 (2026-11-17)
          if git fetch -q state homeip-state:refs/remotes/state/homeip-state 2>/dev/null; then git archive refs/remotes/state/homeip-state experiments/home-ip/data | tar -x && echo "집 IP 자료 불러옴: $(ls experiments/home-ip/data | tr '\n' ' ')"; else echo "homeip-state 없음 — 미래에셋 구성은 지난 값"; fi
          # 기업 탭 시가총액 순위 — 간단 실행이 정식 · 간단 350종목으로 매긴 것(quick-state kr/cap_rank.json, 2026-11-16 사용자). 없으면 순위 없이 금액만
          if git fetch -q state quick-state:refs/remotes/state/quick-state 2>/dev/null && git show refs/remotes/state/quick-state:kr/cap_rank.json > "$KR_DIR/data/cap_rank.json" 2>/dev/null; then echo "시가총액 순위 불러옴"; else rm -f "$KR_DIR/data/cap_rank.json"; echo "시가총액 순위 없음 — 금액만"; fi

      # 국민연금 공시(주식 대량보유 분기 · 국내주식 종목별 연말) — 주 1회만 게시판 확인, 새 공시만 PDF (collect_nps.py, 2026-11-13 사용자).
      # 기업 탭 `국민연금` 줄이 data/nps.json 을 읽는다. 받기 현황 = 운영 대시보드(feed_log). 실패해도 페이지는 지난 값으로 나간다
      - name: NPS disclosures (국민연금 공시, 주 1회)
        continue-on-error: true
        run: python "$KR_DIR/collect_nps.py"

      # 증권사 목표가 — 증권사 공식 텔레그램 리서치 채널 글(약 17곳)에서 종목 · 의견 · 목표가만 (broker-research/collect_tg.py, 2026-11-14 사용자).
      # 새 글만 · AI 0 · PDF 안 받음. 결과 data/broker_tg.json(kr-state) → 정식 · 간단 종목 `증권사 목표가 변경은?`. 실패해도 지난 기록으로 페이지는 나간다
      - name: Broker targets (증권사 텔레그램)
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          pip install -q telethon
          python experiments/broker-research/collect_tg.py

      - name: Collect · analyze · render
        id: run_kr
        # 수집 단계 상한 40분 (2026-11-20 사용자): 바깥 호출이 늘어져도 본 잡(65분)이 게시 전에 끊기지 않게 — 넘으면 이 단계 실패로 게시 안 함(지난 화면 그대로,
        # Worker 가 17:20 에 한 번 다시 건다). 30분으로 두면 11-20 같은 날(33.7분, 끝나긴 함)이 실패가 돼 오히려 늦는다
        timeout-minutes: 40
        env:
          KR_BIZ_AFTER: '1'   # 보고서 AI 읽기(dart_biz)는 새벽 quick-dart.yml 의 biz 잡으로 — 여기선 지난 캐시 (게시 뒤 단계에 두면 본 잡 끝이 밀려 증시 전망 · 간단 종목이 같이 늦는다)
        # -u = 출력 즉시 찍기 (2026-11-20): 버퍼에 모였다 끝에 한꺼번에 찍혀 어느 줄에서 느렸는지 로그 시각으로 가를 수 없었다
        run: python -u "$KR_DIR/main_kr.py"

      # 한국 증시 리포트 — 방금 받은 자료(data/*.json)로 그리기만. 날짜 붙은 코스피 그래프는 아래 gh-pages 에 남긴다(지난 글이 씀)
      - name: Render KR market report
        continue-on-error: true
        run: python experiments/kr-market-report/main.py --cached

      - name: Decide publish
        id: gate
        run: |
          FRESH="$(cat "$KR_DIR/output/fresh.txt" 2>/dev/null || echo 0)"
          if [ "$DO_PUBLISH" = "true" ] && { [ "$FRESH" = "1" ] || [ "$FORCE" = "true" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "게시한다 (fresh=$FRESH force=$FORCE)"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            if [ "$DO_PUBLISH" != "true" ]; then echo "그림자 모드 — 게시하지 않는다 (스케줄 게시는 저장소 변수 KR_PUBLISH=true)"; python "$KR_DIR/publish_pages_kr.py" --dry || true
            else echo "오늘 봉 없음(휴장일 또는 지연) — 게시하지 않는다. 강제하려면 force=true"; fi
          fi

      # 시황 해설 묶음을 먼저 올린다 (2026-11-20 사용자 · News-doc 31절 Q31): 수집기가 저녁 편 1차를 16:40 에 쓴다.
      # 페이지 · ETF 게시(약 6분)를 기다리지 않고 수집 직후 올려 16:21 쯤 — 옛 순서는 16:27. 실행 시각(16:10)은 그대로
      # (15:50 시작은 2026-11-20 사용자 — Yahoo 한국 시세 지연(약 20분)은 when 잡의 wait_close.py 가 종가 확정을 확인해 막는다).
      # kr.json 을 미리 한 번 만들어 묶음만 뽑는다(home_feed_kr 는 output/home/kr.json 만 쓴다 — 아래 Home kr.json 이 다시 만든다).
      # gh-pages 푸시 하루 +1. 실패하면 아래 원래 자리(Market briefing (pm))가 kr.json 푸시에 얹어 올린다
      - name: Market briefing early (pm)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          python "$KR_DIR/home_feed_kr.py"
          python experiments/market-commentary/build_briefing.py --slot pm --kr "$KR_DIR/output/home/kr.json" --out-dir deploy-brief
      - name: Deploy briefing early to gh-pages
        id: brief_push
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-brief/briefing/*.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-brief
          publish_branch: gh-pages
          keep_files: true

      # 그래프 — kr-images 브랜치를 그날 그림만으로 새로 만들어 덮어쓴다 (이력 없음, 2026-10-20 사용자: 이미지는 휘발성)
      - name: Deploy charts (kr-images branch, no history)
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-stocks/output/images/radar-*.webp') != ''
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          SUB="$(for f in "$KR_DIR"/output/images/radar-*.webp; do
            [ -f "$f" ] || continue
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
          done | git mktree)"
          TREE="$(printf '040000 tree %s\timages\n' "$SUB" | git mktree)"
          COMMIT="$(git commit-tree "$TREE" -m "KR stock charts $(date -u +%F) [skip ci]")"
          git push --force origin "$COMMIT:refs/heads/kr-images"
          for f in "$KR_DIR"/output/images/radar-*.webp; do
            curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@kr-images/images/$(basename "$f")" || true
          done
          echo "한국 종목 그래프 $(git ls-tree "$SUB" | wc -l)장 → kr-images"

      # 날짜 붙은 코스피 그래프 — 미국 S&P 500 그래프처럼 gh-pages 에 남긴다(keep_files). 휘발성 kr-images 에 두면 지난 날짜 글 그래프가 다음 날 깨진다 (2026-11-12)
      - name: Prepare KOSPI chart for gh-pages
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p deploy-kr/images
          cp experiments/kr-market-report/output/images/kospi-price-*.webp deploy-kr/images/ 2>/dev/null || echo "코스피 그래프 없음"
      - name: Deploy KOSPI chart to gh-pages
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-kr/images/*.webp') != ''
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-kr
          publish_branch: gh-pages
          keep_files: true

      - name: Publish pages (한국 시총 TOP 10 · 종목 35)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: python "$KR_DIR/publish_pages_kr.py"

      # ETF 고정 페이지 — 한국 상장 19개 (experiments/stock-etf, 2026-11-12 사용자 A안). 위 실행이 받은 일봉(snapshot)만 읽는다 · AI 0.
      # 구성 · 보수 · 순자산은 운용사 상품 페이지에서 주 1회(data/etf_kr_holdings.json, kr_holdings.py — 운영지침 D4-15-2), 미국 지수 ETF 예비 = 같은 지수 미국 ETF(data/etf_fund.json). 게시는 저장소 변수 ETF_PUBLISH=true 일 때만 — 그 전엔 그림자 모드(--dry)
      - name: ETF pages (한국 상장 19)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          ETF_PUBLISH: ${{ vars.ETF_PUBLISH }}
        run: |
          python experiments/stock-etf/etf_pages.py --market kr
          if [ "$ETF_PUBLISH" = "true" ]; then python experiments/stock-etf/publish_etf.py --market kr
          else echo "ETF 그림자 모드 — 게시하지 않는다 (저장소 변수 ETF_PUBLISH=true 로 켠다)"; python experiments/stock-etf/publish_etf.py --market kr --dry || true; fi

      # 한국 증시 리포트 글 — 하루 1편, 이미 있으면 건너뜀 (publish_report.py). 그래프가 kr-images 에 올라간 뒤
      - name: Publish KR market report
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-market-report/output/report_body.html') != ''
        continue-on-error: true
        run: |
          if [ "$DO_REPORT" = "true" ] && [ "$UPDATE_REPORT" = "true" ]; then python experiments/kr-market-report/publish_report.py --update
          elif [ "$DO_REPORT" = "true" ]; then python experiments/kr-market-report/publish_report.py
          else echo "리포트 그림자 모드 (저장소 변수 KR_REPORT_PUBLISH=true 로 켠다)"; python experiments/kr-market-report/publish_report.py --dry; fi

      # 홈 한국 탭 데이터 — 발행된 페이지만 링크 (pages_live.json)
      - name: Home kr.json
        if: steps.gate.outputs.go == 'true'
        run: |
          python "$KR_DIR/home_feed_kr.py"
          mkdir -p deploy-home && cp "$KR_DIR/output/home/kr.json" deploy-home/kr.json
          # 홈 실적 한 줄 자리 — 일정 없는 날 주요 뉴스 롤링의 한국 재료 (2026-11-19 사용자). 리포트 뉴스 탭과 같은 방송 이슈 제목, 같은 푸시에 얹는다
          [ -f experiments/kr-market-report/output/kr_news.json ] && cp experiments/kr-market-report/output/kr_news.json deploy-home/kr-news.json || true

      # 알파스코프 시황 해설 묶음 briefing/{날짜}-pm.json (2026-11-16 사용자) — 수집기가 읽어 저녁 편을 쓴다.
      # 방금 만든 kr.json + 공개 파일만 묶는다(AI 0). 아래 kr.json 푸시에 얹는다. 실패하면 수집기는 방송만으로 쓴다
      # 11-20 부터는 위 먼저 올리기(brief_push)가 실패한 날만 — 같은 파일을 두 번 덮어 generated 가 바뀌지 않게
      - name: Market briefing (pm)
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != '' && steps.brief_push.outcome != 'success'
        continue-on-error: true
        run: python experiments/market-commentary/build_briefing.py --slot pm --kr deploy-home/kr.json --out-dir deploy-home

      # 홈 한국 증시 카드 재료 cards/kr-report.json (H31, 2026-11-05) — 아래 kr.json 푸시에 같이 얹는다(푸시 추가 없음).
      # 글 주소는 publish_report.py 가 output/post_meta.json 에 남긴다(게시한 날 · 이미 게시된 날 모두). 실패해도 홈은 피드로 돈다
      - name: Home card kr-report.json
        if: steps.gate.outputs.go == 'true' && hashFiles('experiments/kr-market-report/output/post_meta.json') != ''
        continue-on-error: true
        run: python experiments/daily-report/home_card.py --card kr-report --body experiments/kr-market-report/output/report_body.html --meta experiments/kr-market-report/output/post_meta.json --out deploy-home/cards/kr-report.json --intraday "^KS11"   # 하루 그래프 5분봉 (2026-11-14)

      # 블로그 검색 즉답 색인 — 한국 (2026-11-11 사용자 "진행해"). 이 실행의 snapshot · extra 만 읽는다, AI 0.
      # 아래 kr.json 푸시에 얹는다 — gh-pages 쓰기 추가 없음. 실패 · 종목 부족이면 파일을 안 만들고 전날 것이 남는다
      - name: Search index (search/kr.json)
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != ''
        continue-on-error: true
        run: python experiments/site-search/build_search_index.py --market kr --out deploy-home/search/kr.json

      - name: Deploy kr.json to gh-pages
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home
          publish_branch: gh-pages
          keep_files: true

      - name: Purge kr.json cache
        if: steps.gate.outputs.go == 'true' && hashFiles('deploy-home/kr.json') != ''
        continue-on-error: true
        run: |
          # 푸시 직후 퍼지는 jsDelivr 가 아직 옛 커밋을 보고 전날 파일을 다시 붙잡는다(11-05 stocks.json) — 잠깐 기다린다
          sleep 10
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/kr.json" || true
          [ -f deploy-home/kr-news.json ] && curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/kr-news.json" || true
          [ -f deploy-home/search/kr.json ] && curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/search/kr.json" || true
          # 홈 카드는 옛 글로 연결되면 안 된다(11-10 미국 카드) — 내용 확인까지
          [ -f deploy-home/cards/kr-report.json ] && bash .github/scripts/jsd_purge.sh cards/kr-report.json deploy-home/cards/kr-report.json || true

      # 상태 저장 — snapshot 은 매번 새로 받으므로 빼고, 이어서 쌓는 것 · 마지막 자금 흐름(flows.json)
      - name: Save state (kr-state branch)
        if: always()
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          python experiments/record_store.py run-log "$KR_DIR/data" kr "${{ steps.run_kr.outcome }}" "job=${{ job.status }}"   # 실행 한 줄 — data/records/runs (2026-11-07, A3-3-2 의 1)
          # 임시 인덱스로 실제 경로(experiments/kr-stocks/data/…)를 그대로 올린다 — records/ 하위 폴더(매일 기록, 2026-11-01)까지 (옛: 파일만 mktree)
          export GIT_INDEX_FILE="$(mktemp -u)"
          for f in rank_state.json page_hashes.json pages_live.json etf_fund.json etf_kr_holdings.json nps.json etf_page_hashes.json etf_pages_live.json history.json dart_fin.json dart_fin_all.json dart_corp.json dart_company.json dart_earn.json dart_prelim.json dart_biz.json est_history.json report_posts.json flows.json last_good.json detail_cache.json broker_tg.json dart_list.json; do   # last_good.json = 빈 값 막기 (data_guard) · detail_cache.json = 칸별 주기로 받은 상세 값 (2026-11-12)   # flows.json = 마지막으로 받은 ECOS 자금 흐름 — 다음 날 ECOS 가 실패하면 이것을 쓴다 (2026-11-09 사용자)   # DART 캐시 — 이미 받은 보고서를 다시 부르지 않게 (2026-10-25)
            [ -f "$KR_DIR/data/$f" ] && git add -f "$KR_DIR/data/$f" || true
          done
          [ -d "$KR_DIR/data/records" ] && git add -f "$KR_DIR/data/records" || true   # 카드 판정 · 애널리스트 · 방송 의견 (stock_records, 데이터-기록-계획 A5-4)
          if [ -z "$(git ls-files)" ]; then unset GIT_INDEX_FILE; echo "저장할 상태 없음"; exit 0; fi
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/kr-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then echo "변경 없음"; exit 0; fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update kr-stocks state [skip ci]")"
          else
            COMMIT="$(git commit-tree "$TREE" -m "Update kr-stocks state [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/kr-state"
          echo "저장: $COMMIT"

  # 증시 전망 — 한국 장 마감 뒤 한 번 더 (2026-11-16 사용자: 한국 전망 타임라인이 다음 날 07:30 까지 멈춰 있었다).
  # 07:30 nvda-report 의 `Forecast pages` 단계와 같은 일 — 판정 · 기록 · 자동 등록(한국 오늘 봉) · 바뀐 페이지만 게시 · 증명 · hypo.json. AI 0.
  # 위 한국 종목 잡(kr-state 수급 · 판정 기록 저장) 뒤에 돈다 — 한국 근거(kr_why)가 오늘 것을 읽는다. 그 잡이 실패해도 돈다(전날 kr-state 로).
  # 상태 = nvda-state(forecast/ · records/forecasts · hypotheses · why/). 잡 concurrency 를 nvda-report 와 같은 이름으로 — 같은 브랜치에 동시에 쓰지 않게 줄 세운다.
  # 게시 게이트 = 아침 전망과 같은 NVDA_PUBLISH. 수동 실행은 publish 를 켰을 때만 이 잡이 돈다(상태 브랜치에 시험 기록을 남기지 않게).
  forecast-kr:   # 증시 전망 + 핫 이슈 낮 갱신 (2026-11-20 사용자 ①)
    needs: [when, kr-stocks]
    if: always() && needs.when.outputs.skip != 'true' && needs.kr-stocks.result != 'cancelled' && (github.event_name == 'schedule' || inputs.scheduled == true || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 20 → 25 (핫 이슈 단계 상한 8분)
    concurrency:
      group: nvda-report
      cancel-in-progress: false
    env:
      STATE_DIR: experiments/nvda-report/output/state
      FC_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.NVDA_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      # 시세 예비 사슬 (experiments/price_source.py) — 없는 키는 그 단계를 건너뛴다
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 방송 줄(kr_why) — 위 잡과 같은 날짜 파일 캐시를 이어 받는다(읽기만, 이 잡은 저장하지 않음 · 같은 키)
      - name: Media feed day key
        id: mfkey
        run: echo "d=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore media feed cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/alphascope-media
          key: media-feed-${{ github.workflow }}-${{ steps.mfkey.outputs.d }}
          restore-keys: media-feed-${{ github.workflow }}-

      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 줄 세운 뒤에 받는다 — 앞선 nvda-report 실행이 방금 쓴 것 위에 쌓는다
      - name: Load state (nvda-state · kr-state)
        run: |
          if git fetch state nvda-state:refs/nvda-state 2>/dev/null; then
            mkdir -p "$STATE_DIR"
            git archive refs/nvda-state "$STATE_DIR" | tar -x && echo "상태 불러옴"
          else
            echo "::error::nvda-state 없음 — 전망은 아침 실행이 처음 만든다"; exit 1
          fi
          git fetch --no-tags state kr-state:refs/remotes/state/kr-state 2>/dev/null || echo "kr-state 없음 — 한국 전망 근거는 방송 · 미국 줄만"

      - name: Forecast pages (증시 전망 · 한국 마감 뒤)
        id: fc
        run: |
          mkdir -p experiments/issue_store/output
          [ -f "$STATE_DIR/forecast/page_hashes.json" ] && cp "$STATE_DIR/forecast/page_hashes.json" experiments/issue_store/output/forecast_page_hashes.json || true
          python experiments/issue_store/forecast_daily.py --state "$STATE_DIR"
          if [ "$FC_PUBLISH" = "true" ]; then
            python experiments/issue_store/publish_forecast.py
          else
            python experiments/issue_store/publish_forecast.py --dry
          fi
          mkdir -p "$STATE_DIR/forecast" deploy-forecast/proof
          [ -f experiments/issue_store/output/forecast_page_hashes.json ] && cp experiments/issue_store/output/forecast_page_hashes.json "$STATE_DIR/forecast/page_hashes.json" || true
          cp experiments/issue_store/output/forecast/proof/*.json deploy-forecast/proof/ 2>/dev/null || true
          cp experiments/issue_store/output/forecast/hypo.json deploy-forecast/hypo.json 2>/dev/null || true

      # 새로 등록된 한국 전망의 증명 파일 · 홈 `증시 전망` 카드 — 아침 실행과 같은 자리(gh-pages, keep_files)
      - name: Deploy forecast proof + hypo.json to gh-pages
        id: fc_deploy
        if: env.FC_PUBLISH == 'true' && hashFiles('deploy-forecast/hypo.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-forecast
          publish_branch: gh-pages
          keep_files: true

      # 홈 증시 전망 카드 캐시 비우기 + 새 파일 확인 (2026-11-17 사용자 — 비우기가 없어 옛 판이 반나절 넘게 보였다)
      - name: Purge hypo.json cache
        if: steps.fc_deploy.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/jsd_purge.sh hypo.json deploy-forecast/hypo.json || true

      # 핫 이슈 — 한국 마감 뒤 한 번 더 (2026-11-20 사용자 ①: 한국 화면 핫 이슈가 13:02 판 그대로 다음 날 07:40 까지였다).
      # 13:00 낮 갱신과 같은 일 = AI 없이(판정은 07:30 본 실행이 하루 한 번) 구글 뉴스 한국어 검색 6번 + 시세(코스피 마감 포함) → 이슈 페이지 바뀐 것만 · 홈 Hot Issue 카드(issues.json).
      # 전망을 올린 뒤에 둔다(전망이 늦지 않게, 약 1분). 기록 · 캐시는 $STATE_DIR/records/issues → 아래 상태 저장. 실패해도 다른 단계는 그대로
      - name: Issue watch pages (핫 이슈 · 한국 마감 뒤)
        id: iw
        if: "!cancelled() && steps.fc.outcome != 'skipped'"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python experiments/issue_store/issue_watch_daily.py --state "$STATE_DIR"
          mkdir -p deploy-issue && cp experiments/issue_store/output/issue/issues.json deploy-issue/issues.json 2>/dev/null || true
          if [ "$FC_PUBLISH" = "true" ]; then
            python experiments/issue_store/publish_issue.py --state "$STATE_DIR"
          else
            python experiments/issue_store/publish_issue.py --state "$STATE_DIR" --dry
          fi
      - name: Deploy issues.json to gh-pages
        id: iw_deploy
        if: env.FC_PUBLISH == 'true' && steps.iw.outcome == 'success' && hashFiles('deploy-issue/issues.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-issue
          publish_branch: gh-pages
          keep_files: true
      - name: Purge issues.json cache
        if: steps.iw_deploy.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/jsd_purge.sh issues.json deploy-issue/issues.json || true

      # 전망 판정까지 끝났으면 저장 — nvda-state 위에 이어 쌓기(force 없음). 받은 상태 전체를 그대로 다시 올리고 바뀐 전망 파일만 달라진다
      - name: Save state (nvda-state branch)
        if: always() && steps.fc.outcome != 'skipped'
        run: |
          [ -f "$STATE_DIR/items.jsonl" ] || { echo "저장할 상태 없음"; exit 0; }
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          PARENT="$(git rev-parse --verify -q refs/nvda-state)"
          if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then echo "변경 없음"; exit 0; fi
          COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update forecast state (KR close) [skip ci]")"
          git push state "$COMMIT:refs/heads/nvda-state"
          echo "저장: $COMMIT"
