name: Media Daily

# 미디어 데일리 (experiments/media-daily) — 유튜브 수집기(red9keep/yutb-sub) 요약으로 "방송이 본 미국장" 글.
# 평일 KST 08:00 1차 발행(밤사이 클립 + 당잠사), 10:15 같은 글 갱신(Mad Money · 증시각도기). 기획: doc/기획/유튜브-자막-기사-검토.md 11절.
#
# 정시 실행은 Cloudflare Worker 가 KST 표로 건다 (infra/cron-trigger, 한국 방송 시각에 묶여 있어 서머타임을 따르지 않는다). 아래 cron 은 예비.
# 게시 게이트: 저장소 변수 MEDIA_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다 — 그 전까지 그림자 모드(본문만 만들어 artifact 로).
# 2026-10-30 부터 미디어 데일리 글 자체는 내지 않는다 (Run pipeline 에 --publish 없음). 이 워크플로가 남아 있는 이유 = 데일리 글 '한국장' 칸 갱신(kr_news.py) + 방송 이슈 기록(media-state).
# 재료(Firestore)는 Secret YTB_FIRESTORE_KEY(읽기 전용 서비스 계정) 로 읽는다. 우리 기록(records/)은 media-state 브랜치에 쌓는다.

on:
  schedule:
    - cron: '0 23 * * 0-4'    # 예비 — 23:00 UTC = KST 08:00 (월~금)
    - cron: '15 1 * * 1-5'    # 예비 — 01:15 UTC = KST 10:15 (월~금)
  workflow_dispatch:
    inputs:
      phase:
        description: '1 = 아침 1차 (07:55 컷), 2 = 10:15 갱신, auto = 한국 시각으로 판단'
        type: string
        required: false
        default: 'auto'
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      edition:
        description: '판 날짜 YYYY-MM-DD (비우면 오늘 KST) — 지난 판을 새 렌더러로 다시 올릴 때 (같은 제목 글 갱신, 2026-10-24)'
        type: string
        required: false
        default: ''
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false
      records_only:
        description: '방송 기록만 — AI 서술 · 한국장 칸 갱신 건너뜀 (11:50 예비 · 수집기 매드머니 알림 Q36, 2026-11-20)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write   # 매드머니 새 회차를 기록하면 인물 발언 갱신(people-radar mode=madmoney)을 건다 (2026-11-20)

concurrency:
  group: media-daily
  cancel-in-progress: false

env:
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  # 운영 기록 → Cloudflare KV (experiments/ops_log.py · infra/ops-console, 2026-10-23). 셋 중 하나라도 없으면 기록하지 않는다
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  STATE_DIR: experiments/media-daily/output/state
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.MEDIA_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

jobs:
  media-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다. 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r experiments/media-daily/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # cluster.py 가 데일리 기록(state/report-state records/issues)으로 중복을 표시한다. 우리 기록은 media-state 에
      - name: Fetch report-state / media-state
        run: |
          for b in report-state media-state; do
            git fetch --no-tags state "$b:refs/remotes/state/$b" 2>/dev/null && echo "$b 받음" || echo "$b 없음"
          done
          if git rev-parse --verify -q refs/remotes/state/media-state > /dev/null; then
            git archive refs/remotes/state/media-state "$STATE_DIR" | tar -x && echo "기록 불러옴"
          fi

      - name: Run pipeline
        id: run_media
        working-directory: experiments/media-daily
        run: |
          PHASE="${{ inputs.phase || 'auto' }}"
          if [ "$PHASE" = "auto" ]; then
            # 한국 시각 09:30 전이면 1차, 뒤면 2차 갱신
            if [ "$(TZ=Asia/Seoul date +%H%M)" -lt 0930 ]; then PHASE=1; else PHASE=2; fi
          fi
          EDITION="${{ inputs.edition }}"
          ED_ARG=""
          if [ -n "$EDITION" ]; then ED_ARG="--edition $EDITION"; fi
          echo "phase=$PHASE publish=$DO_PUBLISH edition=${EDITION:-today}"
          # 미디어 데일리 글은 2026-10-30 부터 내지 않는다.
          # 파이프라인은 그림자로 계속 돌린다 — 기록(records/issues · verdicts, media-state)과 artifact 는 남긴다. 아래 '한국장 칸 갱신' 은 그대로 DO_PUBLISH 를 따른다.
          LLM_ARG=""
          if [ "${{ inputs.records_only }}" = "true" ]; then LLM_ARG="--no-llm"; fi   # 글을 내지 않으므로 서술 AI 가 필요 없다
          python main.py --phase "$PHASE" --state output/state $ED_ARG $LLM_ARG

      # 오늘 데일리 글의 한국장 탭 `한국장에 영향을 줄 만한 소식` 만 갱신 — 한국 아침 방송은 데일리(07:00)보다 늦게 올라온다.
      # 게시 실행일 때만 · 지난 날짜(edition 입력)는 건너뜀 · 실패해도 미디어 데일리는 그대로 (continue-on-error)
      - name: Update daily Korea news
        if: env.DO_PUBLISH == 'true' && inputs.edition == '' && inputs.records_only != true
        continue-on-error: true
        run: python experiments/daily-report/kr_news.py

      - name: Save records (media-state branch)
        if: always()
        run: |
          if [ ! -d "$STATE_DIR/records" ]; then echo "기록 없음 — 건너뜀"; exit 0; fi
          python experiments/record_store.py run-log "$STATE_DIR" media "${{ steps.run_media.outcome }}" "job=${{ job.status }}"   # 실행 한 줄 — records/runs (2026-11-07, A3-3-2 의 1)
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/remotes/state/media-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then echo "변경 없음"; exit 0; fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update media-daily records [skip ci]")"
          else
            COMMIT="$(git commit-tree "$TREE" -m "Update media-daily records [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/media-state"   # force 없음

      # 그날(KST) 매드머니 회차를 이번 실행에서 처음 기록했으면 인물 발언 갱신을 건다.
      # 매드머니는 KST 09:30 ~ 10:30 게시 → 10:15 · 11:50(예비) · 수집기 알림(News-doc 39절 Q36) 실행 가운데 처음 기록한 실행이 한 번 건다.
      # 인물 발언 쪽도 오늘 아침 글이 없거나 이미 실렸으면 스스로 끝난다. GITHUB_TOKEN 으로 건 workflow_dispatch 는 새 실행을 만든다.
      - name: Chain people-radar (Mad Money)
        if: env.IS_SCHEDULED == 'true' && inputs.edition == '' && steps.run_media.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Y="$(TZ=Asia/Seoul date +%Y)"
          F="$STATE_DIR/records/issues/$Y.jsonl"
          OLD="$(mktemp)"
          git show "refs/remotes/state/media-state:$F" > "$OLD" 2>/dev/null || true
          NEW_IDS="$(python - "$F" "$OLD" <<'PY'
          import datetime, json, sys
          kst = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(kst).strftime("%Y-%m-%d")
          def ids(text):
              out = set()
              for line in text.splitlines():
                  try:
                      r = json.loads(line)
                  except ValueError:
                      continue
                  p = r.get("published") or ""
                  if r.get("source") == "ytb" and r.get("channel") == "CNBC Mad Money" and p:
                      d = datetime.datetime.strptime(p[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=datetime.timezone.utc).astimezone(kst)
                      if d.strftime("%Y-%m-%d") == today:
                          out.add(str(r.get("id")))
              return out
          def read(path):
              try:
                  return open(path, encoding="utf-8").read()
              except OSError:
                  return ""
          print(len(ids(read(sys.argv[1])) - ids(read(sys.argv[2]))))
          PY
          )"
          echo "오늘 매드머니 새 기록 ${NEW_IDS}줄"
          if [ "${NEW_IDS:-0}" -gt 0 ]; then
            gh workflow run people-radar.yml -R "${{ github.repository }}" --ref main -f mode=madmoney -f scheduled=true && echo "인물 발언 매드머니 갱신 걸음"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-daily
          path: |
            experiments/media-daily/output/media.json
            experiments/media-daily/output/media.html
            experiments/media-daily/output/narrative.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 방송 이슈 (미디어 데일리)\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
