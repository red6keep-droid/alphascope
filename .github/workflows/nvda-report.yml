name: NVDA Report

# 엔비디아 데일리 리포트 (experiments/nvda-report). 별도 글 시리즈("엔비디아 리포트 — YYYY년 M월 D일").
# trump-trend.yml을 복제해 이름·경로·시각만 바꿨다 (기획서 11절).
#
# 게시 게이트: 저장소 변수 NVDA_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다. 그 전까지는 그림자 모드.
# 수동 실행은 publish 입력으로 개별 결정.
#
# 상태(모든 테이블의 JSONL)와 산출물은 nvda-state 브랜치에 매일 이전 커밋 위에 쌓는다 (일반 push, force 없음).
# 브랜치는 임시 인덱스 + commit-tree 로 만든다 — checkout 하면 방금 만든 output/state 가 옛 버전으로 덮어써진다.

on:
  schedule:
    # 정시 실행은 Cloudflare Worker가 뉴욕 17:30(KST 06:30 서머타임 / 07:30 표준시)에 건다 (infra/cron-trigger).
    # trump-trend(뉴욕 17:15)보다 15분 뒤 — trump_bridge가 그날 trump-state를 읽는다.
    # 옵션 체인은 미국 장 마감 후~뉴욕 자정에만 유효하므로 이 시각이 창 안이다. 주말도 돈다(공시·뉴스만).
    # GitHub cron은 예비 — 22:30 UTC = 07:30 KST, 계절과 상관없이 장 마감 뒤이고 트럼프 예비(22:15)보다 15분 뒤.
    - cron: '30 22 * * *'
    # 낮 갱신 — 종목 페이지만 다시 그린다 (2026-11-04 사용자 P290: 아침 실행 뒤 들어온 방송 의견이 다음 날까지 안 보였다).
    # 04:00 UTC = 13:00 KST, 미국 장 밖. check 가 `오늘 본 실행 끝남` 이면 mode=refresh (13:00 UTC 넘으면 skip — 장중 값 게시 금지)
    - cron: '0 4 * * *'
  # 이어 붙이기 (2026-11-20 사용자 "미국 실행 한 줄로"): 미국 증시 리포트(16:40 NY)가 글을 게시하면 바로 — 옛 17:30 NY 고정 시각은 예비로 남는다.
  # 붙을지는 check 잡이 가린다(리포트의 `Publish to Blogger` 단계 성공 · KST 05~10시). 오전에 이미 돌았으면 예비는 건너뛴다(아래 모드)
  workflow_run:
    workflows: ["Test Daily Report"]
    types: [completed]
  workflow_dispatch:
    inputs:
      narrate:
        description: 'Gemini 서술(⑦) 생성'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read   # 이어 붙이기 확인 — 리포트 실행의 단계 결과를 읽는다

concurrency:
  group: nvda-report
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Gemini 키 하나 — 리포트별 키(_NVDA · _DAILY · _TRUMP)는 2026-11-20 사용자가 시크릿에서 지움, 참조도 없앰 (운영지침 D3-1a)
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # AI 호출 알림 — 한도 · 예비 사용 · 전부 실패 (llm_chain, 2026-10-14)
  # 운영 기록 → Cloudflare KV (experiments/ops_log.py · infra/ops-console, 2026-10-23). 셋 중 하나라도 없으면 기록하지 않는다
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  # yfinance 예비 사슬 (experiments/price_source.py, 2026-10-21). 없는 키는 그 단계를 건너뛴다
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Gemini 키 전부 쿨다운일 때 예비 1순위 gpt-oss-120b (2026-10-11)
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 예비 2순위 DeepSeek
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 방송 줄 (experiments/media_feed.py, 2026-10-25) — 미디어 데일리와 같은 읽기 전용 키. 없으면 방송 줄 없이 돈다
  COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  STATE_DIR: experiments/nvda-report/output/state
  # GitHub cron은 자주 늦거나 빠진다(2026-10-13 하루치 전부 누락). 같은 시각에 Cloudflare Worker가
  # scheduled=true 로 workflow_dispatch를 건다 — 그 실행도 스케줄로 취급한다 (infra/cron-trigger).
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.scheduled == true }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.scheduled == true) && vars.NVDA_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  # 스케줄(외부 cron 포함)은 GitHub cron과 외부 cron이 하루 두 번 넘게 걸 수 있다. 실행 모드(check.mode):
  #   full    = 오늘 첫 실행 — 엔비디아 파이프라인 · 종목 페이지 · 그래프 · 테마 페이지 전부
  #   refresh = 오늘 본 실행이 끝난 뒤(13:00 UTC 전) — 종목 페이지만 다시 그려 올린다 (방송 · 뉴스 의견 갱신, 2026-11-04 P290). 상태 저장은 같이(기록은 날짜 · id 로 덮어써 두 줄이 안 된다)
  #   skip    = 오늘 끝났고 미국 장중 · 장 뒤 — 아무것도 안 한다 (장중 값 게시 금지, 운영 기록 10-24)
  # 수동 실행은 확인하지 않는다(mode 비어 있음 = full) — 같은 제목 글을 덮어써 다시 만드는 용도.
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        if: env.IS_SCHEDULED == 'true'

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      # 이 check 잡은 예약 실행만 확인한다 — 위 checkout 과 같은 조건. 조건이 없어 사람이 누른 수동 실행이 `not in a git directory` 로 8초 만에 실패했다 (2026-11-10)
      - name: State repo (private alphascope-state)
        if: env.IS_SCHEDULED == 'true'
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        if: env.IS_SCHEDULED == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 2026-11-01 엔비디아 매일 글을 그만두고 고정 페이지로 — 오늘 글이 있나 대신 `오늘(KST 05:00 뒤) 상태 저장이 있나` 로 하루 두 번 실행을 막는다
      - name: Check if today's run already finished
        id: check
        if: env.IS_SCHEDULED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UP_ID: ${{ github.event.workflow_run.id }}
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ github.event_name }}" = workflow_run ]; then
            # 리포트가 오늘 글을 게시한 실행 뒤에만 (이미 게시돼 건너뛴 재시도 · 낮 실행 뒤에는 붙지 않음)
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UP_ID/jobs?per_page=50" -q '[.jobs[] | select(.name == "daily-report") | .steps[] | select(.name == "Publish to Blogger" and .conclusion == "success")] | length' || echo 0)
            if [ "${ok:-0}" -eq 0 ] || [ "$H" -lt 5 ] || [ "$H" -gt 10 ]; then
              echo "이어 붙일 실행이 아님 (리포트 게시 ${ok:-?} · KST ${H}시) → 건너뜀"; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "리포트 게시 뒤 이어 붙임 (KST ${H}시)"
          fi
          MODE=full
          if git fetch -q state nvda-state 2>/dev/null; then
            LAST=$(git log -1 --format=%ct --invert-grep --grep='news-early' FETCH_HEAD)   # 04:30 뉴스 먼저 실행(radar-news-early.yml)의 커밋은 세지 않는다
            SINCE=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 05:00" +%s)
            if [ "$LAST" -ge "$SINCE" ]; then
              if [ "$H" -lt 11 ]; then MODE=skip   # 오전 = 리포트 뒤 이어 붙인 실행이 이미 함 → 07:30 예비는 건너뜀 (2026-11-20, 옛: 갱신으로 한 번 더 돌았다)
              elif [ "$(date -u +%H)" -lt 13 ]; then MODE=refresh; else MODE=skip; fi   # 13:00 UTC 전 = 미국 장 전(프리마켓 포함)만 갱신
            fi
          fi
          echo "실행 모드: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  nvda-report:
    needs: check
    if: needs.check.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 2026-10-20 실측 994초. 고정 페이지가 늘수록 길어짐 — 바뀐 것만 쓰기로 줄인다 (운영지침 D2-2)
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 방송 요약 날짜 파일 캐시 (experiments/media_feed.py, 2026-11-16 수집기 요청 News-doc/블로그-Firestore-읽기-줄이기.md).
      # 그제 이전 edition 만 들어 있다 — 실행마다 Firestore 는 오늘 · 어제 묶음만 읽는다. 키 = 워크플로 · KST 날짜(하루 한 번 저장, 날짜가 바뀌면 전날 것을 이어 받는다)
      - name: Media feed day key
        id: mfkey
        run: echo "d=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore media feed cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/alphascope-media
          key: media-feed-${{ github.workflow }}-${{ steps.mfkey.outputs.d }}
          restore-keys: media-feed-${{ github.workflow }}-

      # publish.py가 daily-report의 publish_blogger를 가져다 쓰므로 그쪽 의존성(google-auth)도 필요하다.
      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이전 실행의 DB 상태(모든 테이블 JSONL). 없으면 첫 실행 — 일봉 2년·EDGAR 90일·문서 30일·점검표 5분기 백필.
      - name: Load state (nvda-state branch)
        run: |
          if git fetch state nvda-state:refs/nvda-state 2>/dev/null; then
            mkdir -p "$STATE_DIR"
            if git archive refs/nvda-state "$STATE_DIR" | tar -x; then
              echo "상태 불러옴: items $(wc -l < "$STATE_DIR/items.jsonl" 2>/dev/null || echo 0)행 · 일봉 $(wc -l < "$STATE_DIR/daily_bars.jsonl" 2>/dev/null || echo 0)행"
            fi
          else
            echo "이전 상태 없음 (첫 실행)"
          fi
          # 트럼프 반응 통계 — trump_bridge 가 state/trump-state 를 git show 로 읽는다 (2026-11-04: 공개 raw URL 대신)
          git fetch --no-tags state trump-state:refs/remotes/state/trump-state 2>/dev/null || echo "trump-state 없음 — 트럼프 구획 없이"
          # 한국 전망 근거 — kr_why 가 state/kr-state 를 git show 로 읽는다(외국인 수급 · 실적 공시일 · 애널리스트 평균 · 알파스코프 신호, 2026-11-12). 읽기만
          git fetch --no-tags state kr-state:refs/remotes/state/kr-state 2>/dev/null || echo "kr-state 없음 — 한국 전망 근거는 방송 · 미국 줄만"
          # 인물 발언 (종목 · 증시 리포트 `인물 발언` 구획, 2026-11-07 P324) — 인물 레이더가 radar-state 에 남긴 파일. 없으면 구획을 뺀다
          mkdir -p experiments/people-radar/output/state
          if git fetch --no-tags state radar-state:refs/remotes/state/radar-state 2>/dev/null; then
            git show refs/remotes/state/radar-state:experiments/people-radar/output/state/people_mentions.json > experiments/people-radar/output/state/people_mentions.json 2>/dev/null && echo "인물 발언 파일 받음" || { rm -f experiments/people-radar/output/state/people_mentions.json; echo "인물 발언 파일 없음"; }
          else
            echo "radar-state 없음 — 인물 발언 구획 없이"
          fi

      - name: Run pipeline
        id: run_nvda
        if: needs.check.outputs.mode != 'refresh'
        run: |
          # 2026-11-01 사용자: 엔비디아도 고정 페이지 · 뉴스는 공용 처리 — 엔비디아 전용 뉴스 수집 · AI 분류 · Gemini 서술은 끈다.
          # 남는 일 = 일봉 · 캘린더(시장 일정 — 종목 페이지가 이 DB 를 읽는다) · 상태판. 소송 일정은 stock-radar/court.py 가 맡는다
          ARGS="--import-state $STATE_DIR --export-state $STATE_DIR --skip-feeds --skip-classify"
          # 게시는 아래 별도 단계에서 — 가격 그래프 PNG가 gh-pages에 먼저 올라가 있어야 글의 <img>가 깨지지 않는다 (2026-10-11)
          python experiments/nvda-report/main.py $ARGS

      # 2026-11-10 사용자: 종목 레이더 뒤에 있던 증시 전망을 앞으로 — 레이더(AI 뉴스 분류)가 길어져 60분 제한에 걸리면
      # 전망 판정 · 기록이 통째로 빠졌다(11-09 ~ 11-10 여섯 번). 전망은 AI 0 · 레이더와 독립이라 먼저 돌린다. 기록은 아래 Save state(always)가 저장
      # 증시 전망 (doc/기획/증시-전망-기획.md 5절 · 14-1 5, 2026-11-08 연결). AI 0 · 시세는 forecast_daily 가 직접 받는다(yfinance → 예비 사슬).
      # 판정 → 기록(상태 $STATE_DIR/records/forecasts/{EH}.jsonl, 아래 Save state 가 nvda-state 에 커밋) → 고정 페이지(공개 전망 n + 목록 1, 바뀐 것만) → 증명 · 홈 카드 JSON(gh-pages).
      # 장 마감 뒤 본 실행만 — 갱신(refresh) 실행은 같은 날 봉이라 판정이 같다. 실패해도 다른 단계는 그대로(continue-on-error), 실패 알림은 forecast_alerts.
      - name: Forecast pages (증시 전망)
        if: needs.check.outputs.mode != 'refresh'
        continue-on-error: true
        run: |
          mkdir -p experiments/issue_store/output
          [ -f "$STATE_DIR/forecast/page_hashes.json" ] && cp "$STATE_DIR/forecast/page_hashes.json" experiments/issue_store/output/forecast_page_hashes.json || true
          python experiments/issue_store/forecast_daily.py --state "$STATE_DIR"
          if [ "$DO_PUBLISH" = "true" ]; then
            python experiments/issue_store/publish_forecast.py
          else
            python experiments/issue_store/publish_forecast.py --dry
          fi
          mkdir -p "$STATE_DIR/forecast" deploy-forecast/proof
          [ -f experiments/issue_store/output/forecast_page_hashes.json ] && cp experiments/issue_store/output/forecast_page_hashes.json "$STATE_DIR/forecast/page_hashes.json" || true
          cp experiments/issue_store/output/forecast/proof/*.json deploy-forecast/proof/ 2>/dev/null || true
          cp experiments/issue_store/output/forecast/hypo.json deploy-forecast/hypo.json 2>/dev/null || true

      # 이슈 모니터링 (2026-11-13 사용자: 이란 전쟁 · 관세 · 반도체 수출 통제, 운영 연결 + 바로 공개). AI = 본 실행에서 하루 한 번 사건 판정(json-backup-first, 이슈마다 최대 5회 · 2분).
      # 본 실행(07:30) · 갱신 실행(13:00) 둘 다 = 하루 두 번. 구글 뉴스 한국어 검색 실행당 6번(이슈 3 × 오늘 · 어제), 캐시 · 기록 · 해시 = $STATE_DIR/records/issues (아래 Save state 가 저장)
      # 고정 페이지 3장(/p/issue-iran · issue-tariff · issue-export) — 바뀐 것만 쓴다. 실패해도 다른 단계는 그대로
      - name: Issue watch pages (이슈 모니터링)
        continue-on-error: true
        run: |
          # 먼저 저장된 판정으로(AI 없이) 게시 — 홈 Hot Issue 가 AI 판정(약 4분, Groq 60초 간격 대기)을 기다리지 않게 (2026-11-20 사용자 ③).
          # AI 판정(하루 한 번, 본 실행만)은 종목 페이지 게시 뒤 `Issue watch AI` 단계가 하고 바뀐 것만 다시 올린다
          python experiments/issue_store/issue_watch_daily.py --state "$STATE_DIR"
          mkdir -p deploy-forecast && cp experiments/issue_store/output/issue/issues.json deploy-forecast/issues.json 2>/dev/null || true   # 홈 Hot Issue 카드 자료 — 아래 hypo.json 배포와 같이 gh-pages 로 (07:30 본 실행, 2026-11-16 사용자)
          if [ "$DO_PUBLISH" = "true" ]; then
            python experiments/issue_store/publish_issue.py --state "$STATE_DIR"
          else
            python experiments/issue_store/publish_issue.py --state "$STATE_DIR" --dry
          fi

      # 공개 등록 증명(proof/{slug}.json — 커밋 시각 = 미리 적었다는 증명, 내용은 등록 때 고정) · 홈 `증시 전망` 카드 자료(hypo.json)
      - name: Deploy forecast proof + hypo.json to gh-pages
        id: fc_deploy
        if: env.DO_PUBLISH == 'true' && needs.check.outputs.mode != 'refresh' && hashFiles('deploy-forecast/hypo.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-forecast
          publish_branch: gh-pages
          keep_files: true

      # 홈 증시 전망 · Hot Issue 카드 캐시 비우기 + 새 파일 확인 (2026-11-17 사용자) — 비우기가 없어 jsDelivr 가 11-17 오후까지
      # issues.json 은 11-16 07:40 판, hypo.json 은 새벽 02:28 판을 내줬다(카드 `11월 16일 아침`). 홈의 ?v= 는 jsDelivr 가 무시한다.
      - name: Purge hypo.json · issues.json cache
        if: steps.fc_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          bash .github/scripts/jsd_purge.sh hypo.json deploy-forecast/hypo.json || true
          [ -f deploy-forecast/issues.json ] && bash .github/scripts/jsd_purge.sh issues.json deploy-forecast/issues.json || true

      # 시총 TOP 10 고정 페이지 20개 (experiments/stock-radar, 2026-10-18 첫 발행). 엔비디아 DB(일정) · 그래프 코드를 같이 쓰므로 이 실행 안에서 돈다.
      # 이어서 쌓는 파일(뉴스 분류 · 변동성 이력 · 순위 교체 상태)만 nvda-state 의 radar/ 에 둔다. 일봉 snapshot 은 매번 새로 받는다.
      # 실패해도 엔비디아 글은 나간다 (continue-on-error).
      - name: Run stock radar (시총 TOP 10 pages)
        id: run_radar
        continue-on-error: true
        env:
          NEWS_MAX_MINUTES: '15'   # 뉴스 분류 시간 예산 30 → 15분 (2026-11-10) — 남은 기사는 다음 실행, 1시간 안에 끝까지 가게
          RADAR_COURT: '0'   # 소송 일정 조회(17건 × 13초 ≈ 4분)는 게시 뒤 `Court schedule` 단계에서 하루 한 번 — 화면은 전날 일정 (2026-11-20 사용자 ②)
          PYTHONUNBUFFERED: '1'   # 출력 바로 — 수집 · 분류 구간 시간을 로그로 가를 수 있게
        run: |
          mkdir -p experiments/stock-radar/data
          if [ -d "$STATE_DIR/radar" ]; then cp "$STATE_DIR"/radar/*.json experiments/stock-radar/data/ 2>/dev/null || true; fi
          python experiments/stock-radar/main.py
          mkdir -p "$STATE_DIR/radar"
          for f in news.json news_summaries.json iv_history.json history.json rank_state.json capex.json est_history.json court.json last_good.json detail_cache.json; do   # last_good.json = 빈 값 막기의 지난 좋은 값 (data_guard) · detail_cache.json = 칸별 주기로 받은 상세 값 (2026-11-12)   # news_summaries.json = 기사 요약 캐시 (P341, 같은 기사를 다시 AI 에 보내지 않게)   # court.json = 소송 일정 (P270)   # capex.json = 돈을 어디에 쓰나 분기 표 (기록 보존, 2026-10-30)
            [ -f "experiments/stock-radar/data/$f" ] && cp "experiments/stock-radar/data/$f" "$STATE_DIR/radar/$f"
          done

      # 홈 종목 줄(stocks.json) · 검색 색인 먼저 (2026-11-20 사용자 ④) — 옛: 종목 76쪽 게시(약 7분) · ETF · 테마 뒤라 홈 종목 카드가 가장 늦었다.
      # 발행된 페이지 목록 = 지난 게시가 남긴 페이지 해시(publish_pages 의 live 와 같은 셈). 오늘 새로 생기는 페이지(하루 10쪽까지)는 게시 뒤 단계가 다시 올린다
      - name: Home stocks.json early
        id: home_early
        if: env.DO_PUBLISH == 'true' && steps.run_radar.outcome == 'success'
        continue-on-error: true
        run: |
          D=experiments/stock-radar/data
          [ -f "$D/pages_live.json" ] || python -c "import json,sys;h=json.load(open(sys.argv[1]));json.dump(sorted(h),open(sys.argv[2],'w'))" "$D/page_hashes.json" "$D/pages_live.json"
          python experiments/stock-radar/home_feed.py
          mkdir -p deploy-home-early/search && cp experiments/stock-radar/output/home/stocks.json deploy-home-early/stocks.json
          python experiments/site-search/build_search_index.py --market us --out deploy-home-early/search/us.json || rm -rf deploy-home-early/search
          rm -f "$D/pages_live.json"   # 게시 단계가 진짜 목록을 새로 쓴다
      - name: Deploy home stocks.json early
        id: home_early_deploy
        if: steps.home_early.outcome == 'success' && hashFiles('deploy-home-early/stocks.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home-early
          publish_branch: gh-pages
          keep_files: true
      - name: Purge home stocks.json cache (early)
        if: steps.home_early_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          bash .github/scripts/jsd_purge.sh stocks.json deploy-home-early/stocks.json || true
          [ -f deploy-home-early/search/us.json ] && curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/search/us.json" || true

      # 돈이 어디로 가나 — 업종 11 · 세부 업종 20 · 시장의 하루 한 줄 기록 (experiments/flow_records.py, 2026-11-20 사용자 "스마트 머니 · 순환매 … 진행해줘").
      # 화면 · AI 없음. 위 레이더가 받은 일봉만 읽고, 야후 ETF 순자산 32개만 새로 받는다(지난 값은 다시 못 받아 오늘부터 쌓는다).
      # 장 마감 뒤 본 실행만(갱신 실행은 같은 날 봉). 기록 = $STATE_DIR/radar/records/flows/{연도}.jsonl — 아래 Save state 가 nvda-state 에 커밋. 실패해도 넘어간다
      - name: Flow records (업종 · 세부 업종 돈의 흐름 기록)
        if: needs.check.outputs.mode != 'refresh'
        continue-on-error: true
        run: |
          if [ -f experiments/stock-radar/data/snapshot.json ]; then
            python experiments/flow_records.py --state "$STATE_DIR/radar"
          else
            echo "::warning::레이더 일봉 파일 없음 — 오늘 돈의 흐름 기록 없음"
          fi

      # 옛 엔비디아 날짜 글의 가격 그림(nvda-price-{day}.webp)을 gh-pages 에 올리던 단계 · 캐시 비우기는 2026-11-17 뺐다 —
      # 날짜 글은 11-01 끝나 아무 글도 그 그림을 안 쓰는데 하루 1장씩 gh-pages 에 쌓였다(사용자 "그림 단계만 먼저 빼줘"). 남은 그림은 30일 정리(image_prune.py)가 지운다.

      # 종목 그래프 — radar-images 브랜치를 그날 그림만으로 새로 만들어 덮어쓴다(부모 커밋 없음 = 이력 없음, 2026-10-20 사용자: 이미지는 휘발성).
      # gh-pages(keep_files)에 두면 매일 수십 장이 커밋 이력에 쌓인다. 페이지 <img> 주소는 render_pages.chart_url (@radar-images).
      - name: Deploy stock charts (radar-images branch, no history)
        if: needs.check.outputs.mode != 'refresh' && hashFiles('experiments/stock-radar/output/images/radar-*.webp') != ''   # 갱신 실행은 같은 날 봉 — 그래프는 아침 것 그대로
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # 트리를 직접 만든다 (images/ 아래 그날 PNG 만) — 작업 폴더 · 다른 브랜치 내용이 섞이지 않게
          SUB="$(for f in experiments/stock-radar/output/images/radar-*.webp; do
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
          done | git mktree)"
          TREE="$(printf '040000 tree %s\timages\n' "$SUB" | git mktree)"
          COMMIT="$(git commit-tree "$TREE" -m "Stock charts $(date -u +%F) [skip ci]")"
          git push --force origin "$COMMIT:refs/heads/radar-images"
          echo "종목 그래프 $(git ls-tree "$SUB" | wc -l)장 → radar-images (이력 없이 덮어씀)"

      # 엔비디아 날짜별 글 게시(publish.py)는 2026-11-01 그만뒀다 — 엔비디아는 아래 종목 고정 페이지(nvidia-nvda-stock)로. 지난 글은 블로그에 그대로

      # 시총 TOP 10 · 종목 고정 페이지 갱신 (엔비디아 포함, 2026-11-01). 그래프는 이름이 고정이라 jsDelivr 캐시를 먼저 비운다.
      - name: Publish stock pages (시총 TOP 10)
        if: env.DO_PUBLISH == 'true'
        continue-on-error: true
        run: |
          for f in experiments/stock-radar/output/images/radar-*.webp; do
            [ -f "$f" ] && curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@radar-images/images/$(basename "$f")" || true
          done
          python experiments/stock-radar/publish_pages.py
          # 올린 본문 해시 — 다음 실행에서 같은 페이지를 다시 PUT 하지 않게 (publish_pages.HASHES, 2026-10-21 운영지침 D2-2)
          mkdir -p "$STATE_DIR/radar"
          [ -f experiments/stock-radar/data/page_hashes.json ] && cp experiments/stock-radar/data/page_hashes.json "$STATE_DIR/radar/page_hashes.json" || true
          # 홈 `관심 종목` · `섹터 상위 종목` 카드 데이터 (2026-10-21 사용자) — 발행된 페이지만 링크
          python experiments/stock-radar/home_feed.py
          mkdir -p deploy-home && cp experiments/stock-radar/output/home/stocks.json deploy-home/stocks.json

      # ETF 고정 페이지 — 미국 상장 18개 (experiments/stock-etf, 2026-11-12 사용자 A안). 위 레이더 snapshot 일봉만 읽는다 · AI 0.
      # 구성 · 기본 정보는 주 1회만 받는다(data/etf_fund.json). 게시는 저장소 변수 ETF_PUBLISH=true 일 때만 — 그 전엔 그림자 모드(--dry)
      - name: ETF pages (미국 상장 18)
        if: env.DO_PUBLISH == 'true'
        continue-on-error: true
        env:
          ETF_PUBLISH: ${{ vars.ETF_PUBLISH }}
        run: |
          python experiments/stock-etf/etf_pages.py --market us
          if [ "$ETF_PUBLISH" = "true" ]; then python experiments/stock-etf/publish_etf.py --market us
          else echo "ETF 그림자 모드 — 게시하지 않는다 (저장소 변수 ETF_PUBLISH=true 로 켠다)"; python experiments/stock-etf/publish_etf.py --market us --dry || true; fi
          mkdir -p "$STATE_DIR/radar"
          for f in etf_fund.json etf_page_hashes.json etf_pages_live.json; do
            [ -f "experiments/stock-radar/data/$f" ] && cp "experiments/stock-radar/data/$f" "$STATE_DIR/radar/$f" || true
          done

      # 테마 페이지 3개 (doc/테마-모니터-기획.md, 2026-10-21) — 레이더 자료(snapshot · extra)를 그대로 쓴다. 게시 · 홈 카드(themes.json)
      - name: Theme pages (AI 투자 · 연준 기대 · 임원 매매)
        if: env.DO_PUBLISH == 'true' && needs.check.outputs.mode != 'refresh'
        continue-on-error: true
        run: |
          mkdir -p experiments/theme-monitor/data
          [ -f "$STATE_DIR/themes/page_hashes.json" ] && cp "$STATE_DIR/themes/page_hashes.json" experiments/theme-monitor/data/ || true
          python experiments/theme-monitor/main.py
          python experiments/theme-monitor/publish.py
          python experiments/theme-monitor/home_feed.py
          mkdir -p deploy-home "$STATE_DIR/themes"
          cp experiments/theme-monitor/output/home/themes.json deploy-home/themes.json
          [ -f experiments/theme-monitor/data/page_hashes.json ] && cp experiments/theme-monitor/data/page_hashes.json "$STATE_DIR/themes/page_hashes.json" || true

      # 블로그 검색 즉답 색인 — 미국 (2026-11-11 사용자 "진행해"). 위 레이더 자료(snapshot · extra · news)만 읽는다, AI 0.
      # 아래 홈 JSON 푸시(deploy-home)에 얹는다 — gh-pages 쓰기 추가 없음. 실패 · 종목 부족이면 파일을 안 만들고 전날 것이 남는다
      - name: Search index (search/us.json)
        if: env.DO_PUBLISH == 'true' && hashFiles('deploy-home/stocks.json') != ''
        continue-on-error: true
        run: python experiments/site-search/build_search_index.py --market us --out deploy-home/search/us.json

      - name: Deploy home stocks.json to gh-pages branch
        if: env.DO_PUBLISH == 'true' && hashFiles('deploy-home/stocks.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home
          publish_branch: gh-pages
          keep_files: true

      - name: Purge home stocks.json cache
        if: env.DO_PUBLISH == 'true' && hashFiles('deploy-home/stocks.json') != ''
        continue-on-error: true
        run: |
          # 푸시 직후 퍼지는 jsDelivr 가 아직 옛 커밋을 보고 전날 파일을 다시 붙잡는다(11-05 주목할 종목 빈 칸) — 잠깐 기다린다
          sleep 10
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/stocks.json" || true
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/themes.json" || true
          [ -f deploy-home/search/us.json ] && curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/search/us.json" || true

      # ── 게시 뒤로 옮긴 일 (2026-11-20 사용자 ②③⑤) — 독자 화면이 모두 나간 다음. 본 실행만(갱신 실행은 하지 않음)
      # 소송 일정 — 추적 사건 법원 문서(CourtListener, 사건 사이 13초). 결과 court.json 은 상태에 저장 → 다음 실행 화면
      - name: Court schedule (after publish)
        if: "!cancelled() && needs.check.outputs.mode != 'refresh' && steps.run_radar.outcome == 'success'"
        continue-on-error: true
        timeout-minutes: 10
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          cd experiments/stock-radar && python -c "import court; court.fetch()"
          cd - >/dev/null && mkdir -p "$STATE_DIR/radar" && cp experiments/stock-radar/data/court.json "$STATE_DIR/radar/court.json" 2>/dev/null || true

      # 핫 이슈 AI 판정 — 하루 한 번(본 실행). 위에서 저장된 판정으로 먼저 게시했고, 여기서 판정한 뒤 바뀐 페이지 · 홈 카드만 다시 올린다
      - name: Issue watch AI (after publish)
        id: iw_ai
        if: "!cancelled() && needs.check.outputs.mode != 'refresh'"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python experiments/issue_store/issue_watch_daily.py --state "$STATE_DIR" --ai
          mkdir -p deploy-issue-ai && cp experiments/issue_store/output/issue/issues.json deploy-issue-ai/issues.json 2>/dev/null || true
          if cmp -s deploy-issue-ai/issues.json deploy-forecast/issues.json; then rm -rf deploy-issue-ai; echo "홈 카드 그대로"; fi
          if [ "$DO_PUBLISH" = "true" ]; then python experiments/issue_store/publish_issue.py --state "$STATE_DIR"; else python experiments/issue_store/publish_issue.py --state "$STATE_DIR" --dry; fi
      - name: Deploy issues.json (AI)
        id: iw_ai_deploy
        if: env.DO_PUBLISH == 'true' && steps.iw_ai.outcome == 'success' && hashFiles('deploy-issue-ai/issues.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-issue-ai
          publish_branch: gh-pages
          keep_files: true
      - name: Purge issues.json cache (AI)
        if: steps.iw_ai_deploy.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/jsd_purge.sh issues.json deploy-issue-ai/issues.json || true

      # 신호 서명 매일 스캔 — 그림자 모드(기획 8-19 3-b): 독자 노출 · 알림 없음, records/signals/scan.jsonl 하루 한 줄. 옛 자리 = 전망 게시 앞(1.6분)
      - name: Signal scan (shadow)
        if: "!cancelled() && needs.check.outputs.mode != 'refresh'"
        continue-on-error: true
        timeout-minutes: 8
        run: python experiments/issue_store/signal_scan.py --state "$STATE_DIR" || echo "::warning::신호 스캔 실패 — 오늘 기록 없음"

      # 판정까지 끝난 상태가 있으면 뒤 단계가 실패했어도 저장한다 — Gemini 분류를 헛되게 하지 않기 위해.
      - name: Save state + report (nvda-state branch)
        if: always()
        run: |
          if [ ! -f "$STATE_DIR/items.jsonl" ]; then
            echo "저장할 상태 없음 — 건너뜁니다."
            exit 0
          fi
          OUT=experiments/nvda-report/output
          for f in nvda_report.md nvda_report.html nvda_analysis.json narrative.json title.txt post_url.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE_DIR/$f"
          done
          # 실행 한 줄 — records/runs (2026-11-07, A3-3-2 의 1). 갱신(refresh) 실행은 skipped 로 남는다
          python experiments/record_store.py run-log "$STATE_DIR" nvda "${{ steps.run_nvda.outcome }}" "mode=${{ needs.check.outputs.mode }} job=${{ job.status }}"
          mkdir -p "$STATE_DIR/radar"
          python experiments/record_store.py run-log "$STATE_DIR/radar" radar "${{ steps.run_radar.outcome }}" "mode=${{ needs.check.outputs.mode }}"
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/nvda-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update nvda-report state [skip ci]")"
          else
            echo "nvda-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update nvda-report state [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/nvda-state"
          echo "저장: $COMMIT"

      # 30일 지난 날짜 그림 정리 — 지난 글에서 그래프 칸을 빼고(Blogger PATCH) gh-pages 에서 지운다 (2026-11-12 사용자 "30일 정도만 키워줘. 칸까지도 다 빼야지").
      # 하루 한 번(full), 보통 그날 넘어가는 글 2~3개 · 그림 2~3장. 글 고치기가 실패한 그림은 지우지 않는다. 실패해도 리포트는 그대로
      - name: Prune old dated images (30 days)
        if: env.DO_PUBLISH == 'true' && needs.check.outputs.mode != 'refresh'
        continue-on-error: true
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          python experiments/image_prune.py --apply --days 30 --max-posts 20

      - name: Upload report artifact
        if: always() && needs.check.outputs.mode != 'refresh'
        uses: actions/upload-artifact@v4
        with:
          name: nvda-report
          path: |
            experiments/nvda-report/output/nvda_report.md
            experiments/nvda-report/output/nvda_report.html
            experiments/nvda-report/output/nvda_analysis.json
            experiments/nvda-report/output/narrative.json
          if-no-files-found: ignore
          retention-days: 14

      # 시간 제한(60분)으로 중단된 실행도 알린다 — failure() 만으로는 cancelled 가 빠져 11-09 ~ 11-10 여섯 번을 몰랐다 (2026-11-10 사용자).
      # 이 워크플로는 cancel-in-progress: false 라 cancelled = 시간 초과 또는 사람이 멈춘 것뿐
      - name: Notify failure
        if: failure() || cancelled()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          WHAT="실패"; [ "${{ job.status }}" = "cancelled" ] && WHAT="중단(시간 초과 등)"
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 ${WHAT} — 엔비디아 · 시총 TOP 10 페이지\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
