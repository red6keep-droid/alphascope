name: NVDA Report

# 엔비디아 데일리 리포트 (experiments/nvda-report). 별도 글 시리즈("엔비디아 리포트 — YYYY년 M월 D일").
# trump-trend.yml을 복제해 이름·경로·시각만 바꿨다 (기획서 11절).
#
# 게시 게이트: 저장소 변수 NVDA_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다. 그 전까지는 그림자 모드.
# 수동 실행은 publish 입력으로 개별 결정.
#
# 상태(모든 테이블의 JSONL)와 산출물은 nvda-state 브랜치에 매일 이전 커밋 위에 쌓는다 (일반 push, force 없음).
# 브랜치는 임시 인덱스 + commit-tree 로 만든다 — checkout 하면 방금 만든 output/state 가 옛 버전으로 덮어써진다.

on:
  schedule:
    # 정시 실행은 Cloudflare Worker가 뉴욕 17:30(KST 06:30 서머타임 / 07:30 표준시)에 건다 (infra/cron-trigger).
    # trump-trend(뉴욕 17:15)보다 15분 뒤 — trump_bridge가 그날 trump-state를 읽는다.
    # 옵션 체인은 미국 장 마감 후~뉴욕 자정에만 유효하므로 이 시각이 창 안이다. 주말도 돈다(공시·뉴스만).
    # GitHub cron은 예비 — 22:30 UTC = 07:30 KST, 계절과 상관없이 장 마감 뒤이고 트럼프 예비(22:15)보다 15분 뒤.
    - cron: '30 22 * * *'
    # 낮 갱신 — 종목 페이지만 다시 그린다 (2026-11-04 사용자 P290: 아침 실행 뒤 들어온 방송 의견이 다음 날까지 안 보였다).
    # 04:00 UTC = 13:00 KST, 미국 장 밖. check 가 `오늘 본 실행 끝남` 이면 mode=refresh (13:00 UTC 넘으면 skip — 장중 값 게시 금지)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      narrate:
        description: 'Gemini 서술(⑦) 생성'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nvda-report
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_NVDA || secrets.GEMINI_API_KEY }}   # 리포트별 프로젝트 키 (2026-10-15) — 없으면 공용 키
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # AI 호출 알림 — 한도 · 예비 사용 · 전부 실패 (llm_chain, 2026-10-14)
  # 운영 기록 → Cloudflare KV (experiments/ops_log.py · infra/ops-console, 2026-10-23). 셋 중 하나라도 없으면 기록하지 않는다
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  # yfinance 예비 사슬 (experiments/price_source.py, 2026-10-21). 없는 키는 그 단계를 건너뛴다
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Gemini 키 전부 쿨다운일 때 예비 1순위 gpt-oss-120b (2026-10-11)
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 예비 2순위 DeepSeek
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 방송 줄 (experiments/media_feed.py, 2026-10-25) — 미디어 데일리와 같은 읽기 전용 키. 없으면 방송 줄 없이 돈다
  COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  STATE_DIR: experiments/nvda-report/output/state
  # GitHub cron은 자주 늦거나 빠진다(2026-10-13 하루치 전부 누락). 같은 시각에 Cloudflare Worker가
  # scheduled=true 로 workflow_dispatch를 건다 — 그 실행도 스케줄로 취급한다 (infra/cron-trigger).
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.NVDA_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  # 스케줄(외부 cron 포함)은 GitHub cron과 외부 cron이 하루 두 번 넘게 걸 수 있다. 실행 모드(check.mode):
  #   full    = 오늘 첫 실행 — 엔비디아 파이프라인 · 종목 페이지 · 그래프 · 테마 페이지 전부
  #   refresh = 오늘 본 실행이 끝난 뒤(13:00 UTC 전) — 종목 페이지만 다시 그려 올린다 (방송 · 뉴스 의견 갱신, 2026-11-04 P290). 상태 저장은 같이(기록은 날짜 · id 로 덮어써 두 줄이 안 된다)
  #   skip    = 오늘 끝났고 미국 장중 · 장 뒤 — 아무것도 안 한다 (장중 값 게시 금지, 운영 기록 10-24)
  # 수동 실행은 확인하지 않는다(mode 비어 있음 = full) — 같은 제목 글을 덮어써 다시 만드는 용도.
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        if: env.IS_SCHEDULED == 'true'

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        if: env.IS_SCHEDULED == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 2026-11-01 엔비디아 매일 글을 그만두고 고정 페이지로 — 오늘 글이 있나 대신 `오늘(KST 05:00 뒤) 상태 저장이 있나` 로 하루 두 번 실행을 막는다
      - name: Check if today's run already finished
        id: check
        if: env.IS_SCHEDULED == 'true'
        run: |
          MODE=full
          if git fetch -q state nvda-state 2>/dev/null; then
            LAST=$(git log -1 --format=%ct FETCH_HEAD)
            SINCE=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 05:00" +%s)
            if [ "$LAST" -ge "$SINCE" ]; then
              if [ "$(date -u +%H)" -lt 13 ]; then MODE=refresh; else MODE=skip; fi   # 13:00 UTC 전 = 미국 장 전(프리마켓 포함)만 갱신
            fi
          fi
          echo "실행 모드: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  nvda-report:
    needs: check
    if: needs.check.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 2026-10-20 실측 994초. 고정 페이지가 늘수록 길어짐 — 바뀐 것만 쓰기로 줄인다 (운영지침 D2-2)
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # publish.py가 daily-report의 publish_blogger를 가져다 쓰므로 그쪽 의존성(google-auth)도 필요하다.
      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이전 실행의 DB 상태(모든 테이블 JSONL). 없으면 첫 실행 — 일봉 2년·EDGAR 90일·문서 30일·점검표 5분기 백필.
      - name: Load state (nvda-state branch)
        run: |
          if git fetch state nvda-state:refs/nvda-state 2>/dev/null; then
            mkdir -p "$STATE_DIR"
            if git archive refs/nvda-state "$STATE_DIR" | tar -x; then
              echo "상태 불러옴: items $(wc -l < "$STATE_DIR/items.jsonl" 2>/dev/null || echo 0)행 · 일봉 $(wc -l < "$STATE_DIR/daily_bars.jsonl" 2>/dev/null || echo 0)행"
            fi
          else
            echo "이전 상태 없음 (첫 실행)"
          fi
          # 트럼프 반응 통계 — trump_bridge 가 state/trump-state 를 git show 로 읽는다 (2026-11-04: 공개 raw URL 대신)
          git fetch --no-tags state trump-state:refs/remotes/state/trump-state 2>/dev/null || echo "trump-state 없음 — 트럼프 구획 없이"

      - name: Run pipeline
        id: run_nvda
        if: needs.check.outputs.mode != 'refresh'
        run: |
          # 2026-11-01 사용자: 엔비디아도 고정 페이지 · 뉴스는 공용 처리 — 엔비디아 전용 뉴스 수집 · AI 분류 · Gemini 서술은 끈다.
          # 남는 일 = 일봉 · 캘린더(시장 일정 — 종목 페이지가 이 DB 를 읽는다) · 상태판. 소송 일정은 stock-radar/court.py 가 맡는다
          ARGS="--import-state $STATE_DIR --export-state $STATE_DIR --skip-feeds --skip-classify"
          # 게시는 아래 별도 단계에서 — 가격 그래프 PNG가 gh-pages에 먼저 올라가 있어야 글의 <img>가 깨지지 않는다 (2026-10-11)
          python experiments/nvda-report/main.py $ARGS

      # 시총 TOP 10 고정 페이지 20개 (experiments/stock-radar, 2026-10-18 첫 발행). 엔비디아 DB(일정) · 그래프 코드를 같이 쓰므로 이 실행 안에서 돈다.
      # 이어서 쌓는 파일(뉴스 분류 · 변동성 이력 · 순위 교체 상태)만 nvda-state 의 radar/ 에 둔다. 일봉 snapshot 은 매번 새로 받는다.
      # 실패해도 엔비디아 글은 나간다 (continue-on-error).
      - name: Run stock radar (시총 TOP 10 pages)
        id: run_radar
        continue-on-error: true
        run: |
          mkdir -p experiments/stock-radar/data
          if [ -d "$STATE_DIR/radar" ]; then cp "$STATE_DIR"/radar/*.json experiments/stock-radar/data/ 2>/dev/null || true; fi
          python experiments/stock-radar/main.py
          mkdir -p "$STATE_DIR/radar"
          for f in news.json iv_history.json history.json rank_state.json capex.json est_history.json court.json; do   # court.json = 소송 일정 (P270)   # capex.json = 돈을 어디에 쓰나 분기 표 (기록 보존, 2026-10-30)
            [ -f "experiments/stock-radar/data/$f" ] && cp "experiments/stock-radar/data/$f" "$STATE_DIR/radar/$f"
          done

      # ① 아래 가격 그래프 (chart_price.py → output/images/nvda-price-{day}.png). daily-report 커버 이미지와 같은 경로
      - name: Prepare chart image for deploy
        if: needs.check.outputs.mode != 'refresh'
        run: |
          mkdir -p deploy/images
          if compgen -G "experiments/nvda-report/output/images/*.png" > /dev/null; then
            cp experiments/nvda-report/output/images/*.png deploy/images/
            ls -la deploy/images/
          else
            echo "::warning::가격 그래프가 없습니다 — 글은 그래프 없이 나간다."
          fi
          # 종목 그래프(radar-*.png)는 여기 넣지 않는다 — 아래 radar-images 단계 (2026-10-20 휘발성)

      - name: Deploy chart image to gh-pages branch
        if: needs.check.outputs.mode != 'refresh' && hashFiles('deploy/images/*.png') != ''
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      # 종목 그래프 — radar-images 브랜치를 그날 그림만으로 새로 만들어 덮어쓴다(부모 커밋 없음 = 이력 없음, 2026-10-20 사용자: 이미지는 휘발성).
      # gh-pages(keep_files)에 두면 매일 수십 장이 커밋 이력에 쌓인다. 페이지 <img> 주소는 render_pages.chart_url (@radar-images).
      - name: Deploy stock charts (radar-images branch, no history)
        if: needs.check.outputs.mode != 'refresh' && hashFiles('experiments/stock-radar/output/images/radar-*.png') != ''   # 갱신 실행은 같은 날 봉 — 그래프는 아침 것 그대로
        run: |
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # 트리를 직접 만든다 (images/ 아래 그날 PNG 만) — 작업 폴더 · 다른 브랜치 내용이 섞이지 않게
          SUB="$(for f in experiments/stock-radar/output/images/radar-*.png; do
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
          done | git mktree)"
          TREE="$(printf '040000 tree %s\timages\n' "$SUB" | git mktree)"
          COMMIT="$(git commit-tree "$TREE" -m "Stock charts $(date -u +%F) [skip ci]")"
          git push --force origin "$COMMIT:refs/heads/radar-images"
          echo "종목 그래프 $(git ls-tree "$SUB" | wc -l)장 → radar-images (이력 없이 덮어씀)"

      - name: Purge and verify jsDelivr cache
        if: needs.check.outputs.mode != 'refresh' && hashFiles('experiments/nvda-report/output/image_ref.txt') != ''
        run: |
          IMAGE_REF=$(cat experiments/nvda-report/output/image_ref.txt)
          [ -z "$IMAGE_REF" ] && { echo "::warning::그래프 ref 없음"; exit 0; }
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}" || true
          sleep 5
          curl -sS -f -o /dev/null "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}" \
            && echo "그래프 CDN 확인: ${IMAGE_REF}" || echo "::warning::CDN에서 아직 안 보임: ${IMAGE_REF}"

      # 엔비디아 날짜별 글 게시(publish.py)는 2026-11-01 그만뒀다 — 엔비디아는 아래 종목 고정 페이지(nvidia-nvda-stock)로. 지난 글은 블로그에 그대로

      # 시총 TOP 10 · 종목 고정 페이지 갱신 (엔비디아 포함, 2026-11-01). 그래프는 이름이 고정이라 jsDelivr 캐시를 먼저 비운다.
      - name: Publish stock pages (시총 TOP 10)
        if: env.DO_PUBLISH == 'true'
        continue-on-error: true
        run: |
          for f in experiments/stock-radar/output/images/radar-*.png; do
            [ -f "$f" ] && curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@radar-images/images/$(basename "$f")" || true
          done
          python experiments/stock-radar/publish_pages.py
          # 올린 본문 해시 — 다음 실행에서 같은 페이지를 다시 PUT 하지 않게 (publish_pages.HASHES, 2026-10-21 운영지침 D2-2)
          mkdir -p "$STATE_DIR/radar"
          [ -f experiments/stock-radar/data/page_hashes.json ] && cp experiments/stock-radar/data/page_hashes.json "$STATE_DIR/radar/page_hashes.json" || true
          # 홈 `관심 종목` · `섹터 상위 종목` 카드 데이터 (2026-10-21 사용자) — 발행된 페이지만 링크
          python experiments/stock-radar/home_feed.py
          mkdir -p deploy-home && cp experiments/stock-radar/output/home/stocks.json deploy-home/stocks.json

      # 테마 페이지 3개 (doc/테마-모니터-기획.md, 2026-10-21) — 레이더 자료(snapshot · extra)를 그대로 쓴다. 게시 · 홈 카드(themes.json)
      - name: Theme pages (AI 투자 · 연준 기대 · 임원 매매)
        if: env.DO_PUBLISH == 'true' && needs.check.outputs.mode != 'refresh'
        continue-on-error: true
        run: |
          mkdir -p experiments/theme-monitor/data
          [ -f "$STATE_DIR/themes/page_hashes.json" ] && cp "$STATE_DIR/themes/page_hashes.json" experiments/theme-monitor/data/ || true
          python experiments/theme-monitor/main.py
          python experiments/theme-monitor/publish.py
          python experiments/theme-monitor/home_feed.py
          mkdir -p deploy-home "$STATE_DIR/themes"
          cp experiments/theme-monitor/output/home/themes.json deploy-home/themes.json
          [ -f experiments/theme-monitor/data/page_hashes.json ] && cp experiments/theme-monitor/data/page_hashes.json "$STATE_DIR/themes/page_hashes.json" || true

      - name: Deploy home stocks.json to gh-pages branch
        if: env.DO_PUBLISH == 'true' && hashFiles('deploy-home/stocks.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home
          publish_branch: gh-pages
          keep_files: true

      - name: Purge home stocks.json cache
        if: env.DO_PUBLISH == 'true' && hashFiles('deploy-home/stocks.json') != ''
        continue-on-error: true
        run: |
          # 푸시 직후 퍼지는 jsDelivr 가 아직 옛 커밋을 보고 전날 파일을 다시 붙잡는다(11-05 주목할 종목 빈 칸) — 잠깐 기다린다
          sleep 10
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/stocks.json" || true
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/themes.json" || true

      # 판정까지 끝난 상태가 있으면 뒤 단계가 실패했어도 저장한다 — Gemini 분류를 헛되게 하지 않기 위해.
      - name: Save state + report (nvda-state branch)
        if: always()
        run: |
          if [ ! -f "$STATE_DIR/items.jsonl" ]; then
            echo "저장할 상태 없음 — 건너뜁니다."
            exit 0
          fi
          OUT=experiments/nvda-report/output
          for f in nvda_report.md nvda_report.html nvda_analysis.json narrative.json title.txt post_url.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE_DIR/$f"
          done
          # 실행 한 줄 — records/runs (2026-11-07, A3-3-2 의 1). 갱신(refresh) 실행은 skipped 로 남는다
          python experiments/record_store.py run-log "$STATE_DIR" nvda "${{ steps.run_nvda.outcome }}" "mode=${{ needs.check.outputs.mode }} job=${{ job.status }}"
          mkdir -p "$STATE_DIR/radar"
          python experiments/record_store.py run-log "$STATE_DIR/radar" radar "${{ steps.run_radar.outcome }}" "mode=${{ needs.check.outputs.mode }}"
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/nvda-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update nvda-report state [skip ci]")"
          else
            echo "nvda-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update nvda-report state [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/nvda-state"
          echo "저장: $COMMIT"

      - name: Upload report artifact
        if: always() && needs.check.outputs.mode != 'refresh'
        uses: actions/upload-artifact@v4
        with:
          name: nvda-report
          path: |
            experiments/nvda-report/output/nvda_report.md
            experiments/nvda-report/output/nvda_report.html
            experiments/nvda-report/output/nvda_analysis.json
            experiments/nvda-report/output/narrative.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — ${{ github.workflow }}\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
