name: NVDA Report

# 엔비디아 데일리 리포트 (experiments/nvda-report). 별도 글 시리즈("엔비디아 데일리 — YYYY년 M월 D일").
# trump-trend.yml을 복제해 이름·경로·시각만 바꿨다 (기획서 11절).
#
# 게시 게이트: 저장소 변수 NVDA_PUBLISH 가 'true' 일 때만 스케줄 실행이 실제 게시한다. 그 전까지는 그림자 모드.
# 수동 실행은 publish 입력으로 개별 결정.
#
# 상태(모든 테이블의 JSONL)와 산출물은 nvda-state 브랜치에 매일 이전 커밋 위에 쌓는다 (일반 push, force 없음).
# 브랜치는 임시 인덱스 + commit-tree 로 만든다 — checkout 하면 방금 만든 output/state 가 옛 버전으로 덮어써진다.

on:
  schedule:
    # 매일 22:45 UTC = 07:45 KST. trump-trend(22:30)보다 15분 뒤 — trump_bridge가 그날 trump-state를 읽는다.
    # 옵션 체인은 미국 장 마감 후~자정(20:00~04:00 UTC)에만 유효하므로 이 시각이 창 안이다. 주말도 돈다(공시·뉴스만).
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      narrate:
        description: 'Gemini 서술(⑦) 생성'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nvda-report
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # Gemini 키 전부 쿨다운일 때 예비 1순위 gpt-oss-120b (2026-10-11)
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 예비 2순위 DeepSeek
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  STATE_DIR: experiments/nvda-report/output/state
  DO_PUBLISH: ${{ (github.event_name == 'schedule' && vars.NVDA_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  nvda-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # publish.py가 daily-report의 publish_blogger를 가져다 쓰므로 그쪽 의존성(google-auth)도 필요하다.
      - name: Install dependencies
        run: |
          pip install -r experiments/nvda-report/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 이전 실행의 DB 상태(모든 테이블 JSONL). 없으면 첫 실행 — 일봉 2년·EDGAR 90일·문서 30일·점검표 5분기 백필.
      - name: Load state (nvda-state branch)
        run: |
          if git fetch origin nvda-state:refs/nvda-state 2>/dev/null; then
            mkdir -p "$STATE_DIR"
            if git archive refs/nvda-state "$STATE_DIR" | tar -x; then
              echo "상태 불러옴: items $(wc -l < "$STATE_DIR/items.jsonl" 2>/dev/null || echo 0)행 · 일봉 $(wc -l < "$STATE_DIR/daily_bars.jsonl" 2>/dev/null || echo 0)행"
            fi
          else
            echo "이전 상태 없음 (첫 실행)"
          fi

      - name: Run pipeline
        run: |
          ARGS="--import-state $STATE_DIR --export-state $STATE_DIR"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.narrate }}" = "true" ]; then
            ARGS="$ARGS --narrate"
          fi
          if [ "$DO_PUBLISH" = "true" ]; then
            echo "게시 모드 — Blogger에 올린다."
            ARGS="$ARGS --publish"
          else
            echo "그림자 모드 — 게시하지 않는다. (스케줄 게시는 저장소 변수 NVDA_PUBLISH=true 로 켠다)"
          fi
          python experiments/nvda-report/main.py $ARGS

      # 판정까지 끝난 상태가 있으면 뒤 단계가 실패했어도 저장한다 — Gemini 분류를 헛되게 하지 않기 위해.
      - name: Save state + report (nvda-state branch)
        if: always()
        run: |
          if [ ! -f "$STATE_DIR/items.jsonl" ]; then
            echo "저장할 상태 없음 — 건너뜁니다."
            exit 0
          fi
          OUT=experiments/nvda-report/output
          for f in nvda_report.md nvda_report.html nvda_analysis.json narrative.json title.txt post_url.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE_DIR/$f"
          done
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/nvda-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update nvda-report state [skip ci]")"
          else
            echo "nvda-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update nvda-report state [skip ci]")"
          fi
          git push origin "$COMMIT:refs/heads/nvda-state"
          echo "저장: $COMMIT"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-report
          path: |
            experiments/nvda-report/output/nvda_report.md
            experiments/nvda-report/output/nvda_report.html
            experiments/nvda-report/output/nvda_analysis.json
            experiments/nvda-report/output/narrative.json
          if-no-files-found: ignore
          retention-days: 14
