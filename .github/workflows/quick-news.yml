name: Quick stock news (간단 종목 뉴스 · 그림자)

# 종목 주가(간단 종목, 미국 452) 뉴스 — Finnhub 기사 목록 + 원문 첫 문단 → 공용 분류 · 요약 (2026-11-15 사용자 "1단계 시작해", 기억 quick-news-plan).
#   - 화~토 06:40 KST 하루 한 번 = 미국 장 마감(06:00) 뒤, 08:20 미국 종목 주가 화면 전에 끝난다(같은 Finnhub 키). 화요일은 72시간(토 아침 ~ 월 아침, 주말 뉴스).
#     AI 는 3.1 lite 몫(정식 실행이 거의 안 쓰는 따로인 하루 500회) — 11-15 실측: 3.5 lite 하루 최대 약 230회 · 3.1 lite 약 95회 (2026-11-15 사용자, 옛 15:10 은 '남은 몫' 이라는 틀린 전제).
#   - AI = 사슬 news-quick(3.1 lite → 3.5 lite → Gemma 4 26B), 분류 호출 상한 60 · 요약 기사 상한 300. flash · Groq 0. 구글 뉴스 0.
#   - Finnhub 452번(1.1초 간격, 분당 60 한도) · 원문 페이지 약 900건(3개 동시, 막는 사이트는 열지 않음).
#   - 결과 = 비공개 상태 저장소 quick-news-state(기록 없이 덮어씀): news.json(분류) · summaries.json(팝업 다섯 줄). 첫 문단은 저장하지 않는다.
#   - 그림자: 블로그 · Pages 에 나가지 않는다. 화면 연결은 3단계(종목 주가 조각이 이 결과를 읽게).

on:
  schedule:
    - cron: '20 21 * * 1-5'   # UTC 월~금 21:20 = KST 화~토 06:20 (2026-11-20 사용자, 옛 06:40 — 엔비디아 실행이 06:47 로 당겨져 Gemini lite 분당 한도가 겹치지 않게 먼저 끝냄)
  workflow_dispatch:
    inputs:
      limit:
        description: '시험용 — 앞 N종목만 (0 = 전부)'
        default: '0'
      scheduled:
        description: 'Cloudflare Worker 용 — 정기 실행처럼(중복 건너뛰기) (사람은 끄고 쓴다)'
        default: 'false'

permissions:
  contents: read
  actions: read   # 중복 건너뛰기(check)가 실행 목록을 읽는다

env:   # 운영 기록(Cloudflare KV) — 운영 대시보드 AI 칸에 이 실행의 모델별 호출 수가 잡히게 (2026-11-15: 빠져 있어 lite 사용량이 적게 보였다)
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}

concurrency:
  group: quick-news
  cancel-in-progress: false

jobs:
  # 같은 날 두 번 막기 — Cloudflare Worker(infra/cron-trigger)와 GitHub cron 이 둘 다 건다(GitHub cron 은 자주 늦거나 빠진다).
  # 정기 실행만 확인한다. 사람이 거는 실행은 늘 돈다 (2026-11-15 사용자). 확인 = .github/scripts/run_guard.py (2026-11-17: 06:40 예비가 13:09 에 와
  # `최근 6시간` 밖이라 AI 까지 18분 다시 돌았다 — 예비는 그 cron 의 예정 시각 기준, `한 것` = 본 잡(news)이 성공했거나 도는 중인 실행만)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts/run_guard.py
          sparse-checkout-cone-mode: false
      - id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULED" = true ]; then
            python3 .github/scripts/run_guard.py --workflow quick-news.yml --job news
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "사람이 건 실행 → 돈다"
          fi

  news:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r experiments/nvda-report/requirements.txt

      - name: State (private quick-news-state, read)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p /tmp/qn
          [ -z "$STATE_DEPLOY_KEY" ] && { echo "STATE_DEPLOY_KEY 없음 — 저장값 없이"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
          if git fetch -q state quick-news-state; then git archive FETCH_HEAD | tar -x -C /tmp/qn && echo "저장값: $(ls /tmp/qn | tr '\n' ' ')"; else echo "저장값 없음 (첫 실행)"; fi

      - name: Collect · classify · summarize
        id: run
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_MAX_MINUTES: '20'
        run: python experiments/stock-quick/quick_news.py --state /tmp/qn --limit ${{ inputs.limit || '0' }}

      # 기록 없이 덮어쓴다 — 다시 모을 수 있는 캐시(분류 결과)라 저장소가 커지지 않게. 실패해도 그때까지 분류한 것은 남긴다
      - name: Save quick-news-state (private, no history)
        if: always() && steps.run.outcome != 'skipped'
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          [ -z "$STATE_DEPLOY_KEY" ] || [ ! -f /tmp/qn/news.json ] && exit 0
          cd /tmp/qn && rm -f *.tmp
          git init -q && git checkout -q --orphan quick-news-state
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git add -A && git commit -q -m "quick news $(date -u +%F) [skip ci]"
          git push -q -f git@github.com:red6keep-droid/alphascope-state.git HEAD:quick-news-state
          echo "저장 $(du -sh . | cut -f1)"

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 간단 종목 뉴스\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
