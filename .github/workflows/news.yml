name: Update News (2x daily)

on:
  schedule:
    - cron: '45 12,21 * * *'   # 예비 — 정시는 Cloudflare Worker. KST 21:45 · 06:45 (2026-10-25 하루 두 번). gh-pages push 겹침 피하기 :45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # 운영 알림 (experiments/notify.py · 워크플로 실패, 2026-10-21)

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # 제목 한글 번역 1순위 gpt-oss-120b (2026-10-11)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 2순위 gpt-oss-20b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 제목 한글 번역 예비 (둘 다 없으면 영문 유지)
          YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 방송 줄 (experiments/media_feed.py, 2026-10-25) — 없으면 기사만
        run: python fetch_news.py

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp news.json deploy/news.json
          [ -f news_store_home.json ] && cp news_store_home.json deploy/news_store_home.json || true   # 공용 뉴스 처리 결과 — 다음 실행이 이미 처리한 기사를 다시 AI 에 보내지 않게 (2026-10-25)

      - name: Deploy news.json to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge jsDelivr cache
        run: curl -sS -f https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/news.json

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — ${{ github.workflow }}\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
