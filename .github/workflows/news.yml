name: Update News (2h)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news script
        run: python fetch_news.py

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp news.json deploy/news.json

      - name: Deploy news.json to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge jsDelivr cache
        run: curl -sS -f https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/news.json
