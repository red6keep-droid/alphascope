name: Update News (2x daily)

on:
  schedule:
    - cron: '45 12,21 * * *'   # 예비 — 정시는 Cloudflare Worker. KST 21:45 · 06:45 (2026-10-25 하루 두 번). gh-pages push 겹침 피하기 :45
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # 예비 중복 확인(check)이 실행 목록을 읽는다

concurrency:
  group: news-update
  cancel-in-progress: false   # 2026-11-17: true 면 늦게 온 예비가 도는 정시 실행을 취소했다 — 줄 세우고 예비는 check 가 건너뛴다

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # 운영 알림 (experiments/notify.py · 워크플로 실패, 2026-10-21)

jobs:
  # GitHub 예비(schedule)만 확인 — 같은 칸(06:45 · 21:45)을 Worker 실행이 이미 했으면 건너뛴다 (2026-11-17: 06:45 예비가 07:29 에 와 다시 받고 다시 올렸다).
  # Worker · 사람 실행(workflow_dispatch)은 늘 돈다. 확인 = .github/scripts/run_guard.py
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: .github/scripts/run_guard.py
          sparse-checkout-cone-mode: false
      - id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            python3 .github/scripts/run_guard.py --workflow news.yml --job run-fetch
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  run-fetch:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # 3.10 → 3.12 (2026-11-24 — 3.10 만 못 읽는 문법으로 미국 리포트가 멈춘 뒤 모든 실행을 3.12 로)

      # 방송 요약 날짜 파일 캐시 (experiments/media_feed.py, 2026-11-16 수집기 요청 News-doc/블로그-Firestore-읽기-줄이기.md).
      # 그제 이전 edition 만 들어 있다 — 실행마다 Firestore 는 오늘 · 어제 묶음만 읽는다. 키 = 워크플로 · KST 날짜(하루 한 번 저장, 날짜가 바뀌면 전날 것을 이어 받는다)
      - name: Media feed day key
        id: mfkey
        run: echo "d=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore media feed cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/alphascope-media
          key: media-feed-${{ github.workflow }}-${{ steps.mfkey.outputs.d }}
          restore-keys: media-feed-${{ github.workflow }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # 제목 한글 번역 1순위 gpt-oss-120b (2026-10-11)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 2순위 gpt-oss-20b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 제목 한글 번역 예비 (둘 다 없으면 영문 유지)
          YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 방송 줄 (experiments/media_feed.py, 2026-10-25) — 없으면 기사만
          # 운영 기록 → Cloudflare KV (experiments/ops_log.py) — 뉴스가 Gemini lite 를 가장 많이 써서 운영 대시보드 AI 한도 칸에 넣는다 (2026-11-13). 하루 2건
          OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
          OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
          OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
        run: python fetch_news.py

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp news.json deploy/news.json
          [ -f news_store_home.json ] && cp news_store_home.json deploy/news_store_home.json || true
          [ -f news_summaries_home.json ] && cp news_summaries_home.json deploy/news_summaries_home.json || true   # 기사 요약 캐시 — 홈 팝업 (P342)   # 공용 뉴스 처리 결과 — 다음 실행이 이미 처리한 기사를 다시 AI 에 보내지 않게 (2026-10-25)

      - name: Deploy news.json to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge jsDelivr cache
        continue-on-error: true
        run: bash .github/scripts/jsd_purge.sh news.json deploy/news.json   # 기다렸다 비우기 + 새 파일 확인 (2026-11-17 — 푸시 직후 바로 비우면 옛 커밋을 다시 붙잡는다). 5번 안에 안 되면 경고만

      # 분류 기록 — news_store_home.json 은 8일 창으로 덮어쓰므로, 처음 보는 기사 분류를 날짜별로 비공개 news-records 브랜치에 쌓는다(일반 푸시).
      # 그날의 뉴스 분류는 다시 못 만든다. 실패해도 홈 뉴스에는 영향 없음
      - name: Record news classification (news-records)
        continue-on-error: true
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: bash .github/scripts/news_records_push.sh home news_store_home.json

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 뉴스 갱신 (하루 2회)\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
