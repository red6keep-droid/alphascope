name: Test Daily Report

on:
  schedule:
    # 매주 월~금 21:00 UTC = 한국 시간 다음날 06:00
    - cron: '0 21 * * 1-5'
    # 재시도. GitHub cron은 부하가 높으면 지연/누락되므로 90분 뒤 한 번 더 건다.
    # 이미 게시됐으면 check_published.py가 이후 단계를 모두 건너뛴다.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (true) / 미리보기만 (false)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  # 재시도 cron이 진행 중인 정상 실행을 취소하면 안 된다. 큐에 넣고 기다린다.
  cancel-in-progress: false

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # 게시 시 필요. OAuth 데스크톱 클라이언트 + refresh token(setup_oauth.py로 발급).
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  # 커버 이미지 fallback(Hugging Face Inference API)용. Pollinations만 성공하면 불필요.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r experiments/daily-report/requirements.txt

      # 오늘(KST) 글이 이미 있으면 이후 단계를 전부 건너뛴다. 재시도 cron이
      # Gemini 호출·이미지 생성을 헛돌리지 않게 가장 앞에서 확인한다.
      - name: Check if today's report is already published
        id: check
        if: github.event_name == 'schedule' || inputs.publish
        run: python experiments/daily-report/check_published.py

      # 분석 이력(Regime 점수 등)은 report-state orphan 브랜치에 산다. 어제 점수와
      # 비교하려면 실행 전에 꺼내와야 한다. 없거나 실패해도 리포트는 진행한다.
      # actions/checkout은 fetch refspec을 main으로 좁혀두므로 목적지 ref를 명시한다
      # (comment-reply.yml과 같은 함정).
      - name: Load analysis history (report-state branch)
        if: steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          if git fetch origin report-state:refs/report-state 2>/dev/null; then
            mkdir -p "$STATE"
            if git archive refs/report-state "$STATE" | tar -x; then
              echo "이전 분석 이력 불러옴: $(ls "$STATE"/history 2>/dev/null | wc -l)일"
            fi
          else
            echo "이전 분석 이력 없음 (첫 실행)"
          fi

      # 항상 dry-run. output/에 report_body.html, title.txt, image_ref.txt,
      # images/{date}.webp 를 남긴다. 분석(analysis.json, state/)은 그림자 모드라
      # 실패해도 여기서 멈추지 않는다.
      - name: Run daily report (dry-run + cover image)
        if: steps.check.outputs.already_published != 'true'
        run: python experiments/daily-report/main.py

      - name: Prepare cover image for deploy
        if: steps.check.outputs.already_published != 'true'
        run: |
          mkdir -p deploy/images
          if compgen -G "experiments/daily-report/output/images/*.webp" > /dev/null; then
            cp experiments/daily-report/output/images/*.webp deploy/images/
            ls -la deploy/images/
          else
            echo "::warning::생성된 커버 이미지가 없습니다."
          fi

      - name: Deploy cover image to gh-pages branch
        if: hashFiles('deploy/images/*.webp') != ''
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge and verify jsDelivr cache
        if: hashFiles('experiments/daily-report/output/image_ref.txt') != ''
        run: |
          IMAGE_REF=$(cat experiments/daily-report/output/image_ref.txt)
          if [ -z "$IMAGE_REF" ]; then
            echo "::warning::커버 이미지 ref가 없습니다."; exit 0
          fi
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          sleep 5
          curl -sS -f -o /dev/null "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          echo "커버 이미지 CDN 확인 완료: ${IMAGE_REF}"

      # 스케줄 실행은 자동 게시. 수동 실행은 publish 체크 시에만 게시.
      # publish_saved.py는 커버 이미지 URL까지 확인한다.
      - name: Publish to Blogger
        if: |
          steps.check.outputs.already_published != 'true'
          && (github.event_name == 'schedule' || inputs.publish)
        run: python experiments/daily-report/publish_saved.py

      # 게시 성패와 무관하게 그날 분석은 남긴다. 게시가 skip된 날(already_published)은
      # 분석도 안 돌았으니 저장할 게 없다. orphan 한 커밋에 전체 이력을 담아 force push
      # 하므로 브랜치 커밋 수는 늘지 않는다.
      - name: Save analysis history (report-state branch)
        if: always() && steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          if [ ! -f "$STATE/regime.jsonl" ]; then
            echo "분석 이력 없음 — 저장을 건너뜁니다."
            exit 0
          fi
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # --orphan은 인덱스를 유지한다. 리셋하지 않으면 리포 전체가 커밋된다.
          git checkout --orphan report-state
          git reset
          # output/ 은 .gitignore 대상이라 -f 없이는 git add가 종료코드 1로 죽는다.
          git add -f "$STATE"
          git commit -m "Update analysis history [skip ci]" || echo "이력 변경 없음"
          git push --force origin report-state:report-state

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: experiments/daily-report/output/
