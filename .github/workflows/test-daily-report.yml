name: Test Daily Report

on:
  schedule:
    # 매주 월~금 21:00 UTC = 한국 시간 다음날 06:00
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (true) / 미리보기만 (false)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: true

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # 게시 시 필요. OAuth 데스크톱 클라이언트 + refresh token(setup_oauth.py로 발급).
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  # 커버 이미지 fallback(Hugging Face Inference API)용. Pollinations만 성공하면 불필요.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r experiments/daily-report/requirements.txt

      # 항상 dry-run. output/에 report_body.html, title.txt, image_ref.txt,
      # images/{date}.webp 를 남긴다.
      - name: Run daily report (dry-run + cover image)
        run: python experiments/daily-report/main.py

      - name: Prepare cover image for deploy
        run: |
          mkdir -p deploy/images
          if compgen -G "experiments/daily-report/output/images/*.webp" > /dev/null; then
            cp experiments/daily-report/output/images/*.webp deploy/images/
            ls -la deploy/images/
          else
            echo "::warning::생성된 커버 이미지가 없습니다."
          fi

      - name: Deploy cover image to gh-pages branch
        if: hashFiles('deploy/images/*.webp') != ''
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge and verify jsDelivr cache
        if: hashFiles('experiments/daily-report/output/image_ref.txt') != ''
        run: |
          IMAGE_REF=$(cat experiments/daily-report/output/image_ref.txt)
          if [ -z "$IMAGE_REF" ]; then
            echo "::warning::커버 이미지 ref가 없습니다."; exit 0
          fi
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          sleep 5
          curl -sS -f -o /dev/null "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          echo "커버 이미지 CDN 확인 완료: ${IMAGE_REF}"

      # 스케줄 실행은 자동 게시. 수동 실행은 publish 체크 시에만 게시.
      # publish_saved.py는 커버 이미지 URL까지 확인한다.
      - name: Publish to Blogger
        if: github.event_name == 'schedule' || inputs.publish
        run: python experiments/daily-report/publish_saved.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: experiments/daily-report/output/
