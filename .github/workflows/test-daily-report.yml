name: Test Daily Report

on:
  schedule:
    # 정시 실행은 Cloudflare Worker가 뉴욕 17:00(장 마감 1시간 뒤, KST 06:00 서머타임 / 07:00 표준시)에 건다
    # (infra/cron-trigger). GitHub cron은 예비 — UTC 고정이라 계절과 상관없이 장 마감 뒤인 시각에 둔다.
    # 22:00 UTC = KST 07:00. 이미 게시됐으면 check_published.py가 이후 단계를 모두 건너뛴다.
    - cron: '0 22 * * 1-5'
    # 재시도. GitHub cron은 부하가 높으면 지연/누락되므로 90분 뒤 한 번 더 건다. 23:30 UTC = KST 08:30.
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (true) / 미리보기만 (false)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  # 재시도 cron이 진행 중인 정상 실행을 취소하면 안 된다. 큐에 넣고 기다린다.
  cancel-in-progress: false

env:
  # GitHub cron은 자주 늦거나 빠진다. 같은 시각에 Cloudflare Worker가 scheduled=true 로
  # workflow_dispatch를 건다 — 그 실행도 스케줄로 취급한다 (infra/cron-trigger).
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  # yfinance 예비 사슬 (experiments/price_source.py, 2026-10-21). 없는 키는 그 단계를 건너뛴다
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DAILY || secrets.GEMINI_API_KEY }}   # 리포트별 프로젝트 키 (2026-10-15) — 없으면 공용 키
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # AI 호출 알림 — 한도 · 예비 사용 · 전부 실패 (llm_chain, 2026-10-14)
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # 예비 1순위 (긴 프롬프트는 413 으로 건너뜀) — experiments/llm_chain.py (2026-10-14)
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 예비 2순위 DeepSeek — 미국 증시 리포트의 실제 예비
  # 게시 시 필요. OAuth 데스크톱 클라이언트 + refresh token(setup_oauth.py로 발급).
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  # 커버 이미지 fallback(Hugging Face Inference API)용. Pollinations만 성공하면 불필요.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r experiments/daily-report/requirements.txt

      # 오늘(KST) 글이 이미 있으면 이후 단계를 전부 건너뛴다. 재시도 cron이
      # Gemini 호출·이미지 생성을 헛돌리지 않게 가장 앞에서 확인한다.
      - name: Check if today's report is already published
        id: check
        if: env.IS_SCHEDULED == 'true' || inputs.publish
        run: python experiments/daily-report/check_published.py

      # 분석 이력(Regime 점수 등)은 report-state 브랜치에 산다. 어제 점수와
      # 비교하려면 실행 전에 꺼내와야 한다.
      # "브랜치가 없음(첫 실행)"과 "있는데 못 받음(네트워크 · 권한)"을 구분한다 — 예전에는 둘 다
      # "첫 실행"으로 보고 진행한 뒤 orphan 으로 force push 해서, 한 번 삐끗하면 누적 이력 전체가
      # 복구 불능으로 사라질 수 있었다 (doc/블로그-운영-지침.md D7-3, 2026-10-21). 지금은 못 받으면 멈춘다.
      # actions/checkout은 fetch refspec을 main으로 좁혀두므로 목적지 ref를 명시한다
      # (comment-reply.yml과 같은 함정).
      - name: Load analysis history (report-state branch)
        if: steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          set +e
          git ls-remote --exit-code --heads origin report-state > /dev/null
          RC=$?
          set -e
          if [ "$RC" = "2" ]; then
            echo "이전 분석 이력 없음 (브랜치 없음 — 첫 실행)"
            exit 0
          elif [ "$RC" != "0" ]; then
            echo "::error::report-state 브랜치 확인 실패 (ls-remote rc=$RC). 이력을 덮어쓰지 않도록 중단합니다."
            exit 1
          fi
          git fetch origin report-state:refs/report-state
          mkdir -p "$STATE"
          git archive refs/report-state "$STATE" | tar -x
          echo "이전 분석 이력 불러옴: $(ls "$STATE"/history 2>/dev/null | wc -l)일 (tip $(git rev-parse --short refs/report-state))"

      # 항상 dry-run. output/에 report_body.html, title.txt, image_ref.txt,
      # images/{date}.webp 를 남긴다. 분석(analysis.json, state/)은 그림자 모드라
      # 실패해도 여기서 멈추지 않는다.
      - name: Run daily report (dry-run + cover image)
        if: steps.check.outputs.already_published != 'true'
        run: python experiments/daily-report/main.py

      - name: Prepare cover image for deploy
        if: steps.check.outputs.already_published != 'true'
        run: |
          mkdir -p deploy/images
          if compgen -G "experiments/daily-report/output/images/*.webp" > /dev/null; then
            cp experiments/daily-report/output/images/*.webp deploy/images/
          else
            echo "::warning::생성된 커버 이미지가 없습니다."
          fi
          # S&P 500 가격 그래프 (chart_spx.py, 2026-10-18)
          if compgen -G "experiments/daily-report/output/images/*.png" > /dev/null; then
            cp experiments/daily-report/output/images/*.png deploy/images/
          else
            echo "::warning::S&P 500 그래프가 없습니다 (글은 커버 이미지로 나갑니다)."
          fi
          ls -la deploy/images/ || true

      - name: Deploy cover image to gh-pages branch
        if: hashFiles('deploy/images/*.webp') != '' || hashFiles('deploy/images/*.png') != ''
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge and verify jsDelivr cache
        if: hashFiles('experiments/daily-report/output/image_ref.txt') != ''
        run: |
          IMAGE_REF=$(cat experiments/daily-report/output/image_ref.txt)
          if [ -z "$IMAGE_REF" ]; then
            echo "::warning::커버 이미지 ref가 없습니다."; exit 0
          fi
          curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          sleep 5
          curl -sS -f -o /dev/null "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${IMAGE_REF}"
          echo "커버 이미지 CDN 확인 완료: ${IMAGE_REF}"
          # S&P 500 그래프 — 확인 실패는 경고만 (글은 그래프 자리가 빈 채로 나가지 않게 publish_saved 가 다시 본다)
          CHART_REF=$(cat experiments/daily-report/output/chart_ref.txt 2>/dev/null || true)
          if [ -n "$CHART_REF" ]; then
            curl -sS "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${CHART_REF}" || true
            curl -sS -f -o /dev/null "https://cdn.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/${CHART_REF}" && echo "그래프 CDN 확인 완료: ${CHART_REF}" || echo "::warning::그래프 CDN 확인 실패: ${CHART_REF}"
          fi

      # 스케줄 실행(외부 cron 포함)은 자동 게시. 수동 실행은 publish 체크 시에만 게시.
      # publish_saved.py는 커버 이미지 URL까지 확인한다.
      - name: Publish to Blogger
        if: |
          steps.check.outputs.already_published != 'true'
          && (env.IS_SCHEDULED == 'true' || inputs.publish)
        run: python experiments/daily-report/publish_saved.py

      # 게시 성패와 무관하게 그날 분석은 남긴다. 게시가 skip된 날(already_published)은
      # 분석도 안 돌았으니 저장할 게 없다.
      # trump-state · nvda-state 와 같은 방식: 이전 커밋을 부모로 잇는 일반 push. force 없음 —
      # 원격이 앞서 있으면 거부된다(거부되는 쪽이 안전). orphan + force 는 2026-10-21 에 버렸다 (D7-3).
      - name: Save analysis history (report-state branch)
        if: always() && steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          if [ ! -f "$STATE/regime.jsonl" ]; then
            echo "분석 이력 없음 — 저장을 건너뜁니다."
            exit 0
          fi
          # 원격에 브랜치가 있는데 이번 실행에서 못 받았다면(Load 단계 실패) 절대 쓰지 않는다.
          if git ls-remote --exit-code --heads origin report-state > /dev/null 2>&1 \
             && ! git rev-parse --verify -q refs/report-state > /dev/null; then
            echo "::error::report-state 가 원격에 있는데 이번 실행에서 불러오지 못했습니다. 이력 보호를 위해 저장하지 않습니다."
            exit 1
          fi
          # 그날 글의 렌더 입력도 남긴다 — 디자인이 바뀐 날 같은 글을 다시 그려 갱신할 수 있게 (2026-10-12 사용자:
          # "데일리 리포트는 왜 디자인 변경된 것이 반영이 안 되었지"). 다시 그리기: state/last/* 를 output/ 에 복사 → render_html.py
          OUT=experiments/daily-report/output
          mkdir -p "$STATE/last"
          for f in report_input.json report.out.json analysis.json title.txt image_ref.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE/last/$f"
          done
          # 공개 브랜치에 매체(CNBC) 요약문 원문을 남기지 않는다 — 제목 · 링크 · 우리 번역만 (2026-10-21, 운영지침 D4-2)
          python - "$STATE/last/report_input.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              d = json.load(open(p, encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(0)
          for it in d.get("news") or []:
              it.pop("summary", None)
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False)
          PY
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # 임시 인덱스에 state 디렉터리만 담아 트리를 만든다. 작업 트리와 main 인덱스는 건드리지 않는다.
          # output/ 은 .gitignore 대상이라 -f 가 필요하다.
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/report-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update analysis history [skip ci]")"
          else
            echo "report-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update analysis history [skip ci]")"
          fi
          git push origin "$COMMIT:refs/heads/report-state"
          echo "저장: $COMMIT"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: experiments/daily-report/output/

      # 파이썬 밖 단계(이력 불러오기 · 이미지 배포 · purge · 상태 저장)의 실패도 알린다 (2026-10-21, 운영지침 D6-3)
      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — ${{ github.workflow }}\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
