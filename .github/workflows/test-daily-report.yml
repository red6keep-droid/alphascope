name: Test Daily Report

on:
  schedule:
    # 정시 실행은 Cloudflare Worker가 뉴욕 17:00(장 마감 1시간 뒤, KST 06:00 서머타임 / 07:00 표준시)에 건다
    # (infra/cron-trigger). GitHub cron은 예비 — UTC 고정이라 계절과 상관없이 장 마감 뒤인 시각에 둔다.
    # 22:00 UTC = KST 07:00. 이미 게시됐으면 check_published.py가 이후 단계를 모두 건너뛴다.
    - cron: '0 22 * * 1-5'
    # 재시도. GitHub cron은 부하가 높으면 지연/누락되므로 90분 뒤 한 번 더 건다. 23:30 UTC = KST 08:30.
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (true) / 미리보기만 (false)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read   # notify_recovered.py — 오늘 실패한 실행이 있었는지 본다

concurrency:
  group: daily-report
  # 재시도 cron이 진행 중인 정상 실행을 취소하면 안 된다. 큐에 넣고 기다린다.
  cancel-in-progress: false

env:
  YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 뉴스 구획 끝 방송 줄 (experiments/media_feed.py, 2026-10-25) — 없으면 기사만
  # GitHub cron은 자주 늦거나 빠진다. 같은 시각에 Cloudflare Worker가 scheduled=true 로
  # workflow_dispatch를 건다 — 그 실행도 스케줄로 취급한다 (infra/cron-trigger).
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  # yfinance 예비 사슬 (experiments/price_source.py, 2026-10-21). 없는 키는 그 단계를 건너뛴다
  POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DAILY || secrets.GEMINI_API_KEY }}   # 리포트별 프로젝트 키 (2026-10-15) — 없으면 공용 키
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # AI 호출 알림 — 한도 · 예비 사용 · 전부 실패 (llm_chain, 2026-10-14)
  # 운영 기록 → Cloudflare KV (experiments/ops_log.py · infra/ops-console, 2026-10-23). 셋 중 하나라도 없으면 기록하지 않는다
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # 예비 1순위 (긴 프롬프트는 413 으로 건너뜀) — experiments/llm_chain.py (2026-10-14)
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # 예비 2순위 DeepSeek — 미국 증시 리포트의 실제 예비
  # 게시 시 필요. OAuth 데스크톱 클라이언트 + refresh token(setup_oauth.py로 발급).
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  # 커버 이미지 fallback(Hugging Face Inference API)용. Pollinations만 성공하면 불필요.
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
          # 인물 발언 (종목 · 증시 리포트 `인물 발언` 구획, 2026-11-07 P324) — 인물 레이더가 radar-state 에 남긴 파일. 없으면 구획을 뺀다
          mkdir -p experiments/people-radar/output/state
          if git fetch --no-tags state radar-state:refs/remotes/state/radar-state 2>/dev/null; then
            git show refs/remotes/state/radar-state:experiments/people-radar/output/state/people_mentions.json > experiments/people-radar/output/state/people_mentions.json 2>/dev/null && echo "인물 발언 파일 받음" || { rm -f experiments/people-radar/output/state/people_mentions.json; echo "인물 발언 파일 없음"; }
          else
            echo "radar-state 없음 — 인물 발언 구획 없이"
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r experiments/daily-report/requirements.txt

      # 오늘(KST) 글이 이미 있으면 이후 단계를 전부 건너뛴다. 재시도 cron이
      # Gemini 호출·이미지 생성을 헛돌리지 않게 가장 앞에서 확인한다.
      - name: Check if today's report is already published
        id: check
        if: env.IS_SCHEDULED == 'true' || inputs.publish
        run: python experiments/daily-report/check_published.py

      # 분석 이력(Regime 점수 등)은 report-state 브랜치에 산다. 어제 점수와
      # 비교하려면 실행 전에 꺼내와야 한다.
      # "브랜치가 없음(첫 실행)"과 "있는데 못 받음(네트워크 · 권한)"을 구분한다 — 예전에는 둘 다
      # "첫 실행"으로 보고 진행한 뒤 orphan 으로 force push 해서, 한 번 삐끗하면 누적 이력 전체가
      # 복구 불능으로 사라질 수 있었다 (doc/블로그-운영-지침.md D7-3, 2026-10-21). 지금은 못 받으면 멈춘다.
      # actions/checkout은 fetch refspec을 main으로 좁혀두므로 목적지 ref를 명시한다
      # (comment-reply.yml과 같은 함정).
      - name: Load analysis history (report-state branch)
        if: steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          set +e
          git ls-remote --exit-code --heads state report-state > /dev/null
          RC=$?
          set -e
          if [ "$RC" = "2" ]; then
            echo "이전 분석 이력 없음 (브랜치 없음 — 첫 실행)"
            exit 0
          elif [ "$RC" != "0" ]; then
            echo "::error::report-state 브랜치 확인 실패 (ls-remote rc=$RC). 이력을 덮어쓰지 않도록 중단합니다."
            exit 1
          fi
          git fetch state report-state:refs/report-state
          mkdir -p "$STATE"
          git archive refs/report-state "$STATE" | tar -x
          echo "이전 분석 이력 불러옴: $(ls "$STATE"/history 2>/dev/null | wc -l)일 (tip $(git rev-parse --short refs/report-state))"

      # 항상 dry-run. output/에 report_body.html, title.txt, image_ref.txt,
      # images/{date}.webp 를 남긴다. 분석(analysis.json, state/)은 그림자 모드라
      # 실패해도 여기서 멈추지 않는다.
      - name: Run daily report (dry-run + cover image)
        id: run_daily
        if: steps.check.outputs.already_published != 'true'
        run: python experiments/daily-report/main.py

      - name: Prepare cover image for deploy
        if: steps.check.outputs.already_published != 'true'
        run: |
          mkdir -p deploy/images
          cp experiments/daily-report/output/images/*.webp deploy/images/ 2>/dev/null || true   # 커버 + S&P 500 그래프(둘 다 WebP)
          if ! compgen -G "experiments/daily-report/output/images/[0-9]*.webp" > /dev/null; then
            echo "::warning::생성된 커버 이미지가 없습니다."
          fi
          # S&P 500 가격 그래프 (chart_spx.py, 2026-10-18) — 2026-11-12 부터 WebP, 위 복사에 같이 들어간다
          if ! compgen -G "experiments/daily-report/output/images/spx-price-*.webp" > /dev/null; then
            echo "::warning::S&P 500 그래프가 없습니다 (글은 커버 이미지로 나갑니다)."
          fi
          ls -la deploy/images/ || true

      - name: Deploy cover image to gh-pages branch
        if: hashFiles('deploy/images/*.webp') != '' || hashFiles('deploy/images/*.png') != ''
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Purge and verify jsDelivr cache
        if: hashFiles('experiments/daily-report/output/image_ref.txt') != ''
        run: |
          IMAGE_REF=$(cat experiments/daily-report/output/image_ref.txt)
          if [ -z "$IMAGE_REF" ]; then
            echo "::warning::커버 이미지 ref가 없습니다."; exit 0
          fi
          # 푸시 직후 퍼지는 옛 커밋을 다시 붙잡는다(11-10 07:00 404) — 기다리며 내용까지 맞춰 본다. 끝내 실패하면 게시 막음
          bash .github/scripts/jsd_purge.sh "${IMAGE_REF}" "deploy/${IMAGE_REF}"
          # S&P 500 그래프 — 확인 실패는 경고만 (글은 그래프 자리가 빈 채로 나가지 않게 publish_saved 가 다시 본다)
          CHART_REF=$(cat experiments/daily-report/output/chart_ref.txt 2>/dev/null || true)
          if [ -n "$CHART_REF" ]; then
            bash .github/scripts/jsd_purge.sh "${CHART_REF}" "deploy/${CHART_REF}" || echo "::warning::그래프 CDN 확인 실패: ${CHART_REF}"
          fi

      # 스케줄 실행(외부 cron 포함)은 자동 게시. 수동 실행은 publish 체크 시에만 게시.
      # publish_saved.py는 커버 이미지 URL까지 확인한다.
      - name: Publish to Blogger
        if: |
          steps.check.outputs.already_published != 'true'
          && (env.IS_SCHEDULED == 'true' || inputs.publish)
        run: python experiments/daily-report/publish_saved.py

      # 홈 카드 재료 cards/report.json (H31, 2026-11-05) — 게시된 날만(post_meta.json 은 게시 스크립트가 남긴다).
      # 실패해도 글은 이미 게시돼 있고 홈은 피드 경로로 돌아간다(테마 JS cardJson → cardFeed). 재시도 1회 뒤에도 실패하면 Slack.
      - name: Home card report.json
        if: hashFiles('experiments/daily-report/output/post_meta.json') != ''
        continue-on-error: true
        run: python experiments/daily-report/home_card.py --card report --body experiments/daily-report/output/published_body.html --meta experiments/daily-report/output/post_meta.json --out deploy-cards/cards/report.json

      - name: Deploy report.json to gh-pages
        id: cards_deploy
        if: hashFiles('deploy-cards/cards/report.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-cards
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy report.json to gh-pages (retry)
        id: cards_deploy_retry
        if: steps.cards_deploy.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-cards
          publish_branch: gh-pages
          keep_files: true

      - name: Purge report.json cache
        if: hashFiles('deploy-cards/cards/report.json') != '' && steps.cards_deploy_retry.outcome != 'failure'
        continue-on-error: true
        # 11-10: 푸시 1초 뒤 퍼지 → jsDelivr 가 11-07 카드를 다시 붙잡아 홈 카드가 옛 글로 연결됨. 내용 확인까지
        run: bash .github/scripts/jsd_purge.sh cards/report.json deploy-cards/cards/report.json

      - name: Notify card deploy failure
        if: steps.cards_deploy_retry.outcome == 'failure'
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"⚠️ 홈 카드 cards/report.json 배포 실패(재시도 포함) — 미국 데일리 리포트. 홈은 피드로 돈다\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true

      # 게시 성패와 무관하게 그날 분석은 남긴다. 게시가 skip된 날(already_published)은
      # 분석도 안 돌았으니 저장할 게 없다.
      # trump-state · nvda-state 와 같은 방식: 이전 커밋을 부모로 잇는 일반 push. force 없음 —
      # 원격이 앞서 있으면 거부된다(거부되는 쪽이 안전). orphan + force 는 2026-10-21 에 버렸다 (D7-3).
      - name: Save analysis history (report-state branch)
        if: always() && steps.check.outputs.already_published != 'true'
        run: |
          STATE=experiments/daily-report/output/state
          if [ ! -f "$STATE/regime.jsonl" ]; then
            echo "분석 이력 없음 — 저장을 건너뜁니다."
            exit 0
          fi
          # 원격에 브랜치가 있는데 이번 실행에서 못 받았다면(Load 단계 실패) 절대 쓰지 않는다.
          if git ls-remote --exit-code --heads state report-state > /dev/null 2>&1 \
             && ! git rev-parse --verify -q refs/report-state > /dev/null; then
            echo "::error::report-state 가 원격에 있는데 이번 실행에서 불러오지 못했습니다. 이력 보호를 위해 저장하지 않습니다."
            exit 1
          fi
          # 그날 글의 렌더 입력도 남긴다 — 디자인이 바뀐 날 같은 글을 다시 그려 갱신할 수 있게 (2026-10-12 사용자:
          # "데일리 리포트는 왜 디자인 변경된 것이 반영이 안 되었지"). 다시 그리기: state/last/* 를 output/ 에 복사 → render_html.py
          OUT=experiments/daily-report/output
          mkdir -p "$STATE/last"
          for f in report_input.json report.out.json analysis.json title.txt image_ref.txt; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE/last/$f"
          done
          # 공개 브랜치에 매체(CNBC) 요약문 원문을 남기지 않는다 — 제목 · 링크 · 우리 번역만 (2026-10-21, 운영지침 D4-2)
          python - "$STATE/last/report_input.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              d = json.load(open(p, encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(0)
          for it in d.get("news") or []:
              it.pop("summary", None)
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False)
          PY
          # 실행 한 줄 — records/runs (2026-11-07, 데이터-기록-계획 A3-3-2 의 1: 실패한 날이 "신호 없던 날" 로 읽히지 않게)
          python experiments/record_store.py run-log "$STATE" daily "${{ steps.run_daily.outcome }}" "job=${{ job.status }}"
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          # 임시 인덱스에 state 디렉터리만 담아 트리를 만든다. 작업 트리와 main 인덱스는 건드리지 않는다.
          # output/ 은 .gitignore 대상이라 -f 가 필요하다.
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/report-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update analysis history [skip ci]")"
          else
            echo "report-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update analysis history [skip ci]")"
          fi
          git push state "$COMMIT:refs/heads/report-state"
          echo "저장: $COMMIT"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: experiments/daily-report/output/

      # 파이썬 밖 단계(이력 불러오기 · 이미지 배포 · purge · 상태 저장)의 실패도 알린다 (2026-10-21, 운영지침 D6-3)
      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 미국 데일리 리포트\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true

      # 오늘 실패 알림이 나간 뒤 이번 실행에서 게시에 성공했을 때만 '다시 성공' 알림. 평소 성공은 조용히 (2026-11-10 사용자)
      - name: Notify recovered
        if: success() && hashFiles('experiments/daily-report/output/post_meta.json') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/notify_recovered.py "미국 데일리 리포트" experiments/daily-report/output/post_meta.json
