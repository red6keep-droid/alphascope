# 한국 기사 공용 저장소 — 뉴스 수집기(News-text) 블로그 저장소의 사건별 사실 · 기사 제목 → 날짜별 공개 JSON (2026-11-24 사용자)
#
# 실행: Cloudflare Worker(infra/cron-trigger) 09:20 · 18:20 KST — 수집기 정기 실행 07:00 · 16:30 이 facts 를 쓴 뒤(07:46 · 17:1x 쯤).
#       + 평일 12:20 · 15:20 KST — 수집기 가벼운 회차 11:40 · 14:40 의 장중 사실 뒤 (2026-11-25 사용자 "2회로", 요청 문서 31절).
#       사람은 Run workflow 버튼(scheduled 끄고). 분 :20 = 운영지침 11절 다른 쓰기 시각과 겹치지 않는 자리(:20 = 06:20 · 08:20 · 16:20 만 씀).
# 읽기: news-text-blog Firestore(facts · headlines) — 블로그 서비스 계정 roles/datastore.viewer, 읽기 하루 약 2회 × 문서 10개 안팎.
# 쓰기: ① 비공개 상태 저장소 alphascope-state 의 kr-facts 브랜치(날짜 파일 누적 = 기록, 수집기는 30일 뒤 지운다)
#       ② gh-pages kr-facts.json = 가장 최근 날 파일 하나(약 100KB, 같은 이름 덮어씀) — 미국 news.json · 방송 kr-news.json 과 같은 자리 · 같은 jsDelivr 길.
#          한국 홈 · 한국 증시 리포트 뉴스 탭이 읽는다. 날짜 파일은 gh-pages 에 쌓지 않는다(상자 50MB · 이력) — 기록은 ①.
#          (11-24 첫 판은 Pages 프로젝트 newfact-news 였다 → 다른 뉴스와 따로 놀아 같은 날 gh-pages 로 옮김, 사용자 "왜 뉴팩트 기사만")
# AI 0 · Blogger 0 · gh-pages 푸시 하루 2회(평일 4회). 실패해도 다른 실행에 영향 없음 — 화면은 지난 파일을 그대로 읽는다.
name: 한국 기사 공용 저장소

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '상태 저장소 · gh-pages 에 올리기 (끄면 만들기만, 결과는 artifact)'
        type: boolean
        default: true
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 사람은 끄고 쓴다'
        type: boolean
        default: false

permissions:
  contents: write   # gh-pages kr-facts.json

concurrency:
  group: kr-facts
  cancel-in-progress: false

jobs:
  kr-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORE: /tmp/kr-facts-store
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install requests google-auth

      # 지난 날짜 파일을 받아 이어 쓴다. 브랜치가 있는데 못 받으면 멈춘다 — 빈 폴더로 올려 기록을 지우지 않게.
      - name: Previous store (alphascope-state kr-facts)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          [ -z "$STATE_DEPLOY_KEY" ] && { echo "::error::STATE_DEPLOY_KEY 없음 — 기록을 이어 쓸 수 없어 멈춤"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          REPO=git@github.com:red6keep-droid/alphascope-state.git
          set +e; git ls-remote --exit-code --heads "$REPO" kr-facts >/dev/null; rc=$?; set -e
          if [ "$rc" = 0 ]; then
            git clone -q --depth 1 -b kr-facts "$REPO" "$STORE"
            echo "지난 날짜 파일 $(ls $STORE/kr/facts 2>/dev/null | grep -c '^20') 개"
          elif [ "$rc" = 2 ]; then
            echo "kr-facts 브랜치 없음 — 처음 실행"
            mkdir -p "$STORE" && cd "$STORE" && git init -q && git checkout -q --orphan kr-facts && git remote add origin "$REPO"
          else
            echo "::error::상태 저장소 확인 실패 ($rc)"; exit 1
          fi

      - name: Build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONIOENCODING: utf-8
        run: python experiments/news-posts/kr_facts_store.py --out "$STORE"

      # 원본 기록 — 실행마다 받은 그대로(gzip), 있는 파일은 다시 안 씀. 날짜 파일은 그날 마지막 실행만 남으므로 아침 실행 · 1곳 보도 사건까지 여기에 (헌법 제4조 4항, 2026-11-24)
      - name: Raw record (facts · headlines per run)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONIOENCODING: utf-8
        run: python experiments/news-posts/kr_facts_raw.py --out "$STORE"

      - name: Save store (alphascope-state kr-facts)
        if: inputs.deploy || inputs.scheduled
        run: |
          cd "$STORE"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -q -m "kr facts $(date -u +%FT%H:%MZ) [skip ci]" && git push -q origin HEAD:kr-facts; fi
          echo "저장소 $(du -sh --exclude=.git . | cut -f1)"

      # 다른 홈 파일과 같은 방식(kr-stocks.yml Deploy kr.json) — keep_files 로 이 파일 하나만 덮는다. 09:20 · 18:20 에 다른 gh-pages 푸시 없음
      - name: Deploy kr-facts.json to gh-pages
        if: inputs.deploy || inputs.scheduled
        run: mkdir -p deploy-home && cp "$STORE/kr/facts/latest.json" deploy-home/kr-facts.json && ls -la deploy-home

      - name: Push gh-pages
        if: inputs.deploy || inputs.scheduled
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-home
          publish_branch: gh-pages
          keep_files: true

      - name: Purge kr-facts.json cache
        if: inputs.deploy || inputs.scheduled
        continue-on-error: true
        run: |
          sleep 10   # 푸시 직후 퍼지는 jsDelivr 가 옛 커밋을 다시 붙잡는다(11-05) — 잠깐 기다린다
          bash .github/scripts/jsd_purge.sh kr-facts.json deploy-home/kr-facts.json || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-facts
          path: /tmp/kr-facts-store/kr
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 한국 기사 공용 저장소 (화면은 지난 파일 그대로)\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
