name: Quick stock data (간단 정보 853종목)

# 간단 정보 — 미국 S&P 500 + 한국 코스피 200 · 코스닥 150, 종목마다 화면 조각 하나 (2026-11-14, 기획 비공개 기획/회원-내-종목-기획.md 6-3-1 · 6-3-2 · 6-6).
#   - 화면 = 정식 종목 렌더러 그대로(experiments/stock-quick/full_us.py · full_kr.py — 2026-11-14 사용자 "TIGER 2차전지처럼 · 정식과 거의 차이 없게").
#     빠지는 것 = 옵션 · 뉴스 · 방송 · 소송. 상세 값은 주기에 맞춰 하루 상한만큼(첫 주에 나눠 채움).
#   - 두 번, 시장마다 따로 (2026-11-15 사용자): 미국 = 화~토 08:20 KST(정식 07:30 실행이 끝난 뒤 · 미국 장 마감 뒤 같은 종가 · 06:40 뉴스), 한국 = 월~금 17:40 KST(한국 장 마감 뒤).
#     쉬는 시장 조각은 지난 결과(없으면 Pages)에서 그대로 옮긴다 — 옮길 것이 모자라면 두 시장 다 새로(collect_quick --market). 분은 :40 — 운영지침 11절 다른 쓰기 시각(:00 · :15 · :30 · :45 · :07 · :22 · :37 · :52 · :10)과 겹치지 않게.
#   - AI 0 · Blogger 0 · 그림 0. 야후: 일봉 묶음 약 10번 + 상세 하루 상한(미국 90 · 한국 60종목) + 고점 회복 묶음 2번. Finnhub 실적 달력 주 1회 약 17번(첫 실행 약 120번).
#     SEC companyfacts 하루 100곳 · DART 하루 30곳(새 보고서만) + 기업개황 60곳 + 공시 목록 약 20번. FRED 하루 한 번.
#   - 결과 = 기록을 남기지 않는 브랜치 quick-us · quick-kr 에 통째로(force) — 저장소가 커지지 않는다. 시장별로 나눈 것은 한 묶음이 jsDelivr 150MB 안에 들게.
#     커밋 둘: ① 데이터 ② version.json 에 ①의 커밋 번호. 브라우저는 @quick-us/version.json(purge) → @<커밋>/us/UBER.html 로 읽는다.
#   - 종목 전용 페이지(publish_quick_shells.py) · 기업 소개(company_intro.py, Gemini lite 하루 25회까지) — 2026-11-15 사용자.
#   - 예비 = Cloudflare Pages alpha-scope.pages.dev(2026-11-15 사용자, 블로그 red6 계정): 같은 조각을 매일 배포, 브라우저는 Pages 먼저 → jsDelivr → GitHub 원본.
#   - 정식 자료(비교 묶음 · 자금 흐름 · 시장 일정 · 모은 기사)는 비공개 상태 저장소에서 읽기만. 간단 종목 저장값은 비공개 quick-state(다시 모을 수 있는 캐시라 기록 없이 덮어씀).
#   - 게시 = 저장소 변수 QUICK_PUBLISH=true. 없으면 그림자 모드(만들기만 하고 올리지 않음, 표본만 아티팩트). 저장값은 그림자 모드에서도 남긴다(첫 주 채우기가 이어지게).
#   - 받은 종목이 명단의 90% 밖이면 collect_quick.py 가 종료 코드 3 → 올리지 않고 전날 데이터 그대로.

run-name: "Quick stock data (간단 정보 853종목) · ${{ github.event_name == 'schedule' && (github.event.schedule == '20 23 * * 1-5' && 'us' || 'kr') || inputs.market || 'all' }}"   # 끝 = 시장 — 중복 건너뛰기가 같은 시장만 센다

on:
  schedule:
    - cron: '20 23 * * 1-5'   # 미국 — UTC 월~금 23:20 = KST 화~토 08:20 (정식 07:30 실행이 07:56~59 에 끝난 뒤 · 야후 겹침 없게. 옛 17:40 은 한국 낮 내내 하루 늦었다)
    - cron: '40 8 * * 1-5'    # 한국 — KST 월~금 17:40
  workflow_dispatch:
    inputs:
      publish:
        description: 'quick-us · quick-kr 브랜치에 올리기 (끄면 그림자 모드)'
        type: boolean
        default: false
      market:
        description: '새로 만들 시장 (all · us · kr)'
        default: 'all'
      scheduled:
        description: 'Cloudflare Worker 용 — 정기 실행처럼(게시 변수 · 중복 건너뛰기) (사람은 끄고 쓴다)'
        default: 'false'

permissions:
  contents: write
  actions: read   # 중복 건너뛰기(check)가 실행 목록을 읽는다

concurrency:
  group: quick-data
  cancel-in-progress: false

env:
  MARKET: ${{ github.event_name == 'schedule' && (github.event.schedule == '20 23 * * 1-5' && 'us' || 'kr') || inputs.market || 'all' }}
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}   # 운영 기록 — 대시보드 AI 칸에 잡히게 (2026-11-15)
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  DO_PUBLISH: ${{ ((github.event_name == 'schedule' || inputs.scheduled == 'true') && vars.QUICK_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  # 같은 날 두 번 막기 — Cloudflare Worker(infra/cron-trigger)와 GitHub cron 이 둘 다 건다(GitHub cron 은 자주 늦거나 빠진다).
  # 정기 실행(schedule · Worker 의 scheduled=true)만: 최근 6시간 안에 이 워크플로가 이미 성공했으면 건너뛴다. 사람이 거는 실행은 늘 돈다 (2026-11-15 사용자)
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
        run: |
          skip=false
          if [ "$SCHEDULED" = true ]; then
            since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow quick-data.yml --status success -L 20 --json createdAt,databaseId,displayTitle \
                -q "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID and (.displayTitle | endswith(\"· $MARKET\")))] | length" || echo 0)
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"; echo "종목 주가 중복 건너뛰기: $skip"

  quick:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80   # 첫 주: 상세 값 채우기 35분 + 기업 소개 · 전용 페이지(하루 50쪽 약 5분) (2026-11-15)
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 방송 요약 날짜 파일 캐시 (experiments/media_feed.py, 2026-11-16 수집기 요청 News-doc/블로그-Firestore-읽기-줄이기.md).
      # 그제 이전 edition 만 들어 있다 — 실행마다 Firestore 는 오늘 · 어제 묶음만 읽는다. 키 = 워크플로 · KST 날짜(하루 한 번 저장, 날짜가 바뀌면 전날 것을 이어 받는다)
      - name: Media feed day key
        id: mfkey
        run: echo "d=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore media feed cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/alphascope-media
          key: media-feed-${{ github.workflow }}-${{ steps.mfkey.outputs.d }}
          restore-keys: media-feed-${{ github.workflow }}-

      - name: Install
        run: pip install -r experiments/nvda-report/requirements.txt

      # 정식 자료 — 읽기만: 미국 상세 값(radar/detail_cache · 비교 묶음) · 시장 일정(calendar.jsonl) · 모은 기사 · 한국 자금 흐름 · 고점 회복 · 시총(kr-state).
      # 간단 종목 저장값 = quick-state. 못 받으면 그 카드만 빈다
      - name: State (private alphascope-state, read)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p /tmp/news /tmp/radar /tmp/qcache
          git fetch -q origin gh-pages && git show FETCH_HEAD:news_store_home.json > /tmp/news/home.json || true
          [ -z "$STATE_DEPLOY_KEY" ] && { echo "STATE_DEPLOY_KEY 없음 — 정식 자료 없이"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
          if git fetch -q --no-tags state nvda-state:refs/remotes/state/nvda-state; then   # 한국 렌더러(us_calendar)가 이 이름으로 읽는다
            S=refs/remotes/state/nvda-state; P=experiments/nvda-report/output/state
            git show $S:$P/radar/news.json > /tmp/news/radar.json || true
            git show $S:$P/radar/detail_cache.json > /tmp/radar/detail_cache.json || rm -f /tmp/radar/detail_cache.json
            git show $S:$P/calendar.jsonl > /tmp/calendar.jsonl || true
          fi
          git fetch -q state report-state && git show FETCH_HEAD:experiments/daily-report/output/state/news_stories.json > /tmp/news/daily.json || true
          if git fetch -q state kr-state; then git archive FETCH_HEAD experiments/kr-stocks/data | tar -x && echo "한국 정식 상태: $(ls experiments/kr-stocks/data | wc -l)개"; fi
          if git fetch -q state quick-state; then git archive FETCH_HEAD | tar -x -C /tmp/qcache && echo "저장값: $(du -sh /tmp/qcache | cut -f1)"; else echo "저장값 없음 (첫 실행)"; fi
          # 인물 발언 — 인물 레이더가 radar-state 에 남긴 파일(정식 nvda-report 와 같은 자리). 그 종목을 지목한 발언이 있을 때만 구획 (2026-11-15 사용자)
          mkdir -p experiments/people-radar/output/state
          { git fetch -q --no-tags state radar-state && git show FETCH_HEAD:experiments/people-radar/output/state/people_mentions.json > experiments/people-radar/output/state/people_mentions.json && echo "인물 발언 파일 받음"; } || { rm -f experiments/people-radar/output/state/people_mentions.json; echo "인물 발언 파일 없음"; }
          # 간단 종목 뉴스(quick-news.yml 06:40 이 남긴 분류 · 요약) — 있으면 미국 오늘 탭에 정식과 같은 중요 이슈 · 뉴스 · 뉴스 의견 (2026-11-15 3단계). 없으면 `이름이 나온 기사` 카드
          mkdir -p /tmp/qnews && { git fetch -q state quick-news-state && git archive FETCH_HEAD | tar -x -C /tmp/qnews && echo "간단 종목 뉴스: $(ls /tmp/qnews | tr '\n' ' ')"; } || echo "간단 종목 뉴스 없음"
          ls -la /tmp/news /tmp/radar

      # 전날 데이터 — 오늘 못 받은 종목은 전날 파일 · 조각 그대로
      - name: Previous quick-us · quick-kr
        run: |
          mkdir -p /tmp/prev
          for m in us kr; do   # 브랜치 안 = version.json + us/ (또는 kr/) → /tmp/prev/us/…
            if git fetch -q origin quick-$m 2>/dev/null; then git archive FETCH_HEAD $m | tar -x -C /tmp/prev; git show FETCH_HEAD:version.json > /tmp/prev/$m/version.json || true; echo "전날 $m $(ls /tmp/prev/$m | wc -l)"; else echo "전날 $m 없음 (첫 실행)"; fi
          done

      - name: Collect · render
        id: collect
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}   # 방송 줄 · 방송 의견 (media_feed, 정식과 같은 읽기 전용 키) — 없으면 그 칸 없이
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 기업 소개(company_intro) — Gemini lite 하루 25회까지, 한도면 다음 날 (2026-11-15 사용자)
        run: |
          set +e
          python experiments/stock-quick/collect_quick.py --out /tmp/qd --cache /tmp/qcache --prev /tmp/prev \
            --radar /tmp/radar --calendar /tmp/calendar.jsonl --news /tmp/news/*.json --qnews /tmp/qnews --market "$MARKET"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 3 ] && { echo "받은 종목 부족 — 올리지 않는다"; exit 0; }
          exit $code

      - name: Upload sample (shadow)
        if: env.DO_PUBLISH != 'true' && steps.collect.outputs.code == '0'
        run: |
          mkdir -p /tmp/sample/us /tmp/sample/kr
          cp /tmp/qd/us/version.json /tmp/qd/us/UBER.* /tmp/qd/us/SBUX.* /tmp/sample/us/ 2>/dev/null || true
          cp /tmp/qd/kr/version.json /tmp/qd/kr/259960.* /tmp/qd/kr/010140.* /tmp/sample/kr/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true' && steps.collect.outputs.code == '0'
        with:
          name: quick-sample
          path: /tmp/sample
          retention-days: 3

      # 종목 전용 고정 페이지 (2026-11-15 사용자: /p/stock.html?s= 하나로는 Blogger 대표 주소가 ?s= 를 떼어 검색 · 공유가 종목별로 안 잡힌다).
      # 소개가 있는 종목만 · 새 페이지 하루 50 · 고쳐 쓰기 100 · 4초 간격 · 429 면 멈춤. 본문은 작은 불러오기 코드라 스크립트를 고쳐도 다시 안 쓴다.
      # 주소표(/tmp/qd/shells.json) → Pages /shells.json — /p/stock.html?s= 가 전용 페이지로 넘긴다
      - name: Shell pages (Blogger, 종목 전용 페이지)
        id: shells
        if: env.DO_PUBLISH == 'true' && steps.collect.outputs.code == '0'
        continue-on-error: true
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python experiments/stock-quick/publish_quick_shells.py --cache /tmp/qcache --publish --map /tmp/qd/shells.json

      # 저장값은 게시 여부와 상관없이 남긴다 — 하루 상한으로 나눠 채우는 것이 이어지게. 다시 모을 수 있는 캐시라 기록 없이 덮어쓴다(저장소가 커지지 않게)
      - name: Save quick-state (private, no history)
        if: always() && steps.collect.outcome == 'success'
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          [ -z "$STATE_DEPLOY_KEY" ] && exit 0
          cd /tmp/qcache
          git init -q && git checkout -q --orphan quick-state
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git add -A && git commit -q -m "quick state $(date -u +%F) [skip ci]"
          git push -q -f git@github.com:red6keep-droid/alphascope-state.git HEAD:quick-state
          echo "저장값 $(du -sh . | cut -f1)"

      # Cloudflare Pages alpha-scope.pages.dev — jsDelivr 예비이자 먼저 읽는 곳 (2026-11-15 사용자: 용량 · 전송량 덜기, 이사 아님).
      # 블로그 Cloudflare 계정(red6)만 — 계정 ID 고정, 토큰 = Pages 쓰기 권한만. 독자가 보는 페이지가 아직 없어 그림자 모드에서도 올린다(확인용).
      # 배포 하나 = 사이트 전체: us/ · kr/ · _headers(CORS · 검색 제외) · robots.txt · 404.html. 바뀐 파일만 올라간다. 실패해도 jsDelivr 길은 그대로.
      - name: Publish Cloudflare Pages (spare)
        if: steps.collect.outputs.code == '0'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a8718df7edc5f8f6ce88e75b6545e5cb
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "CF_PAGES_API_TOKEN 없음 — Pages 건너뜀"; exit 0; }
          python experiments/stock-quick/publish_quick_shells.py --cache /tmp/qcache --bundle   # js/quick.js = quick_page.js + 봉차트 (전용 페이지가 받는 스크립트)
          git diff --quiet -- experiments/stock-quick/pages_static/js/quick.js || echo "::warning::저장소의 js/quick.js 가 옛것 — jsDelivr 예비가 옛 스크립트를 낸다. --bundle 로 다시 만들어 커밋"
          mkdir -p /tmp/cfp && cp -r /tmp/qd/us /tmp/qd/kr /tmp/cfp/ && cp -a experiments/stock-quick/pages_static/. /tmp/cfp/
          [ -f /tmp/qd/shells.json ] && cp /tmp/qd/shells.json /tmp/cfp/shells.json
          # 검색어 미리보기 목록(정식 · 간단 종목 이름 · 티커 · 주소, 약 110KB) — 블로그 검색 창이 처음 열 때 한 번 읽는다 (2026-11-16 사용자)
          python experiments/site-search/build_names.py --cache /tmp/qcache --shells /tmp/qd/shells.json --out /tmp/cfp/names.json || echo "::warning::검색어 미리보기 목록 실패 — 검색 창은 정식 종목만 미리 보인다"
          echo "Pages 파일 $(find /tmp/cfp -type f | wc -l)개 · $(du -sh /tmp/cfp | cut -f1)"
          npx --yes wrangler@4.162.0 pages deploy /tmp/cfp --project-name alpha-scope --branch main --commit-dirty=true
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://alpha-scope.pages.dev/us/UBER")
          echo "확인 us/UBER → $code"; [ "$code" = 200 ] || echo "::warning::Pages 확인 실패 ($code) — 독자는 jsDelivr 로 읽는다"

      - name: Publish quick-us · quick-kr (no history)
        if: env.DO_PUBLISH == 'true' && steps.collect.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in us kr; do
            mkdir -p /tmp/pub-$m/$m && cp -r /tmp/qd/$m/. /tmp/pub-$m/$m/ && mv /tmp/pub-$m/$m/version.json /tmp/pub-$m/version.json
            cd /tmp/pub-$m
            git init -q && git checkout -q --orphan quick-$m
            git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "quick $m $(date -u +%F)"
            SHA=$(git rev-parse HEAD)
            python -c "import json,sys;p='version.json';v=json.load(open(p));v['commit']=sys.argv[1];json.dump(v,open(p,'w'),ensure_ascii=False)" "$SHA"
            git add version.json && git commit -q -m "version $SHA"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:quick-$m
            echo "올림: quick-$m 데이터 $SHA · $(du -sh $m | cut -f1)"
            curl -sS -f "https://purge.jsdelivr.net/gh/${{ github.repository }}@quick-$m/version.json" || echo "purge 실패 — 최대 12시간 뒤 갱신"
            cd /tmp
          done

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 간단 정보 (853종목)\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
