name: Radar news early (미국 종목 뉴스 먼저 분류)

# 미국 종목(시총 상위 · 정식 76종목) 뉴스 수집 · AI 분류를 미국 장 마감 전에 먼저.
#   - 옛: 장 마감 뒤 엔비디아 실행(NVDA Report)이 전날 13:00 뒤 쌓인 기사 500~600건을 한꺼번에 분류 — 약 10분(Gemini 503 재시도 · Groq 60초 간격 포함).
#     이제 KST 04:30(미국 장 중)에 그때까지 기사를 분류해 radar/news.json(작업 브랜치 nvda-work)에 남기고, 장 마감 뒤 실행은 그 뒤 들어온 50건 안팎만 분류한다.
#   - 같은 코드(stock-radar/collect_news.py → news_store.classify, 사슬 news = lite 먼저) · 같은 상태 파일. AI 총 호출 수는 같고 시각만 나뉜다.
#   - 정시 = Cloudflare Worker KST 04:30 (화~토 = 미국 월~금). GitHub cron 예비 없음 — 빠져도 장 마감 뒤 실행이 예전처럼 전부 분류한다.
#   - 상태 커밋 메시지에 news-early — 엔비디아 실행의 `오늘 이미 돌았나` 판정이 이 커밋은 세지 않는다.
#   - 늦게 와서(KST 06시 뒤) 장 마감 뒤 실행과 겹칠 때는 건너뛴다(같은 nvda-report 줄에 서지만 그 실행을 늦추지 않게).

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Cloudflare Worker 용 — 정기 실행처럼(늦으면 건너뜀)'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: nvda-report
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  STATE_DIR: experiments/nvda-report/output/state
  PYTHONUNBUFFERED: '1'

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Too late?
        id: late
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ inputs.scheduled }}" = "true" ] && { [ "$H" -lt 3 ] || [ "$H" -ge 6 ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "KST ${H}시 — 장 마감 뒤 실행과 겹칠 수 있어 건너뜀"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.late.outputs.skip != 'true'
      - name: Set up Python
        if: steps.late.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        if: steps.late.outputs.skip != 'true'
        run: pip install -r experiments/nvda-report/requirements.txt
      # radar/news.json 은 이력 없는 작업 브랜치 nvda-work 에 있다(nvda-report.yml 저장 단계 WORK). 없으면 옛 nvda-state
      - name: Load news (nvda-work)
        if: steps.late.outputs.skip != 'true'
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
          mkdir -p experiments/stock-radar/data
          F="$STATE_DIR/radar/news.json"
          if git fetch -q --no-tags state nvda-work:refs/nvda-work 2>/dev/null && git show "refs/nvda-work:$F" > experiments/stock-radar/data/news.json 2>/dev/null; then
            echo "nvda-work 에서 읽음"
          else
            git fetch -q --no-tags state nvda-state:refs/nvda-state
            git show "refs/nvda-state:$F" > experiments/stock-radar/data/news.json
            echo "nvda-work 에 없음 — nvda-state 에서 읽음"
          fi
          echo "기사 $(python -c "import json;print(len(json.load(open('experiments/stock-radar/data/news.json'))))")건"
      - name: Collect · classify
        id: news
        if: steps.late.outputs.skip != 'true'
        env:
          NEWS_MAX_MINUTES: '20'
        run: python experiments/stock-radar/collect_news.py
      # 최신 nvda-work 위에 radar/news.json 하나만 바꿔 덮어씀(이력 없음, 다른 작업 파일은 그대로). 같은 concurrency 줄이라 nvda-report 와 겹치지 않는다
      - name: Save news.json (nvda-work)
        if: steps.news.outcome == 'success'
        run: |
          F="$STATE_DIR/radar/news.json"
          export GIT_INDEX_FILE="$(mktemp -u)"
          if git fetch -q --no-tags state nvda-work:refs/nvda-work 2>/dev/null; then git read-tree refs/nvda-work; fi
          git update-index --add --cacheinfo 100644,"$(git hash-object -w experiments/stock-radar/data/news.json)","$F"
          TREE="$(git write-tree)"; unset GIT_INDEX_FILE
          if git rev-parse -q --verify refs/nvda-work >/dev/null && [ "$TREE" = "$(git rev-parse refs/nvda-work^{tree})" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "alphascope-bot" && git config user.email "bot@users.noreply.github.com"
          COMMIT="$(git commit-tree "$TREE" -m "nvda work files (no history, news-early) [skip ci]")"
          git push -q -f state "$COMMIT:refs/heads/nvda-work" && echo "저장: $COMMIT"
      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"⚠️ 워크플로 실패 — 미국 종목 뉴스 먼저 분류 (장 마감 뒤 실행이 예전처럼 전부 분류)\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
