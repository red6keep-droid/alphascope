name: People Radar

# 인물 발언 레이더 (experiments/people-radar). "트럼프 · 연준 · 월가 인물 발언" 글을 하루 한 번 게시한다.
# 신호 0개면 게시하지 않고, 같은 날 글이 이미 있으면 본문을 갱신한다(publish.py) — 두 번 돌아도 글이 겹치지 않는다.
# 스케줄 실행은 오늘 글이 이미 있으면 처음부터 건너뛴다(Check 단계, 2026-10-26).
#
# 트럼프 Truth Social 라벨(trump-state)과 데일리 시장 맥락(report-state)을 읽으므로 두 실행이 끝난 뒤에 돈다.
# 발언 이력(statements.jsonl, 30일)은 radar-state 브랜치에 trump-state 와 같은 방식(이전 커밋 위 일반 push)으로 남긴다.
# 2026-10-22 사용자: "인물 발언 자동실행해줘".

on:
  schedule:
    # 정시 실행은 Cloudflare Worker가 뉴욕 18:00(KST 07:00 서머타임 / 08:00 표준시)에 건다 (infra/cron-trigger).
    # 이 cron 은 예비 — 23:00 UTC = KST 08:00. 트럼프(22:15 UTC) · 데일리(22:00 UTC) GitHub cron 예비 시각보다 뒤.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Blogger에 실제 게시 (false면 dry-run)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read   # notify_recovered.py — 오늘 실패한 실행이 있었는지 본다

concurrency:
  group: people-radar
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  # 운영 기록 → Cloudflare KV (experiments/ops_log.py · infra/ops-console, 2026-10-23). 셋 중 하나라도 없으면 기록하지 않는다
  OPS_CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
  OPS_CF_KV_NAMESPACE_ID: ${{ secrets.OPS_CF_KV_NAMESPACE_ID }}
  OPS_CF_API_TOKEN: ${{ secrets.OPS_CF_API_TOKEN }}
  BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
  BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
  BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
  PYTHONUNBUFFERED: "1"   # 로그를 바로 찍는다 — 10-28 시간 초과 때 출력이 버퍼에 묶여 어디서 멈췄는지 안 보였다
  STATE_DIR: experiments/people-radar/output/state
  DO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.scheduled == true || inputs.publish == true }}
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}

jobs:
  people-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 10-26: Groq 를 실제로 쓰게 되며 호출 간격(60초+) 대기가 늘었다. 10-28: 하루치(추출 11 + 분류 7배치)가 45분을 넘겨 60으로
    steps:
      - uses: actions/checkout@v5

      # 상태 · 기록 브랜치는 비공개 저장소 alphascope-state 에 둔다 (2026-11-04 사용자: 기록은 우리 자산 — 공개 저장소에 두지 않는다). 쓰기 배포 키 = Secret STATE_DEPLOY_KEY
      - name: State repo (private alphascope-state)
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/state_key && chmod 600 ~/.ssh/state_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/state_key -o IdentitiesOnly=yes"
          git remote add state git@github.com:red6keep-droid/alphascope-state.git
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # publish.py 가 daily-report 의 publish_blogger 를 쓴다
      - name: Install dependencies
        run: |
          pip install -r experiments/people-radar/requirements.txt
          pip install -r experiments/daily-report/requirements.txt

      # 오늘(KST) 글이 이미 있으면 이후 단계를 전부 건너뛴다 — 예비 GitHub cron 이 외부 cron 실행 뒤에
      # 전체를 한 번 더 돌려 Groq · Gemini 호출이 매일 두 배였다 (2026-10-26). 트럼프 · NVDA 와 같은 방식.
      # 확인이 실패하면 게시 안 된 것으로 보고 진행한다(check_published.py).
      - name: Check if today's post is already published
        id: check
        if: env.IS_SCHEDULED == 'true'
        run: python experiments/daily-report/check_published.py --series people

      # classify.py 는 state/trump-state, aggregate.py 는 state/report-state, 크레이머 매드머니(madmoney.py)는 state/media-state 를 git show 로 읽는다.
      # actions/checkout 은 main 만 받으므로 원격 추적 ref 로 따로 받는다. 없으면 각 단계가 알아서 건너뛴다.
      - name: Fetch trump-state / report-state / radar-state / media-state
        if: steps.check.outputs.already_published != 'true'
        run: |
          for b in trump-state report-state radar-state media-state; do
            git fetch --no-tags state "$b:refs/remotes/state/$b" 2>/dev/null && echo "$b 받음" || echo "$b 없음"
          done
          if git rev-parse --verify -q refs/remotes/state/radar-state > /dev/null; then
            git archive refs/remotes/state/radar-state "$STATE_DIR" | tar -x
            echo "발언 이력 불러옴: $(wc -l < "$STATE_DIR/statements.jsonl" 2>/dev/null || echo 0)행"
          else
            echo "radar-state 없음 (첫 실행)"
          fi

      - name: Run pipeline
        id: run_people
        if: steps.check.outputs.already_published != 'true'
        working-directory: experiments/people-radar
        run: |
          if [ "$DO_PUBLISH" = "true" ]; then
            python main.py --state output/state --publish
          else
            python main.py --state output/state
          fi

      # 홈 카드 재료 cards/radar.json (H31, 2026-11-05) — 게시된 날만(post_meta.json 은 게시 스크립트가 남긴다).
      # 실패해도 글은 이미 게시돼 있고 홈은 피드 경로로 돌아간다(테마 JS cardJson → cardFeed). 재시도 1회 뒤에도 실패하면 Slack.
      - name: Home card radar.json
        if: hashFiles('experiments/people-radar/output/post_meta.json') != ''
        continue-on-error: true
        run: python experiments/daily-report/home_card.py --card radar --body experiments/people-radar/output/radar_body.html --meta experiments/people-radar/output/post_meta.json --out deploy-cards/cards/radar.json

      - name: Deploy radar.json to gh-pages
        id: cards_deploy
        if: hashFiles('deploy-cards/cards/radar.json') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-cards
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy radar.json to gh-pages (retry)
        id: cards_deploy_retry
        if: steps.cards_deploy.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정(태그는 바뀔 수 있다, 2026-11-14 보안 점검)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-cards
          publish_branch: gh-pages
          keep_files: true

      - name: Purge radar.json cache
        if: hashFiles('deploy-cards/cards/radar.json') != '' && steps.cards_deploy_retry.outcome != 'failure'
        continue-on-error: true
        run: curl -sS -f "https://purge.jsdelivr.net/gh/red6keep-droid/alphascope@gh-pages/cards/radar.json" || true

      - name: Notify card deploy failure
        if: steps.cards_deploy_retry.outcome == 'failure'
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"⚠️ 홈 카드 cards/radar.json 배포 실패(재시도 포함) — 주요 인물 발언. 홈은 피드로 돈다\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true

      # 추출 · 분류 결과는 뒤 단계가 실패해도 남긴다 — LLM 호출을 헛되게 하지 않기 위해.
      - name: Save state (radar-state branch)
        if: always() && steps.check.outputs.already_published != 'true'
        run: |
          if [ ! -f "$STATE_DIR/statements.jsonl" ]; then
            echo "저장할 상태 없음 — 건너뜁니다."
            exit 0
          fi
          OUT=experiments/people-radar/output
          for f in radar.json narrative.json; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$STATE_DIR/$f"
          done
          python experiments/record_store.py run-log "$STATE_DIR" people "${{ steps.run_people.outcome }}" "job=${{ job.status }}"   # 실행 한 줄 — records/runs (2026-11-07, A3-3-2 의 1)
          git config user.name "alphascope-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git add -f "$STATE_DIR"
          TREE="$(git write-tree)"
          unset GIT_INDEX_FILE
          if PARENT="$(git rev-parse --verify -q refs/remotes/state/radar-state)"; then
            if [ "$TREE" = "$(git rev-parse "$PARENT^{tree}")" ]; then
              echo "변경 없음 — 커밋하지 않는다."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "Update people-radar state [skip ci]")"
          else
            echo "radar-state 브랜치 없음 — 첫 커밋을 만든다."
            COMMIT="$(git commit-tree "$TREE" -m "Update people-radar state [skip ci]")"
          fi
          # force 없음: 원격이 앞서 있으면 거부된다
          git push state "$COMMIT:refs/heads/radar-state"
          echo "저장: $COMMIT"

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 워크플로 실패 — 주요 인물 발언\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true

      # 오늘 실패 알림이 나간 뒤 이번 실행에서 게시에 성공했을 때만 '다시 성공' 알림. 평소 성공은 조용히 (2026-11-10 사용자)
      - name: Notify recovered
        if: success() && hashFiles('experiments/people-radar/output/post_meta.json') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/notify_recovered.py "주요 인물 발언" experiments/people-radar/output/post_meta.json
