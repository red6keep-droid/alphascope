name: Market Commentary

# 증시 시황(AlphaScope 시황 해설) 발행 (2026-11-19 사용자 "발행기 만들어", 처음부터 공개).
# 수집기(News-sub)가 columns/{날짜}-{am|pm} 에 글을 쓰고(08:10 · 20:30, 마감 08:30 · 20:40), 이 워크플로가 ready 글만 읽어 발행한다.
# 블로그 AI 0. 순서 = 읽기 · 검사 · 배너(Workers AI 1장) → 배너 gh-pages → CDN 확인 → Blogger 공개 발행.
# 정시 = Cloudflare Worker(infra/cron-trigger KST 08:40 · 17:00 저녁 1차(평일) · 21:00). GitHub cron 은 예비 — 이미 발행됐으면 publish 단계가 건너뛴다
# (단 수집기 rev 가 올랐으면 같은 주소에 고쳐 쓴다 — 저녁 편 17:00 1차 → 21:00 rev 2, 2026-11-20 사용자 News-doc 31절),
# 발행 시각이 한참 지난 글(아침 12:00 · 저녁 23:59 KST 뒤)은 내지 않는다.

on:
  schedule:
    - cron: '10 0 * * *'    # KST 09:10 아침 편 예비
    - cron: '30 12 * * *'   # KST 21:30 저녁 편 예비
  workflow_dispatch:
    inputs:
      slot:
        description: 'am = 아침(미국 마감) · pm = 저녁(한국 마감)'
        type: choice
        options: [am, pm]
        default: am
      publish:
        description: 'Blogger 에 실제 발행 (끄면 준비 · 배너만, 결과는 artifact)'
        type: boolean
        required: false
        default: false
      redraw:
        description: '배너를 다시 그리기 (그 편 배너가 이미 있어도, Workers AI 1장)'
        type: boolean
        required: false
        default: false
      replace:
        description: '이미 나간 같은 편 글을 새 화면으로 고쳐 쓰기 (publish 와 같이 켠다)'
        type: boolean
        required: false
        default: false
      scheduled:
        description: '외부 cron(Cloudflare Worker)용 — 스케줄 실행과 똑같이 동작 (사람은 끄고 쓴다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: commentary
  cancel-in-progress: false

env:
  IS_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
  PYTHONIOENCODING: utf-8
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 429 다시 시도(30분 간격, 최대 5시간 30분) — 평소엔 1~2분
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r experiments/daily-report/requirements.txt

      - name: Slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 편 · 날짜 = 그 cron 의 예정 시각 기준(00:10 UTC = 아침 편, 12:30 UTC = 저녁 편).
            # 예비가 몇 시간 늦게 와도(11-19 저녁 예비가 11-20 05:53 KST 에 와 2026-11-20-pm 을 찾음) 원래 편 · 날짜를 본다
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, os, sys
          sys.path.insert(0, ".github/scripts")
          from run_guard import planned_time, KST
          cron = os.environ["SCHEDULE"]
          p = planned_time(cron, dt.datetime.now(dt.timezone.utc)) or dt.datetime.now(dt.timezone.utc)
          print("slot=" + ("am" if cron.split()[1] == "0" else "pm"))
          print("date=" + p.astimezone(KST).date().isoformat())
          PY
          else
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # 수집기 글 읽기(Firestore 1건) · 검사 · 배너 1장 · 본문. 검사에 걸리면 exit 1 → 아래 Notify failure 가 Slack
      - name: Prepare (read · check · banner · body)
        env:
          YTB_FIRESTORE_KEY: ${{ secrets.YTB_FIRESTORE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.OPS_CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python experiments/market-commentary/publish_commentary.py prepare --slot "${{ steps.slot.outputs.slot }}" --date "${{ steps.slot.outputs.date }}" ${{ inputs.redraw && '--redraw' || '' }}

      - name: Deploy banner to gh-pages
        id: banner_deploy
        if: hashFiles('experiments/market-commentary/output/publish/deploy/images/*.webp') != '' && (env.IS_SCHEDULED == 'true' || inputs.publish)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — 커밋 번호로 고정
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./experiments/market-commentary/output/publish/deploy
          publish_branch: gh-pages
          keep_files: true

      - name: Deploy banner to gh-pages (retry)
        id: banner_deploy_retry
        if: steps.banner_deploy.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./experiments/market-commentary/output/publish/deploy
          publish_branch: gh-pages
          keep_files: true

      # 푸시 직후 jsDelivr 가 옛 커밋을 붙잡는 일(11-10 표지 404) — 내용까지 맞춰 본다. 끝내 다르면 배너 없이 낸다(글은 막지 않음)
      - name: Purge and verify banner on CDN
        id: banner_cdn
        if: hashFiles('experiments/market-commentary/output/publish/banner_ref.txt') != '' && (env.IS_SCHEDULED == 'true' || inputs.publish)
        run: |
          REF=$(cat experiments/market-commentary/output/publish/banner_ref.txt)
          if [ "${{ steps.banner_deploy.outcome }}" = "failure" ] && [ "${{ steps.banner_deploy_retry.outcome }}" != "success" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"; echo "::warning::배너 gh-pages 올리기 실패 — 배너 없이 발행"; exit 0
          fi
          if bash .github/scripts/jsd_purge.sh "$REF" "experiments/market-commentary/output/publish/deploy/$REF"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"; echo "::warning::배너 CDN 확인 실패 — 배너 없이 발행"
          fi

      - name: Publish to Blogger
        if: hashFiles('experiments/market-commentary/output/publish/post.json') != '' && (env.IS_SCHEDULED == 'true' || inputs.publish)
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          FLAG=""
          [ "${{ steps.banner_cdn.outputs.failed }}" = "true" ] && FLAG="--banner-failed"
          [ "${{ inputs.replace }}" = "true" ] && FLAG="$FLAG --replace"
          # Blogger 429(종료 코드 75)면 30분 뒤 다시 — 마지막 시도 아침 편 11:30 · 저녁 편 23:30 KST, 한 실행 최대 5시간 30분.
          # 11-24 저녁 편이 17:00 · 21:00 두 번만 시도하고 빠졌다(종목 페이지 몰아 만들기 뒤 Blogger 가 4시간 넘게 막음). 평소(429 없음)엔 한 번으로 끝
          LAST=$([ "${{ steps.slot.outputs.slot }}" = am ] && echo 1130 || echo 2330)
          START=$(date +%s)
          while :; do
            set +e
            python experiments/market-commentary/publish_commentary.py publish --slot "${{ steps.slot.outputs.slot }}" $FLAG
            RC=$?
            set -e
            [ $RC -ne 75 ] && exit $RC
            NEXT=$(TZ=Asia/Seoul date -d '+30 min' +%H%M)
            if [ "$NEXT" \> "$LAST" ] || [ "$NEXT" \< "0600" ] || [ $(( $(date +%s) - START )) -gt 18000 ]; then
              echo "::error::Blogger 429 — 마지막 시도 시각(${LAST:0:2}:${LAST:2} KST)까지 막혀 이번 편은 내지 못함"; exit 1
            fi
            echo "Blogger 429 — 30분 뒤($(TZ=Asia/Seoul date -d '+30 min' +%H:%M) KST) 다시"
            sleep 1800
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-${{ steps.slot.outputs.slot }}
          path: experiments/market-commentary/output/publish/
          if-no-files-found: ignore

      - name: Notify failure
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 증시 시황 발행 실패 (${{ steps.slot.outputs.slot }}) — 검사에 걸렸거나 발행 오류. 글은 나가지 않았습니다\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL" || true
