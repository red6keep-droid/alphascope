name = "alphascope-cron-trigger"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false   # HTTP 엔드포인트 없음 — cron으로만 돈다

[triggers]
# UTC 하루 144번 깨어난다 (10-27 :10 추가) (2026-10-22: 시세 · 뉴스 수집을 붙이며 격자를 넓혔다 — 무료 한도 하루 10만 요청 안).
# 리포트는 src/index.js가 뉴욕 시각으로, 수집은 UTC 분 · 시로 판단한다. 트리거 1개 (무료 플랜 한도 5개).
crons = ["0,10,15,20,30,45 * * * *"]   # 리포트 :00 · :15 · :30, 시세 :00(장중 매시) · :20(마감 뒤), 뉴스 :45, 한국 종목 :10 (2026-10-27, 하루 144번)

# 비밀값은 여기 쓰지 않는다: npx wrangler secret put GITHUB_TOKEN
