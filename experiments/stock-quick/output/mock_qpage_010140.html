.as-news li > span { color: #6B7280; font-family: var(--num); font-size: 13px; margin-right: 8px; }
.as-more { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--ink, #0F172A); text-decoration: none; }
.as-more:hover { text-decoration: underline; }
.as-notice { background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; line-height: 24px; }

.as-basis { display: flex; gap: 6px; margin: 8px 0 0; color: #6B7280; font-size: 13px; line-height: 21px; }
.as-basis span { flex: none; }
.as-related { margin-top: 18px; }

.as-posts a { color: var(--ink, #0F172A); text-decoration: none; }
.as-posts a:hover { text-decoration: underline; }
.as-posts span { color: #94A3B8; font-family: var(--num); font-size: 13px; flex: none; }

/* 질문하기 */
.as-chat-fab { position: fixed; right: 20px; bottom: 20px; z-index: 150; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px;
  background: var(--ink, #0F172A); color: #fff; padding: 12px 18px; font: inherit; font-family: var(--sans); font-size: 15px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(15, 23, 42, .25); cursor: pointer; }

              var sub = el('span', 'news-sub', [mdhm(kstTime(it.published)), it.source || 'CNBC'].concat(media && it.n_channels > 1 ? ['방송 ' + it.n_channels + '곳'] : []).filter(Boolean).join(' · '));

        /* ====================================================== 오늘의 데일리 리포트

           블로거 피드에서 라벨별 최신 글 1건씩 받아 상단 카드 셋을 채운다 —
           데일리 브리핑 → 데일리 리포트 카드(+ 급등주), 트럼프 트렌드 → 트럼프 SNS 트렌드 카드,
           엔비디아 → 엔비디아 데일리 카드.
           라벨로 거르지 않으면 다른 연재 글이 최신일 때 그 글을 읽는다.

           리포트 본문은 h2 로 구획이 나뉘어 있어 제목 글자로 구간을 찾는다. 카드는
           '불러오는 중' 으로 시작하고, 피드를 못 받거나 구간을 못 찾으면 '불러올 수 없습니다',
           피드는 왔는데 글이 없으면 '아직 발행된 … 없습니다' 로 바꾼다 — 예시 문구를 남기면
           방문자가 오늘 내용으로 오해한다. 그러니 두 리포트 템플릿의 h2 를 바꾸면 CARDS 도 고친다. */

        /* 라벨별 최신 글 1건 */
        function feedUrl(label) {
          return '/feeds/posts/default/-/' + encodeURIComponent(label) + '?alt=json&max-results=1';
        }

        /* 글 본문 HTML (2026-11-04 사용자 H29: 사이트 피드를 "짧게"로 — 뉴스 매체 관행, 전문 복제 방지). 짧은 피드에는 content 가 없고 요약(summary)뿐이라
           글 주소(alternate)를 같은 도메인에서 받아 본문 칸(.post-body)만 쓴다 — 피드 content 와 같은 HTML. 피드가 전체면 그대로 content. 같은 글은 한 번만 받는다 */
        var bodyCache = {};
        function postBody(entry) {
          var c = (entry.content || {}).$t;
          if (c) return Promise.resolve(c);
          var href = '';
          (entry.link || []).forEach(function (l) { if (l.rel === 'alternate' && l.href) href = l.href; });
          if (!href) return Promise.resolve('');
          if (!bodyCache[href]) {
            bodyCache[href] = fetch(href, { credentials: 'omit' })
              .then(function (r) { return r.ok ? r.text() : ''; })
              .then(function (html) {
                if (!html) return '';
                var b = new DOMParser().parseFromString(html, 'text/html').querySelector('.post-outer-container .post-body, .post-body');
                return b ? b.innerHTML : '';
              })
              .catch(function () { return ''; });
          }
          return bodyCache[href];
        }

        /* 홈에는 리포트의 일부만 발췌해 싣는다. 게시된 글은 손대지 않는다 —

        ];

        /* 구획 하나에 싣는 최대 줄 수 — 카드는 요약이고 전체는 글에서 읽는다 (2026-10-12 사용자: 요약이 너무 길다 → 2줄, 한 줄 120자) */

        /* 구간의 문장들.

        var INLINE = { B: 1, I: 1, EM: 1, STRONG: 1, SPAN: 1, A: 1, BR: 1, SUP: 1, SUB: 1, CODE: 1, SMALL: 1, MARK: 1, SVG: 1 };   /* SVG: ⓘ 아이콘이 든 안내 줄도 한 줄로 읽는다 (2026-10-12) */

        function linesOf(nodes) {

          function blockSpan(n) { return n.tagName === 'SPAN' && /display:\s*(flex|block|grid)\b/.test(n.getAttribute('style') || ''); }

        var LOAD_FAILED = '리포트를 불러올 수 없습니다.';

        function nvdaLines(sec) {

              function txt(x) { var c = x.cloneNode(true); [].slice.call(c.querySelectorAll('svg, [data-tip]')).forEach(function (t) { t.parentNode.removeChild(t); }); return String(c.textContent || '').replace(/\s+/g, ' ').trim(); }

        /* 급등주 — 새 디자인은 카드 행(data-pick 속성)에서, 옛 글은 표의 세 칸에서 종목 / 가격 / 등락률을 읽는다 (2026-10-11) */
        function fillPicks(nodes) {

          var picks = [], table = null;
          for (var i = 0; nodes && i < nodes.length; i++) {
            var found = nodes[i].querySelectorAll ? nodes[i].querySelectorAll('[data-pick]') : [];
            for (var k = 0; k < found.length && picks.length < 5; k++) {
              picks.push({ sym: found[k].getAttribute('data-sym') || '', price: found[k].getAttribute('data-price') || '', chg: found[k].getAttribute('data-chg') || '' });
            }
            if (!table && nodes[i].tagName === 'TABLE') table = nodes[i];
          }
          var rows = (!picks.length && table && table.rows) || [];
          for (var r = 1; r < rows.length && picks.length < 5; r++) {
            var c = rows[r].cells;
            if (!c || c.length < 3) continue;
            picks.push({ sym: String(c[0].textContent || '').trim(), price: String(c[1].textContent || '').trim(), chg: String(c[2].textContent || '').trim() });
          }
          list.textContent = '';
          if (!picks.length) {
            list.appendChild(statusItem('불러올 수 없습니다.'));
            return;
          }
          picks.forEach(function (p) {
            var li = el('li', 'pick');
            li.appendChild(el('span', 'pick-name', p.sym));
            li.appendChild(el('span', 'pick-price', p.price));
            li.appendChild(el('span', 'pick-change ' + (p.chg.charAt(0) === '-' ? 'down' : 'up'), p.chg));
            list.appendChild(li);
          });
        }

        /* 홈 미국 증시 카드 — 리포트 본문 맨 위 그래프(a[data-zoom] > img)를 그대로 복제 (2026-10-21 사용자). 없으면 자리를 비운다 */
        function fillChart(hook, html) {
          var im = document.querySelector('[data-hook="' + hook + '"]');
          if (!im) return;
          var doc;
          try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { return; }
          var src = doc.querySelector('a[data-zoom] img, a[aria-label="그래프 확대 보기"] img');
          if (!src || !src.getAttribute('src')) return;
          fillChartSrc(hook, src.getAttribute('src'), src.getAttribute('alt'));
        }
        /* 홈 증시 카드 하루(장중) 그래프 (2026-11-14 사용자, 시안 B1 — 목업 design-samples/mock_home_card_day).
           재료 = 카드 JSON intraday {sym, prev, close, h, l, m:[장 시작부터 분], c:[값]} (home_card.py --intraday, 5분봉). 없거나 모자라면 false → 옛 그림.
           선 = 전날 종가 위 빨강 · 아래 파랑 + 옅은 면, 점선 = 전날 종가, 배경 가로 눈금 3줄. 글자는 모두 HTML:
           오른쪽 위 = ▲▼ 전날 대비 %(14) · 종가(16), 둘 다 그날 등락 색 / 최고(빨강) · 최저(파랑) 12 — 점 옆, 상자 끝에서 10 띄움 */
        function fillDayChart(hook, d) {
          var im = document.querySelector('[data-hook="' + hook + '"]');
          if (!im || !d || !d.m || !d.c || d.c.length < 20 || d.m.length !== d.c.length) return false;
          var W = 340, H = 150, T = 52, B = 32, S = 390, UP = '#d93025', DN = '#1a73e8';
          var pc = +d.prev, close = +d.close;
          var lo = Math.min.apply(null, d.c.concat([pc])), hi = Math.max.apply(null, d.c.concat([pc]));
          if (!(hi > lo) || !(pc > 0)) return false;
          function X(m) { return 2 + Math.min(m, S) / S * (W - 4); }
          function Y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
          function f1(n) { return n.toFixed(1); }
          function money(n) { return (+n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
          var pts = d.m.map(function (m, i) { return [X(m), Y(d.c[i])]; });
          var top = pts[0], bot = pts[0];
          pts.forEach(function (p) { if (p[1] < top[1]) top = p; if (p[1] > bot[1]) bot = p; });
          var by = Y(pc), id = 'dc-' + hook;
          var line = pts.map(function (p) { return f1(p[0]) + ',' + f1(p[1]); }).join(' ');
          var area = 'M' + f1(pts[0][0]) + ',' + f1(by) + ' L' + line.split(' ').join(' L') + ' L' + f1(pts[pts.length - 1][0]) + ',' + f1(by) + ' Z';
          var ns = ' vector-effect="non-scaling-stroke"';
          var grid = [1, 2, 3].map(function (k) { return '<line x1="0" x2="' + W + '" y1="' + f1(H * k / 4) + '" y2="' + f1(H * k / 4) + '" stroke="#EEF1F5" stroke-width="1"' + ns + '/>'; }).join('');
          function half(c, clip) {
            return '<g clip-path="url(#' + clip + ')"><path d="' + area + '" fill="url(#g' + clip + ')"/><polyline points="' + line + '" fill="none" stroke="' + c + '" stroke-width="1.8" stroke-linejoin="round"' + ns + '/></g>';
          }
          var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + grid +
            '<defs><clipPath id="' + id + 'u"><rect x="0" y="0" width="' + W + '" height="' + f1(by) + '"/></clipPath>' +
            '<clipPath id="' + id + 'd"><rect x="0" y="' + f1(by) + '" width="' + W + '" height="' + f1(H - by) + '"/></clipPath>' +
            '<linearGradient id="g' + id + 'u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + UP + '" stop-opacity=".22"/><stop offset="1" stop-color="' + UP + '" stop-opacity=".02"/></linearGradient>' +
            '<linearGradient id="g' + id + 'd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + DN + '" stop-opacity=".22"/><stop offset="1" stop-color="' + DN + '" stop-opacity=".02"/></linearGradient></defs>' +
            half(UP, id + 'u') + half(DN, id + 'd') +
            '<line x1="0" x2="' + W + '" y1="' + f1(by) + '" y2="' + f1(by) + '" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3"' + ns + '/>' +
            '<circle cx="' + f1(top[0]) + '" cy="' + f1(top[1]) + '" r="3" fill="#fff" stroke="' + UP + '" stroke-width="1.5"' + ns + '/>' +
            '<circle cx="' + f1(bot[0]) + '" cy="' + f1(bot[1]) + '" r="3" fill="#fff" stroke="' + DN + '" stroke-width="1.5"' + ns + '/></svg>';
          function mark(p, kind, col, val) {
            var x = p[0] / W * 100, y = p[1] / H * 100, hx, tx, ty = kind === '최고' ? 'calc(-100% - 5px)' : '5px';
            if (x < 20) { hx = 'left:10px;'; tx = '0'; }
            else if (x > 80) { hx = 'right:10px;'; tx = '0'; }
            else { hx = 'left:' + f1(x) + '%;'; tx = '-50%'; }
            if (kind === '최고' && x > 50 && p[1] - 23 < 39) { hx = 'right:' + f1(100 - x) + '%;'; tx = '-8px'; ty = '-50%'; }   /* 오른쪽 위 숫자 자리 → 점 왼쪽 옆 */
            return '<span class="day-mark" style="' + hx + 'top:' + f1(y) + '%;transform:translate(' + tx + ',' + ty + ');color:' + col + ';"><span class="k">' + kind + '</span> ' + money(val) + '</span>';
          }
          var ch = close - pc, col = ch > 0 ? UP : ch < 0 ? DN : '#111', tri = ch > 0 ? '▲' : ch < 0 ? '▼' : '';
          var pct = Math.abs(ch / pc * 100).toFixed(2) + '%';
          var old = im.parentNode.querySelector('.day-chart');
          if (old) old.parentNode.removeChild(old);
          var box = document.createElement('div');
          box.className = 'day-chart';
          box.setAttribute('role', 'img');
          box.setAttribute('aria-label', (d.sym === '^KS11' ? '코스피' : 'S&P 500') + ' 하루 그래프: 종가 ' + money(close) + ', 전날보다 ' + pct + (ch < 0 ? ' 하락' : ch > 0 ? ' 상승' : ''));
          box.innerHTML = svg + '<div class="day-head" style="color:' + col + ';"><span class="day-chg">' + tri + pct + '</span><span class="day-num">' + money(close) + '</span></div>' +
            mark(top, '최고', UP, d.h) + mark(bot, '최저', DN, d.l);
          im.hidden = true;
          im.parentNode.insertBefore(box, im);
          return true;
        }
        function fillChartSrc(hook, src, alt) {   /* 카드 재료 JSON 의 chart {src, alt} (H31) */
          var im = document.querySelector('[data-hook="' + hook + '"]');
          if (!im || !src) return;
          im.src = src; im.alt = alt || 'S&P 500 그래프';
          im.hidden = false;
        }

        function failCard(card, msg) {
          Object.keys(card.map).forEach(function (hook) { fillCard(hook, [], msg); });
          if (card.fill) { var bx = document.querySelector('[data-hook="' + card.rows + '"]'); if (bx) { bx.textContent = ''; bx.appendChild(el('div', 'kv-row', msg || LOAD_FAILED)); } }
          if (card.picks) fillPicks(null);
        }

        /* ---- 카드 재료 JSON 먼저 (H31, 2026-11-05 사용자) ----
           gh-pages cards/<파일>.json — 글 게시 직후 experiments/daily-report/home_card.py 가 카드가 쓰는 구획만 써 둔다(2~5KB).
           전에는 방문자마다 라벨 피드 + 글 페이지 HTML(각 600KB)을 받아 몇 줄만 썼다(홈 1회 = Blogger 요청 8건 · 약 2MB).
           JSON 이 없거나(404) 깨졌거나 생성 4일 넘게 오래됐으면(푸시 실패 뒤 옛 파일) 전처럼 피드로 — 피드 경로는 예비로 남긴다.
           구획 HTML 은 DOMParser 로 다시 요소 배열로 만들어 reportSections 결과와 같은 모양 → linesOf · trumpRows · radarRows · fillPicks 는 그대로 */
        var CARD_MAX_AGE = 4 * 86400000;
        function cardJson(card) {
          if (!card.file) return Promise.reject(new Error('no file'));
          return fetch(GH + 'cards/' + card.file + '?v=' + Date.now())
            .then(function (r) { if (!r || !r.ok) throw new Error('http'); return r.json(); })
            .then(function (j) {
              if (!j || !j.url || !j.title || !j.sections) throw new Error('bad json');
              var t = Date.parse(j.generated || '');
              if (!(t > 0) || Date.now() - t > CARD_MAX_AGE) throw new Error('stale');
              var sec = {};
              Object.keys(j.sections).forEach(function (k) {
                var d = new DOMParser().parseFromString('<body>' + j.sections[k], 'text/html');
                sec[k] = [].slice.call(d.body.children);
              });
              return { title: j.title, href: j.url, day: j.date || '', gen: j.generated || '', sec: sec, chart: j.chart || null, intraday: j.intraday || null, body: '' };
            });
        }

        /* 예비 경로(전 방식): 라벨 피드 → 글 본문 → 구획. 피드는 왔는데 글이 없으면 "아직 발행 전" 으로 알리고 null */
        function cardFeed(card) {
          return fetch(feedUrl(card.label))
            .then(function (r) { return r.json(); })
            .then(function (json) {
              var entry = ((json.feed || {}).entry || [])[0];
              if (!entry) { failCard(card, card.empty); return null; }
              return postBody(entry).then(function (body) {   /* 본문 = 피드 content 또는 글 페이지 .post-body (H29) */
                if (!body) throw new Error('no body');
                var title = (entry.title || {}).$t || '';
                var href = '';
                (entry.link || []).forEach(function (l) { if (l.rel === 'alternate' && l.href) href = l.href; });
                return { title: title, href: href, day: dayOf(title, body, (entry.published || {}).$t), sec: reportSections(body), chart: null, body: body };
              });
            });
        }

        /* 날짜 표기 2026.10.9 (점, 앞자리 0 없음 — 디자인-가이드라인 3-3)
           글 제목의 날짜(한국 날짜)를 먼저 — 피드 published 는 블로그 시간대(미국 태평양)라 제목보다 하루 이르게 나왔다 (2026-10-18 사용자: 홈 카드 이상). 제목에 날짜가 없으면 published
           제목에 날짜가 없는 글(주요 인물 발언, 2026-10-21)은 본문 첫 줄의 "M월 D일 기준"을 읽는다 — 발행일(블로그 시간대, 하루 이름)보다 먼저.
           JSON 경로는 home_card.py 가 같은 순서로 정한 date 를 쓴다 */
        function dayOf(title, body, published) {
          var tm = /(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/.exec(title);
          if (!tm) { var bm = /(\d{1,2})월\s*(\d{1,2})일\s*기준/.exec(String(body).replace(/<[^>]+>/g, ' ').slice(0, 1200)); if (bm) tm = [null, String(new Date().getFullYear()), bm[1], bm[2]]; }
          return tm ? [tm[1], String(parseInt(tm[2], 10)), String(parseInt(tm[3], 10))].join('.')
            : String(published || '').slice(0, 10).split('-').map(function (x, i) { return i ? String(parseInt(x, 10)) : x; }).join('.');
        }

        /* 카드 그리기 — p = { title, href, day, sec, chart, body } (JSON 경로 · 피드 경로 공통) */
        function renderCard(card, p) {
          var title = p.title, href = p.href, sec = p.sec, body = p.body;
          setDate(card.id, p.gen ? genKo(p.gen) : dayKo(p.day, card.id === 'kr-report-card' ? '오후' : '아침'));   /* `11월 11일 기준` — 미국 리포트는 종가 날짜(뉴욕), 나머지는 글 날짜 (2026-11-12 사용자: 한글로 통일) */

          /* 카드를 누르면 그 글로 간다 */
          var a = document.getElementById(card.id);
          if (a && href) a.href = href;
          if (a && title) a.title = title;
          /* 카드 제목 줄도 같은 글로 (2026-10-25 사용자: "주요 인물 발언 타이틀 영역 한 줄을 누르면 상세 페이지로") — 홈 리포트 카드 모두 같게 */
          var head = a && a.parentNode && a.parentNode.querySelector('.report-title');
          if (head && href) { head.setAttribute('data-row-link', '1'); head.setAttribute('data-href', href); }

          if (!sec) throw new Error('unparsable');
          if (card.chart && !fillDayChart(card.chart, p.intraday)) { if (p.chart) fillChartSrc(card.chart, p.chart.src, p.chart.alt); else fillChart(card.chart, body); }   /* 하루 그래프 먼저, 없으면 옛 그림 (2026-11-14) */

          if (card.fill) card.fill(sec);
          Object.keys(card.map).forEach(function (hook) {
            var lines = [], used = null;
            if (card.pick && card.pick[hook]) { lines = card.pick[hook](sec); used = card.map[hook][0]; }
            else card.map[hook].forEach(function (k) {
              if (card.any && lines.length) return;
              if (sec[k]) { lines = lines.concat(linesOf(sec[k])); if (lines.length && !used) used = k; }
            });
            fillCard(hook, lines.slice(0, (card.lines && card.lines[hook]) || MAX_LINES));
            /* any 카드가 후순위 구획으로 채워졌으면 배지도 그 구획 이름으로 — "오늘의 해석" 아래 이벤트 목록이 붙지 않게 */
            if (card.any && used && used !== card.map[hook][0]) {
              var block = document.querySelector('.report-block[data-hook="' + hook + '"]');
              var badge = block && block.querySelector('.badge');
              if (badge) badge.textContent = used;
            }
          });

          if (card.picks) {
            fillPicks(sec[PICKS_HEADS[0]] || sec[PICKS_HEADS[1]]);
            var stamp = document.getElementById('briefing-date');   /* 제목 옆 날짜 (2026-10-12 사용자) */
            var tm = /(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/.exec(title);   /* 리포트 기준일은 글 제목의 날짜 (발행일은 다음 날일 수 있다) */
            /* 리포트 제목의 날짜와 같은 표기 "2026년 10월 11일" (2026-10-12 사용자, 줄표는 2026-10-18 삭제) */
            if (stamp && tm) stamp.textContent = tm[1] + '년 ' + parseInt(tm[2], 10) + '월 ' + parseInt(tm[3], 10) + '일';
          }
        }

        function loadCard(card) {
          cardJson(card).then(function (p) { renderCard(card, p); })
            .catch(function () {   /* JSON 없음 · 깨짐 · 오래됨 · 그리기 실패 → 피드 */
              return cardFeed(card).then(function (p) { if (p) renderCard(card, p); });
            })
            .catch(function () { failCard(card); });
        }

        CARDS.forEach(loadCard);

        /* ====================================================== 목록 카드 요약 = 홈 카드 요약 (2026-10-13 사용자: "홈카드 요약글을 재활용")
           블로거 기본 요약(postSnippet)은 본문 앞 약 860자를 통째로 자른 것이라 카드 숫자가 한 덩어리로 이어진다.
           목록 화면의 글들을 피드로 한 번에 받아, 홈 카드와 같은 함수로 글마다 2줄을 뽑아 바꿔 단다. 못 받으면 원래 요약을 2줄로 자른 채 둔다(테마 CSS).
           피드가 "짧게"(2026-11-04 H29)면 content 가 없어 늘 원래 요약 — 목록 글마다 페이지를 받는 것은 무거워 하지 않는다. */
        function summaryLines(labels, sec) {
          if (labels.indexOf('엔비디아') >= 0) {
            var out = [];
            nvdaRows(sec).forEach(function (r) { if (r[0] === '가격') out.push('NVDA ' + r[1]); });
            var issue = linesOf(sec['중요 이슈'] || [])[0];
            if (issue) out.push(issue);
            return out;
          }
          /* 홈 카드의 구획(훅)마다 첫 줄 — 데일리는 요약 · 핵심 인사이트, 트럼프는 발언 · 내일 볼 것 */
          var card = CARDS.filter(function (c) { return labels.indexOf(c.label) >= 0; })[0] || CARDS[0];
          var picked = Object.keys(card.map).map(function (hook) {
            if (card.pick && card.pick[hook]) return card.pick[hook](sec);
            for (var i = 0; i < card.map[hook].length; i++) {
              var k = card.map[hook][i];
              if (sec[k]) { var ls = linesOf(sec[k]); if (ls.length) return ls; }
            }
            return [];
          });
          var out2 = picked.map(function (ls) { return ls[0]; }).filter(Boolean);
          return out2.length >= MAX_LINES ? out2 : out2.concat((picked[0] || []).slice(1));
        }

        (function () {
          var cards = [].slice.call(document.querySelectorAll('.post-grid .post-card'));
          if (!cards.length) return;
          var lm = /\/search\/label\/([^/?#]+)/.exec(location.pathname);
          var q = '?alt=json&max-results=' + (cards.length + 5);
          var um = /[?&]updated-max=([^&]+)/.exec(location.search);
          if (um) q += '&updated-max=' + um[1];
          var url = (lm ? '/feeds/posts/default/-/' + lm[1] : '/feeds/posts/default') + q;
          function pathOf(h) { try { return new URL(h, location.href).pathname; } catch (e) { return h; } }
          fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (json) {
              var byPath = {};
              ((json.feed || {}).entry || []).forEach(function (e) {
                (e.link || []).forEach(function (l) { if (l.rel === 'alternate') byPath[pathOf(l.href)] = e; });
              });
              cards.forEach(function (card) {
                var a = card.querySelector('.post-card-title a'), box = card.querySelector('.post-card-snippet');
                var e = a && box && byPath[pathOf(a.href)];
                if (!e) return;
                var labels = (e.category || []).map(function (c) { return c.term; });
                var sec = reportSections((e.content || {}).$t || '');
                var lines = sec ? summaryLines(labels, sec).slice(0, MAX_LINES) : [];
                if (!lines.length) return;
                var ul = el('ul');
                lines.forEach(function (t) { ul.appendChild(tinted(t)); });
                box.textContent = '';
                box.classList.add('report-columns');
                box.appendChild(ul);
              });
            })
            .catch(function () {});
        })();

          try { if (Date.now() < Number(localStorage.getItem(KEY) || 0)) return; } catch (e) {}
        }

        function quiet(days) { try { localStorage.setItem(KEY, String(Date.now() + days * DAY)); } catch (e) {} }

        var deferred = null;
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
        window.addEventListener('appinstalled', function () { quiet(3650); hide(); });

        var SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="공유"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
        var DOTS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-label="메뉴"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
        var TEXT = {
          ios:     { sub: '아이콘을 누르면 바로 열립니다', btn: '홈 화면에 추가',
                     steps: ['공유 버튼 ' + SHARE + ' 누르기 (안 보이면 ··· 먼저)', '‘홈 화면에 추가’ 누르기'] },
          android: { sub: '아이콘을 누르면 바로 열립니다', btn: '홈 화면에 추가',
                     steps: ['브라우저 메뉴 ' + DOTS + ' 누르기 (삼성 인터넷은 ≡)', '‘홈 화면에 추가’ 또는 ‘앱 설치’ 누르기'] },
          kakao:   { sub: '카카오톡 안에서는 추가할 수 없습니다', btn: '브라우저로 열기', steps: [] },
          inapp:   { sub: '앱 안 브라우저에서는 추가할 수 없습니다', btn: '추가 방법 보기',
                     steps: ['오른쪽 위 메뉴 누르기', '‘다른 브라우저로 열기’ 누르기', '열린 브라우저에서 이 안내를 다시 누르기'] }
        }[mode];

        var box = document.createElement('div');
        box.className = 'a2hs'; box.hidden = true;
        box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', '홈 화면에 추가');
        box.innerHTML =
          '<div class="a2hs-head">' +
            '<img class="a2hs-icon" alt="" width="44" height="44" src="' + ICON + '"/>' +
            '<div class="a2hs-text"><p class="a2hs-title">홈 화면에 AlphaScope 추가</p><p class="a2hs-sub">' + TEXT.sub + '</p></div>' +
            '<button type="button" class="a2hs-close" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
          '</div>' +
          '<button type="button" class="a2hs-btn">' + TEXT.btn + '</button>' +
          '<div class="a2hs-steps" hidden>' + TEXT.steps.map(function (s, i) {
            return '<div class="a2hs-step"><span class="a2hs-num">' + (i + 1) + '</span><span>' + s + '</span></div>';
          }).join('') + '</div>';

        function hide() { box.hidden = true; }
        box.querySelector('.a2hs-close').onclick = function () { quiet(14); hide(); };
        box.querySelector('.a2hs-btn').onclick = function () {
          if (mode === 'kakao') {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href.replace(/[?&]a2hs=\w+/, ''));
            return;
          }
          if (deferred) {
            var d = deferred; deferred = null;
            d.prompt();
            d.userChoice.then(function (r) { if (r.outcome === 'accepted') { quiet(3650); hide(); } });
            return;
          }
          box.querySelector('.a2hs-steps').hidden = false;
          this.hidden = true;
        };

        document.body.appendChild(box);
        setTimeout(function () { box.hidden = false; }, force ? 0 : 2500);
      })();
      /* ================================================================ 터치 장치 (2026-10-19 사용자, 가이드라인 10-9)
         1) 행 · 카드 전체가 그 안의 첫 링크로 간다 — 시총 TOP 10 줄 · 뉴스 · 글 목록 카드 · 본문의 [data-row-link] 줄.
            안쪽의 다른 링크 · 버튼 · 툴팁 · 접기를 누른 것은 그것대로 둔다.
         2) 누르는 순간 눌림 표시(.is-pressed) — 링크 · 버튼 · 탭 · 행 · 카드 모두.
         3) 같은 창에서 다른 페이지로 넘어갈 때 맨 위 진행 막대, 0.4초 넘으면 가운데 돌기. 뒤로 가기로 돌아오면 지운다. 새 창 링크는 눌림 표시만. */
      (function () {
        'use strict';
        var ROWS = '.rank-table tbody tr, .post-card, .news-item:not(.load-status), [data-row-link]';
        var PRESS = ROWS + ', a[href], button, summary, .tab, [data-goto-tab]';   /* 같은 글 안 이동 줄(data-goto-tab — 엔비디아 함께 보기 · 호재 · 리스크 줄)도 눌림 표시 (2026-11-07, 가이드라인 10-9) */
        var INNER = 'a[href], button, summary, details, input, select, label, [data-tip], [role="button"]';

        var bar, veil, veilTimer;
        function startNav() {
          if (!bar) {
            bar = document.createElement('div'); bar.id = 'nav-progress'; document.body.appendChild(bar);
            veil = document.createElement('div'); veil.id = 'nav-veil'; veil.appendChild(document.createElement('span')); document.body.appendChild(veil);
          }
          bar.classList.remove('on'); void bar.offsetWidth; bar.classList.add('on');
          clearTimeout(veilTimer);
          veilTimer = setTimeout(function () { veil.classList.add('on'); }, 400);
        }
        function stopNav() {
          clearTimeout(veilTimer);
          if (bar) { bar.classList.remove('on'); veil.classList.remove('on'); }
          [].slice.call(document.querySelectorAll('.is-pressed')).forEach(function (x) { x.classList.remove('is-pressed'); });
        }
        window.addEventListener('pageshow', stopNav);   /* 뒤로 가기(bfcache)로 돌아왔을 때 막대 · 눌림이 남지 않게 */

        function samePageOrNewTab(a, e) {
          var h = a.getAttribute('href') || '';
          if (!h || h.charAt(0) === '#' || /^(javascript|mailto|tel):/i.test(h)) return true;
          if (a.target && a.target !== '_self') return true;
          if (a.hasAttribute('download') || a.hasAttribute('data-zoom')) return true;   /* 그래프 확대는 팝업 */
          if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button > 0)) return true;
          try { var u = new URL(a.href, location.href); if (u.pathname === location.pathname && u.search === location.search && u.hash) return true; } catch (err) { return true; }
          return false;
        }

        /* 2) 눌림 표시 — 손가락이 닿는 순간. 스크롤하려고 댄 손가락은 움직이면 바로 지운다 */
        var pressed = null, startY = 0, pressTimer;
        function clearPress() { clearTimeout(pressTimer); if (pressed) pressed.classList.remove('is-pressed'); pressed = null; }
        document.addEventListener('pointerdown', function (e) {
          if (e.button > 0) return;
          var t = e.target.closest ? e.target.closest(PRESS) : null;
          if (!t) return;
          var row = t.closest(ROWS);
          if (row && t !== row && !t.closest(INNER)) t = row;   /* 행 안의 글자를 눌러도 행 전체가 눌림 */
          clearPress(); pressed = t; startY = e.clientY; t.classList.add('is-pressed');
        }, { passive: true });
        document.addEventListener('pointermove', function (e) { if (pressed && Math.abs(e.clientY - startY) > 10) clearPress(); }, { passive: true });
        document.addEventListener('pointercancel', clearPress, { passive: true });
        document.addEventListener('pointerup', function () { var p = pressed; pressTimer = setTimeout(function () { if (pressed === p) clearPress(); }, 450); }, { passive: true });   /* 잠깐 남겨 눈에 보이게 */

        /* 1) 행 · 카드 전체 → 그 안의 첫 링크. 3) 같은 창 이동이면 진행 표시 */
        document.addEventListener('click', function (e) {
          if (e.defaultPrevented) return;
          var tgt = e.target;
          var row = tgt.closest ? tgt.closest(ROWS) : null;
          var inner = tgt.closest ? tgt.closest(INNER) : null;
          if (row && (!inner || !row.contains(inner) || inner === row)) {
            var link = row.matches('a[href]') ? row : row.querySelector('a[href]');
            if (!link && row.getAttribute('data-href')) { link = document.createElement('a'); link.href = row.getAttribute('data-href'); }   /* 링크 안의 줄(홈 카드 줄 · 제목) — 주소는 data-href (2026-10-25) */
            if (!link) return;
            e.preventDefault();
            if (link.target === '_blank') { window.open(link.href, '_blank', 'noopener'); return; }
            if (!samePageOrNewTab(link, e)) startNav();
            location.href = link.href;
            return;
          }
          var a = inner && inner.matches('a[href]') ? inner : null;
          if (a && !samePageOrNewTab(a, e)) startNav();
        });
      })();


      /* ============================================================ 하단 고정 메뉴 · 오늘 리포트 링크 (2026-11-12 사용자 여정 테스트 확정, 목업 experiments/mock_server.py /j)
         나라 = 지금 페이지(한국 홈 · 한국 종목 · 한국 시총 목록 · 한국 증시 리포트 = 한국, 미국 쪽 = 미국), 그 밖엔 고른 홈(as-home-mkt). 홈 · 증시 리포트 · 종목 칸이 나라를 따라간다.
         [data-latest] 링크(하단 증시 리포트 · 인물 발언, 서랍 오늘 리포트)는 누를 때만 그 라벨의 최신 글을 블로그 피드에서 찾아 간다 — 못 찾으면 목록 주소 그대로.
         방문자 수와 무관: 피드는 누를 때 한 번뿐이다(페이지를 열 때는 부르지 않는다) */
      (function () {
        'use strict';
        var path = location.pathname, dec = function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } };
        var nl = document.querySelector('.post-nav-list'), lab = '';
        if (nl) lab = dec(((nl.getAttribute('href') || '').split('/search/label/')[1] || '').split('?')[0]);
        if (!lab && path.indexOf('/search/label/') === 0) lab = dec(path.slice(14));
        var LBL = {us: '데일리 브리핑', kr: '한국 증시 리포트'}, PEOPLE = '인물 발언';
        var pref = ''; try { pref = localStorage.getItem('as-home-mkt') || ''; } catch (e) {}
        var isKr = path === '/p/korea.html' || /-\d{6}-stock\.html$/.test(path) || path === '/p/kr-market-cap-top10.html' || lab === LBL.kr;
        var isUs = path === '/' || (/-stock\.html$/.test(path) && !isKr) || path === '/p/us-market-cap-top10.html' || lab === LBL.us;
        var mk = isKr ? 'kr' : isUs ? 'us' : (pref === 'kr' ? 'kr' : 'us');
        var href = {home: mk === 'kr' ? '/p/korea.html' : '/', report: '/search/label/' + encodeURIComponent(LBL[mk]),
                    stock: '/p/' + mk + '-market-cap-top10.html', forecast: '/p/forecast-list.html' + (mk === 'kr' ? '#tab-1' : ''), people: '/search/label/' + encodeURIComponent(PEOPLE)};
        var cur = (path === '/' || path === '/p/korea.html') ? 'home' : (lab === LBL.us || lab === LBL.kr) ? 'report'
                : (/-stock\.html$/.test(path) || /market-cap-top10\.html$/.test(path)) ? 'stock' : /^\/p\/forecast-/.test(path) ? 'forecast' : lab === PEOPLE ? 'people' : '';
        var bar = document.querySelector('.as-tabbar');
        if (bar) [].forEach.call(bar.querySelectorAll('a[data-tab]'), function (a) {
          var k = a.getAttribute('data-tab');
          a.setAttribute('href', href[k]);
          if (k === 'report') a.setAttribute('data-latest', LBL[mk]);
          if (k === 'people') a.setAttribute('data-latest', PEOPLE);
          if (k === cur) { a.classList.add('on'); a.setAttribute('aria-current', 'page'); }
        });
        /* 서랍 — 지금 보는 메뉴 표시 */
        var here = cur === 'report' ? lab : cur === 'people' ? PEOPLE : '';
        [].forEach.call(document.querySelectorAll('.menu-items .menu-row .nav-item, .menu-items .menu-grp .nav-item'), function (a) {
          var h = a.getAttribute('href') || '';
          if ((here && a.getAttribute('data-latest') === here) || (!a.hasAttribute('data-latest') && h === path)) a.classList.add('is-here');
        });
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('a[data-latest]');
          if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault(); e.stopPropagation();
          var fallback = a.href, done = false;
          function go(u) { if (done) return; done = true; location.href = u || fallback; }
          setTimeout(function () { go(fallback); }, 2500);
          fetch('/feeds/posts/summary/-/' + encodeURIComponent(a.getAttribute('data-latest')) + '?alt=json&max-results=1')
            .then(function (r) { return r.json(); })
            .then(function (j) {
              var en = j && j.feed && j.feed.entry && j.feed.entry[0];
              var l = en && (en.link || []).filter(function (x) { return x.rel === 'alternate'; })[0];
              go(l && l.href);
            })
            .catch(function () { go(fallback); });
        }, true);
      })();
