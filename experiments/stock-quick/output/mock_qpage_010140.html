<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>삼성중공업 주가 — 목업</title><style>/*
<Variable name="keycolor" description="Main Color" type="color" default="#FF3333" value="#FF3333"/>
<Group description="Page Text">
  <Variable name="body.text.color" description="Text color" type="color" default="#0F172A" value="#0F172A"/>
</Group>
<Group description="Backgrounds">
  <Variable name="body.background.color" description="Page background" type="color" default="#FFFFFF" value="#FFFFFF"/>
  <Variable name="posts.background.color" description="Card background" type="color" default="#FFFFFF" value="#FFFFFF"/>
</Group>
<Group description="Links">
  <Variable name="body.link.color" description="Link color" type="color" default="#FF3333" value="#FF3333"/>
</Group>
*/

/* ==========================================================================
   AlphaScope — main home
   Figma: alphaflow-main-home (1440 x 2674)
   ========================================================================== */

:root {
  color-scheme: light;

  /* surfaces */
  --bg:            #FFFFFF;   /* 블로그 기본 화면 바탕은 흰색 — 모든 화면 폭 (2026-10-13 사용자) */
  --surface:       #FFFFFF;
  --surface-sub:   #F8FAFC;
  --border:        #F0F0F0;
  --border-strong: #E2E8F0;

  /* ink */
  --ink:      #0F172A;
  --ink-2:    #111827;
  --gray-600: #4B5563;
  --gray-500: #6B7280;
  --gray-400: #94A3B8;
  --gray-350: #9CA3AF;

  /* 한국식 등락 표기: 상승 적색 / 하락 청색 */
  --up:      #E53E3E;
  --up-alt:  #ED3333;
  --down:    #1A73E8;

  --accent:      #FF3333;
  --logo-red:    #DD0000;
  --badge-blue:  #4963CA;
  --badge-green: #10B981;
  --badge-orange: #C2410C;
  --badge-violet: #6D28D9;
  --badge-teal:  #0F766E;

  /* type */
  --sans: 'Noto Sans KR', 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --num:  'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --report-font: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* 리포트 본문 글꼴 (design_kit.WRAP_OPEN) — 홈 · 목록 구획 제목도 이것 (2026-10-13) */

  /* rhythm */
  --gutter:  40px;
  --card-gap: var(--gutter);   /* 홈 카드 사이 = 좌우 여백 (2026-10-24 사용자) */
  --shell:   980px;   /* PC 콘텐츠 폭 980 — 홈 · 목록 · 글 보기 · 헤더 안쪽 모두 (2026-10-15 사용자: 1440 → 1280 → 980) */
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.up   { color: var(--up); }
.down { color: var(--down); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   navbar
   ========================================================================== */

.navbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  height: 86px;
  padding: 0 max(var(--gutter), calc((100% - var(--shell)) / 2));   /* 헤더 안쪽도 콘텐츠와 같은 1280 — 바탕 · 아래 선은 화면 전체 (2026-10-15 사용자) */
  background: var(--surface);
  border-bottom: 1px solid var(--border-strong);
}

.nav-left  { display: flex; align-items: center; gap: 40px; align-self: stretch; min-width: 0; }
.nav-right { display: flex; align-items: center; gap: 20px; flex: none; }

.logo { display: flex; align-items: center; gap: 8px; flex: none; }
.logo-mark { width: 36px; height: 33px; flex: none; display: block; }   /* 로고 313:286 (2026-10-13 사용자 새 로고). 36 → 32.4 → 34 → 36 (5% 키움 35.7 → 정수, 2026-11-10 사용자) */
.logo-word {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  font-size: 22px;   /* 24 → 19.2 → 21 → 22 (5% 키움 22.05 → 정수, 2026-11-10 사용자) */
  line-height: 30px;
  letter-spacing: -0.2px;
  color: #000;
  white-space: nowrap;
}

.menu-items { display: flex; align-items: stretch; gap: 12px; align-self: stretch; min-width: 0; }

.nav-item {
  -webkit-tap-highlight-color: transparent;   /* 폰에서 누를 때 회색 덮임 없음 (2026-10-13 사용자) */
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px 12px;
  font-weight: 700;
  font-size: 19px;
  line-height: 26px;
  color: #000;
  white-space: nowrap;
  transition: color .15s ease;
}
.nav-item:hover { color: var(--accent); }
.nav-item[aria-current="page"] { color: var(--accent); }
.nav-item[aria-current="page"]::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: var(--accent);
  border-radius: 3px 3px 0 0;
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 264px;
  height: 41px;
  padding: 8px 14px;
  background: var(--surface-sub);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
}
.search-bar svg { width: 14px; height: 14px; flex: none; color: var(--gray-400); }
/* 헤더 안쪽 980 에 로고 · 메뉴 · 검색창이 다 들어가도록 검색창은 남는 폭만큼 (264 → 최소 150) — 검색창이 보이는 PC 폭에서만 (2026-10-15 사용자: PC 980) */
@media (min-width: 1181px) {
  .nav-left { flex: none; }   /* 메뉴는 줄지 않고 검색창이 준다 — 메뉴가 검색창 위로 겹치던 원인 */
  .nav-right { flex: 0 1 auto; min-width: 0; }
  .nav-right > .search-holder, .nav-right > .search-bar { flex: 0 1 264px; min-width: 150px; }
  .search-bar { width: 100%; }
}
.search-bar input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  padding: 0;
  background: none;
  font-family: inherit;
  font-size: 16px;
  line-height: 22px;
  color: var(--ink);
}
.search-bar input::placeholder { color: var(--gray-400); }

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; flex: none;
  color: var(--gray-500);
}
/* 모바일 검색 아이콘 (로고 오른쪽). 데스크톱은 검색창을 그대로 쓰므로 숨긴다 (2026-10-10) */
.search-toggle {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px; flex: none;
  border: 1px solid var(--border-strong); border-radius: 8px;
  color: var(--gray-600);
}
.search-toggle svg { width: 16px; height: 16px; }
.search-toggle[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.icon-btn svg { width: 19px; height: 19px; display: block; }

.avatar {
  width: 36px; height: 36px; flex: none;
  border-radius: 50%;
  background: linear-gradient(140deg, #7C93C8 0%, #46557A 60%, #2B3350 100%);
  box-shadow: inset 0 0 0 1px rgba(15,23,42,.08);
}

.nav-toggle { display: none; }
.menu-quick { display: none; }   /* 폰 · 태블릿에서만 (아래 900px 규칙) */
/* 서랍 메뉴의 닫기 버튼·뒤 가림막 — JS가 만든다. 데스크톱에서는 쓰지 않는다 */
.nav-close {
  display: none; position: absolute; top: 18px; right: 18px;
  width: 32px; height: 32px; align-items: center; justify-content: center; padding: 0;
  border: 1px solid #E2E8F0; border-radius: 8px; background: #fff; color: #111;
}
.nav-close:hover { border-color: #111; }
.nav-close svg { width: 14px; height: 14px; }   /* 서랍 닫기도 테두리 네모 32 (닫기 버튼 통일, 2026-11-14 사용자). 옛 36 — 가운데 자리는 그대로(16 + 18) */
.nav-overlay { position: fixed; inset: 0; z-index: 49; background: transparent; }   /* 헤더(50) 아래 — 서랍은 헤더 안에 있어 55로 두면 가림막이 서랍을 덮어 메뉴가 눌리지 않았다 (2026-10-13 사용자: "메뉴를 클릭시 목록 화면으로 이동되지 않는다")   /* 가림막은 바깥 누르기용 — 어둡게 하지 않는다 (2026-10-13 사용자: "왜 딤 효과") */
.nav-overlay[hidden] { display: none; }
body.menu-open { overflow: hidden; }
/* 미국 ⇄ 한국 스위치 (2026-11-10 사용자: "스위치로. 홈은 미국이니 미국일 때는 한국 국기") — 지금 화면이 아닌 쪽 국기 + 이름 하나 */
.nav-switch { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 7px 12px 7px 8px; border: 1px solid var(--border-strong); border-radius: 999px; background: #fff; color: #111; font-size: 14px; font-weight: 700; line-height: 20px; white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: border-color .15s ease, background-color .15s ease; }
.nav-switch:hover { border-color: #94A3B8; background: #F8FAFC; }
/* 높이 36 = 메뉴 아이콘 테두리 36 과 같게 (국기 23 + 위아래 5.5 + 테두리 1). 국기 26 → 23 으로 10% 줄임(2026-11-11 사용자) */
.nav-switch svg { width: 18px; height: 18px; flex: none; display: block; border-radius: 50%; }   /* 국기 23 → 18 (20%) · 글자 15/22 → 14/20 · 위아래 안쪽 5.5 → 7 · 왼쪽 8 = 스위치 높이 36 그대로 (2026-11-11 사용자) */
/* 바로 보이는 메뉴 · 서랍 메뉴 나누기 (2026-11-10 사용자: "미국, 한국만 메뉴, 증시 전망은 메뉴 아이콘 안으로").
   서랍 메뉴 링크 가운데 data-bar 가 붙은 것만 로고 오른쪽 줄에 복사하고 body.has-bar 를 붙인다(JS). 그때는 PC 에서도 메뉴 아이콘 · 서랍을 쓴다.
   data-bar 가 하나도 없으면(지금 테마) 예전 그대로: PC 는 메뉴 전부 줄로, 폰은 전부 복사 */
@media (min-width: 901px) {
  body.has-bar .menu-quick { display: flex; align-items: center; gap: 12px; align-self: stretch; }
  body.has-bar .nav-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex: none;
    border: 1px solid var(--border-strong); border-radius: 8px; color: var(--gray-600);
  }
  body.has-bar .menu-items {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: 320px; flex-direction: column; align-items: stretch; gap: 0;
    padding: 72px 0 24px; background: var(--surface);
    box-shadow: -8px 0 30px rgba(15,23,42,.18);
    transform: translateX(100%); transition: transform .22s ease; overflow-y: auto;
  }
  body.has-bar .menu-items.is-open { transform: none; }
  body.has-bar .menu-items .nav-item { padding: 14px 24px; font-size: 18px; line-height: 28px; border-bottom: 1px solid var(--border); }
  body.has-bar .menu-items .nav-item[aria-current="page"]::after { display: none; }
  body.has-bar .nav-close { display: flex; }
}

/* ==========================================================================
   shell
   ========================================================================== */

.header-bar { height: 28px; padding: 10px var(--gutter) 0; }

.main-content {
  display: flex;
  flex-direction: column;
  gap: 27px;
  max-width: calc(var(--shell) + var(--gutter) * 2);   /* 좌우 여백을 빼고 콘텐츠가 정확히 --shell (2026-10-15 사용자: PC 콘텐츠 1280) */
  margin: 0 auto;
  padding: 36px var(--gutter) 40px;   /* 위: 헤더 → 홈 제목 글자 보이는 35 (20 + 15, 2026-10-13 사용자) · 아래: 마지막 콘텐츠 아래 40 */
}

/* section heading */
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  font-weight: 700;
  font-size: 22px;   /* 공식 구획 제목 크기 22 (폰 20) — 2026-10-13 사용자: +1. 처음 21 (폰 19) — 미국 증시 리포트 구획 제목과 같게 (2026-10-13 사용자, 가이드 3-1) */
  line-height: 28px;
  font-family: var(--report-font);   /* 리포트 구획 제목과 같은 글꼴 · 자간 0 — Noto Sans KR · 자간 −0.3 이라 같은 21px 이 더 커 보였다 (2026-10-13 사용자, 가이드 10-6) */
  letter-spacing: 0;
  color: var(--ink);
  white-space: nowrap;
}
.section-title > svg { display: none; }
/* 홈 구획 제목 앞 아이콘 — 리포트 제목 아이콘과 같은 24px 색 네모 + 흰 글자 16px, 글자와 8px (2026-10-14 사용자: "홈 화면에서 각 타이틀 앞에 아이콘") */
.section-title:has(.report-icon) { gap: 8px; }
.section-title .report-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; border-radius: 6px; color: #fff; }
.section-title .report-icon svg { width: 16px; height: 16px; display: block; }
.section-note { margin-right: 8px; font-size: 14px; line-height: 22px; color: var(--gray-500); }   /* 오른쪽 안내 글은 오른쪽 끝에서 8px 들여쓰기 (2026-10-14 사용자) */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
}

/* ==========================================================================
   1. AI daily briefing
   ========================================================================== */

.briefing { display: flex; flex-direction: column; gap: 20px; }   /* 홈 제목 줄 ↔ 리포트 제목 20 (2026-10-13) */

.briefing-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.briefing-head-left { display: flex; align-items: center; gap: 24px; min-width: 0; flex-wrap: wrap; }
/* 제목 옆 날짜 — 데일리 리포트 기준일 `2026.10.11`, 16px 보통 굵기 (2026-10-12 사용자: "미국 증시 데일리 브리핑 옆에 2026.10.11, 날짜는 16포인트").
   안내 문장(핵심만 추렸습니다 …)과 따로 있던 "… 리포트 기준" 줄은 삭제 (2026-10-12 사용자) */
.briefing-date { font-size: 16px; font-weight: 400; line-height: 30px; letter-spacing: 0; color: var(--gray-500); white-space: nowrap; }   /* "2026년 10월 11일" — 리포트 제목의 날짜와 같은 표기 (2026-10-12 사용자). 앞 줄표는 뺐다 (2026-10-18 사용자: 줄표 금지) */


/* 오늘의 급등주는 홈에서 삭제 (2026-10-12 사용자) — 리포트 카드 셋만 */
.briefing-body { display: flex; align-items: stretch; gap: 20px; }
/* 미국 증시 리포트 · 트럼프 SNS 트렌드 · 인물 발언 — 두 칸 + 셋째(인물 발언)는 전폭 (2026-10-20 엔비디아 카드 삭제 · 인물 발언 추가) */
.briefing-main {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));   /* PC 폭 980 에서는 2열 + 셋째(트럼프) 전폭 — 3개 한 줄은 카드가 310 이라 제목 · 가격 줄이 넘쳤다 (2026-10-15 사용자) */
  gap: 35px 20px;   /* 카드가 위아래로 쌓일 때 엔비디아 · 트럼프 제목 위 +15 (20 → 35, 2026-10-14 사용자) — 나란할 때는 영향 없음 */
  flex: 1;
  min-width: 0;
}
/* 카드 넷(미국 · 한국 · 트럼프 · 인물)은 2 × 2 — 셋일 때의 "셋째 전폭" 규칙은 뺐다 (10-23 넷이 된 뒤). 미디어 데일리 카드는 10-30 뺌(H26) */

/* 리포트 이름은 카드 밖 제목(21px 굵게 · 행간 27 = 구획 제목 글자) + 앞에 컬러 아이콘 (2026-10-13 사용자) */
.report-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.report-title { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--report-font); font-weight: 700; font-size: 22px; line-height: 28px; letter-spacing: 0; color: #111; }
.report-title .report-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; border-radius: 6px; color: #fff; }
.report-title .report-icon svg { width: 16px; height: 16px; }
.report-title .report-icon img { width: 24px; height: 24px; border-radius: 6px; display: block; background: #F1F5F9; }
/* 카드 전체가 그 리포트 글로 가는 링크다. 구획(요약 / 핵심 인사이트 등)은 안에서 나눈다. */
/* 카드 = .report-col (제목 + 날짜 + 구분선 + 본문 링크). 외곽선 · 그림자는 아래 '홈 카드' 블록 (2026-10-15 사용자) */
.report-card {
  display: flex;
  flex-direction: column;
  gap: 18px;
  flex: 1;
  min-width: 0;
  padding: 16px;
  color: inherit;
}
/* 카드 머리: 어느 연재인지와 그 글의 날짜. 날짜는 피드에서 채운다. */
.report-card-date { margin-left: auto; margin-right: 8px; font-family: var(--num); font-size: 14px; font-weight: 400; line-height: 20px; color: #7A7A7A; white-space: nowrap; }   /* 발행 날짜 — 리포트 제목 줄 오른쪽 (2026-10-13 사용자) */
.report-block { display: flex; flex-direction: column; gap: 8px; }
.report-chart { display: block; width: 100%; height: auto; border: 1px solid #eee; border-radius: 8px; }   /* 홈 미국 · 한국 증시 카드 그래프 (2026-10-21 사용자). 확대 없음 — 눌러도 카드처럼 상세 리포트로 (2026-11-10 사용자) */
.report-chart[hidden] { display: none; }
.day-chart { position: relative; border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff; }   /* 홈 증시 카드 하루 그래프 (2026-11-14 사용자, B1) — 글자 = HTML, 크기 고정 */
.day-chart svg { display: block; width: 100%; height: auto; }
.day-head { position: absolute; right: 10px; top: 13px; display: flex; align-items: baseline; gap: 0 8px; font-family: var(--num); font-variant-numeric: tabular-nums; }

/* 홈 증시 전망 카드 (2026-11-08 H34) — 줄 = 전망 질문(18 · 행간 34 · 보통 굵기, 인물 발언 줄과 같게) + 분류 라벨 · 게시일. 국면 · 문장은 전망 페이지에서. 자료 = gh-pages hypo.json (forecast_daily, 하루 1회) */

#radar-card .kv-row.plain-row { display: flex; align-items: flex-start; justify-content: flex-start; gap: 7px; padding: 4px 0; border-top: 0; font-size: 18px; line-height: 34px; font-weight: 400; color: #111; word-break: keep-all; }

.nt-row[hidden] { display: none; }

/* 미국 · 한국 화면 나누기 (2026-11-10 사용자, 홈 수정 H35) — body[data-home-mkt="us"|"kr"] 일 때만. 속성이 없으면 지금 홈(두 시장 함께) 그대로.
   카드 넷 = 그 시장 리포트 · 인물 발언 · 증시 전망 · 주목할 종목(그 시장 칸만) → 2×2. 시장 탭은 숨기고 그 시장으로 고정 */

.kv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 19px 0; border-top: 1px solid #E2E8F0; }

.badge {   /* 배경색이 있는 가이드 라벨(5절 긍정 · 부정 · 정상) — 14px, 볼드 없음 (2026-10-13 사용자) */

/* 실시간 주요 뉴스 — 증시 리포트 뉴스와 같은 구성 (2026-10-14 사용자: "홈 실시간 주요 뉴스도 증시 리포트 뉴스 구성 배치, 기사 제목 볼드").
   카드 없이 기사 사이 1px 가로 구분선(위아래 보이는 27), 제목 19px 굵게 · 행간 34(원문 링크), 아래 14px 보조 줄(출처 · 시각), 맨 아래 라벨 줄(여백 없이 왼쪽, 위 8). 한 열 — design_kit.item_rules() */
.news-list { display: flex; flex-direction: column; }
.news-item { margin: 0; padding: 18px 0 19px; border-top: 1px solid #E2E8F0; font-size: 17px; line-height: 31px; color: #111; word-break: keep-all; }   /* 종목 페이지 뉴스(design_kit.news_item · item_rules)와 같은 폼 — 위 19(선 1 + 18) · 아래 19 (2026-11-07 사용자: 홈 뉴스와 개별 페이지 뉴스 폼 통일, 옛 18/34 · 20 25) */
.news-item:first-child { padding-top: 2px; border-top: 0; }
.news-item a { display: block; color: #111; font-weight: 700; font-size: 17px; line-height: 31px; }   /* 제목 17/31 블록 = 종목 페이지. 마우스 강조색은 뺐다(종목 페이지에 없음) */
.news-tag {   /* 영역 라벨 (가이드 5절): 회색 외곽선 · 흰 바탕 · 14px, 줄에 홀로 놓여 여백 없음 */
  display: inline-block; padding: 3px 5px 2px;
  border: 1px solid #CBD5E1; border-radius: 4px; background: #fff;
  font-size: 14px; font-weight: 400; line-height: 1; color: #334155; white-space: nowrap;
}
.news-labels { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 2px; margin: 8px 0 1px; line-height: 1; }   /* 라벨끼리 2 · 라벨 ~ 메타 10 = 종목 페이지 (2026-11-07) */   /* 라벨 뒤에 출처 · 시각 (2026-10-14 사용자) */
.news-sub { margin-left: 8px; font-size: 14px; line-height: 20px; color: #7A7A7A; }
.news-sum { display: block; margin-top: 4px; font-size: 16px; line-height: 26px; font-weight: 400; color: #333; word-break: keep-all; }   /* 기사 소개 (2026-10-19 사용자) — 제목 아래, 선정 이유 위 */
.news-why { display: block; margin-top: 2px; font-size: 14px; line-height: 20px; color: #7A7A7A; word-break: keep-all; }   /* 선정 이유 (2026-10-14 사용자) — 제목은 18px(19 − 1) */
.news-sub .num { margin-left: 6px; }
.news-item.load-status { color: var(--gray-400); }
.news-item[hidden] { display: none; }
/* 뉴스 더 보기 = 외곽선 있는 버튼(기본 .fold-btn), 버튼 위 구분선 없음 (2026-10-24 사용자). 옛: 윗선만 있는 줄 (2026-10-20) */
.news-section .fold-btn { margin-top: 6px; }

/* ==========================================================================
   6. footer  (위 주요 뉴스 흐르는 띠는 삭제 — 2026-11-10 사용자)
   ========================================================================== */

.site-footer {
  padding: 18px var(--gutter) 19px;   /* 위 36 → 18 · 아래 38 → 19 (각 50%, 2026-11-11 사용자) — 옛 아래 48 → 38 (11-10) */
  text-align: center;
  background: var(--bg);
}
.footer-title {
  display: flex;   /* 제목 · 접기 버튼을 세로 가운데로 (2026-11-10 사용자, 옛 block + 버튼 vertical-align −3) */
  align-items: center;
  justify-content: center;
  text-align: center;   /* 제목은 가운데 · 그 오른쪽에 접기 버튼 (2026-10-25 사용자, 홈 수정 H19) */
  margin: 0 0 9px;   /* 제목 아래 14 → 11 → 9 (20%씩 두 번, 2026-11-11 사용자) */
  font-weight: 700;
  font-size: 14px;   /* 17 (PC 16) → 14 어디서나 (2026-11-10 사용자) — 아래 설명 13 보다 한 단계 위 */
  line-height: 20px;   /* 홀짝 14/20 */
  color: #6B7280;   /* 회색 = 글자 세 톤 셋째 (2026-11-11 사용자) — 옛 var(--ink-2) */
}
.footer-disclaimer {
  max-width: 880px;
  text-align: left;   /* 설명글만 좌측 정렬 — 제목 · 저작권 줄은 가운데 (2026-10-25 사용자, 홈 수정 H14) */
  margin: 0 auto 11px;   /* 저작권 줄 위 16 → 11 (30%, 2026-11-11 사용자) */
  font-size: 13px;
  line-height: 1.8;
  color: var(--gray-350);
}
.footer-disclaimer summary { list-style: none; cursor: pointer; }   /* 제목 + 첫 문장 — 눌러서 나머지 (2026-10-24 사용자 · 10-25 버튼을 제목 오른쪽으로) */
.footer-lead { display: block; }
.footer-disclaimer summary::-webkit-details-marker { display: none; }
.footer-more { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: 8px; flex: none; border: 1px solid #E2E8F0; border-radius: 6px; background: #fff; color: #111; box-sizing: border-box; }   /* 외곽선 있는 화살표 버튼 = 다른 더 보기 버튼(.fold-btn)과 같은 테두리 · 바탕 (2026-10-24 사용자) */
.footer-more svg { width: 12px; height: 12px; }
.footer-more svg { transition: transform .15s; }
.footer-disclaimer[open] .footer-more svg { transform: rotate(180deg); }
.footer-disclaimer > p { margin: 4px 0 0; }
/* 상세 화면(글 · 고정 페이지) = 작은 푸터 (2026-11-12 사용자 "푸터는 홈에만?" → Claude 안: 면책은 투자 정보를 보는 화면에 있어야 한다) —
   제목 `ALPHASCOPE 주식 리포트` 는 빼고, 면책 첫 문장(접지 않음) 한 줄 + 오른쪽 더 보기 버튼(AI 고지 · 외부 의견 안내는 접힌 채) + 저작권 줄. 홈 · 목록은 그대로 */
body.item-view .footer-name { display: none; }
body.item-view .footer-disclaimer summary { display: flex; align-items: flex-start; gap: 8px; }
body.item-view .footer-title { order: 2; flex: none; margin: 0; }
body.item-view .footer-more { margin-left: 0; }
body.item-view .footer-lead { flex: 1 1 auto; min-width: 0; }
.footer-copy {
  margin: 0;
  font-family: var(--num);
  font-size: 13px;   /* 가장 작은 글씨 13/19 (2026-11-11 사용자) */
  line-height: 19px;
  color: var(--gray-400);
}

/* ==========================================================================
   홈 카드 (2026-10-15 사용자) — 회색 바탕 #F3F4F6 위 흰 카드,
   옅은 외곽선 #f3f4f6 + 부드러운 그림자, 올리면 외곽선 gray-300.
   제목(아이콘) · 오른쪽 날짜 · 안내 글은 카드 안 맨 위, 아래 구분선으로 본문과 나눈다.
   ========================================================================== */
.home-cards {
  display: flex;
  flex-direction: column;
  gap: var(--card-gap);   /* 카드 사이 = 화면 좌우 여백 (2026-10-24 사용자: PC 40 · 중간 24 · 폰 10). 옛 20 (2026-10-15) */
  margin-top: -36px;   /* main-content 위 여백까지 회색으로 — 헤더 바로 아래부터 */
  padding: var(--card-gap) 0 40px;   /* 맨 위 카드 위 = 카드 사이 (2026-10-15 사용자) */
  background: #F3F4F6;
  box-shadow: 0 0 0 100vmax #F3F4F6;   /* 화면 전체 폭으로 — 가로 스크롤 없이 */
  clip-path: inset(0 -100vmax);
}
/* 일정 배너 (2026-10-29 사용자 시안) — 헤더 바로 아래 화면 전폭 띠. 한 장씩 옆으로 넘어가고(4초) 가운데 아래 점으로 고른다.
   글자는 카드 열에 맞추고 바탕만 box-shadow 로 화면 끝까지 (회색 구역과 같은 방식).
   바탕은 장마다 짙은 색을 돌려 쓴다 (2026-10-29 사용자: "전부 남색이면 단조롭다") — JS 가 --eb-bg 를 바꾸고 여기서 서서히 바뀐다 */
.event-banner { --eb-bg: #1E3A8A; position: relative; overflow: hidden; margin-top: calc(-1 * var(--card-gap)); background: var(--eb-bg); color: #fff;
  box-shadow: 0 0 0 100vmax var(--eb-bg); clip-path: inset(0 -100vmax); transition: background-color .45s ease, box-shadow .45s ease; }
.event-banner[hidden] { display: none; }
.eb-viewport { overflow: hidden; touch-action: pan-y; }   /* 옆으로 미는 손짓은 JS 가 받는다 (2026-11-10 사용자: 손으로 넘기기) */
.eb-track { display: flex; transition: transform .45s ease; }
.eb-track.is-drag { transition: none; }
.eb-slide { flex: 0 0 100%; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 28px 8px 36px;   /* 높이 102 → 122 (20%, 2026-11-10 사용자) */ color: inherit; text-decoration: none; }
.eb-slide .stock-avatar { flex: none; width: 44px; height: 44px; font-size: 16px; }
/* 짙은 바탕에서는 로고 뒤 밝은 원이 가장자리로 새어 나와 테두리가 깨져 보인다 (2026-10-29 사용자) — 로고가 뜨면 뒤 원을 지운다 */
.eb-slide .stock-avatar.has-logo { background: transparent !important; }
.eb-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eb-kicker { display: flex; align-items: center; gap: 10px; min-width: 0; }
.eb-name { font-size: 22px; font-weight: 800; line-height: 30px; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eb-dday { flex: none; padding: 0 7px; border-radius: 5px; background: #F43F5E; color: #fff; font-family: var(--num); font-size: 13px; font-weight: 700; line-height: 22px; white-space: nowrap; }
.eb-dday.is-ahead { background: #F97316; }   /* D-숫자는 전부 주황, D-DAY 만 빨강 (2026-10-29 사용자) */
.eb-title-line { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.eb-title { flex: none; font-size: 18px; font-weight: 700; line-height: 26px; }
.eb-when { min-width: 0; font-size: 15px; line-height: 23px; color: rgba(255, 255, 255, .78); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eb-slide:hover .eb-name { text-decoration: underline; text-underline-offset: 5px; }
.eb-more { margin-left: auto; flex: none; display: flex; align-items: center; gap: 14px; margin-right: 8px; color: rgba(255, 255, 255, .7); font-size: 15px; white-space: nowrap; }
.eb-dots { position: absolute; left: 0; right: 6px; bottom: 9px; display: flex; justify-content: flex-end; gap: 2px; }   /* 점은 오른쪽 정렬 (2026-11-10 사용자) — 점 버튼 안쪽 2 + 6 = 글자 기준선 8 */
.eb-dots[hidden] { display: none; }
.eb-dot { height: 12px; padding: 0 2px; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.eb-dot::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .35); transition: background .25s; }   /* 점 5×5 (2026-11-10 사용자) */
.eb-dot[aria-selected="true"]::before { background: #fff; }   /* 바탕색이 바뀌므로 파랑 대신 흰색 */
@media (max-width: 680px) {
  .eb-slide { gap: 10px; padding: 20px 4px 28px; }   /* 높이 81 → 97 (20%, 2026-11-10 사용자) */
  .eb-slide .stock-avatar { width: 36px; height: 36px; font-size: 14px; }
  .eb-name { font-size: 17px; line-height: 24px; }
  .eb-dday { font-size: 12px; line-height: 19px; padding: 0 6px; }
  .eb-title-line { gap: 8px; }
  .eb-title { font-size: 15px; line-height: 23px; }
  .eb-when { font-size: 13px; line-height: 21px; }
  .eb-more { margin-right: 4px; }
  .eb-more-text { display: none; }   /* 폰은 글자도 없음 — 화살표는 삭제 (2026-11-10 사용자) */
}
@media (prefers-reduced-motion: reduce) { .eb-track, .eb-dot::before { transition: none; } }
.home-cards .report-col,
.home-cards .index-section,
.home-cards .rankings,
.home-cards .sector-section {
  gap: 0;
  margin-top: 0;   /* 구획 제목 위 +15 는 제목이 카드 밖일 때 것 */
  padding: 16px 10px;   /* 카드 안쪽 여백 상하 16 · 좌우 10 (2026-10-15 사용자) */
  background: var(--surface);
  border: 1px solid #f3f4f6;
  border-radius: 12px;
  box-shadow: 0 10px 22.5px -5px rgba(0, 0, 0, .029), 0 8px 9px -6px rgba(0, 0, 0, .029);   /* 그림자 20% 옅게 (.04 → .032) → 퍼짐 · 진하기 각 10% 더 (25 → 22.5 · 10 → 9, .032 → .029) (2026-10-15 사용자) */
}
/* 카드 머리 — 제목 줄 + 구분선.
   카드 안 구분선은 모두 엔비디아 카드 '가격' 아래 선과 같은 폭 — 카드 안쪽에서 좌우 16 더 들어간다 (2026-10-15 사용자) */
.home-cards .report-title,
.home-cards .section-head {
  align-items: center;
  margin: 0 16px;
  padding: 14px 0 13px;
  border-bottom: 1px solid #E5E7EB;
}
#us-report-col > .report-title, #kr-report-col > .report-title { border-bottom: 0; padding-bottom: 0; }   /* 미국 · 한국 증시 카드 = 제목 아래 구분선 없이 바로 그래프, 구분선 자리(아래 13)만큼 그래프를 올림 (2026-11-11 사용자) */
.home-cards .index-card,
.home-cards .rank-card,
.home-cards .sector-card { margin: 0 16px; }
.home-cards .index-rowline { padding-left: 0; padding-right: 0; }
.home-cards .rank-card .tabs { padding-left: 0; padding-right: 0; }
.home-cards .rank-table th:first-child, .home-cards .rank-table td:first-child { padding-left: 0; }
.home-cards .rank-table th:last-child, .home-cards .rank-table td:last-child { padding-right: 0; }
.home-cards .sector-card .sector-table { margin: 0; width: 100%; }
.home-cards .rank-table td.col-rank { text-align: right !important; width: 20px; padding-left: 2px; padding-right: 0; }   /* 순위 번호 우측 정렬 + 왼쪽 여유 2 (2026-10-25 사용자: 구분선에 딱 붙어 어색 — 이전 좌측 정렬 H13 번복) (2026-10-25 사용자, 홈 수정 H13). 칸 폭 = 두 자리 기준 고정 → 로고가 줄마다 같은 세로선 */
.home-cards .rank-table td.col-rank + td.col-name { padding-left: 14px; }   /* 순위 숫자 ~ 로고 간격 29 → 14 (50%, 2026-10-25 사용자, 홈 수정 H6) — 숫자는 오른쪽 맞춤이라 두 자리도 같은 간격 */
.home-cards #sector-top-body td.has-sub { padding-top: 15px; padding-bottom: 15px; }   /* 작은 줄(2 · 3위)이 있는 줄도 작은 줄 없는 줄과 같은 위아래 여백 15 — 작은 줄만큼 줄이 길어진다 (2026-10-25 사용자) */
.home-cards .theme-list { margin: 0; }   /* 시장 흐름 줄도 탭 · 표와 같은 왼쪽 기준선 (2026-10-25 사용자: "시장 흐름 내용의 세로 기준선이 다른 탭과 안 맞는다") — 옛 좌우 16 */
.home-cards .seg-row:not(.mkt-tabs) { padding-left: 0; padding-right: 0; }   /* 테마 종목 묶음 알약도 같은 기준선 (2026-10-25) */
/* 테마 종목 묶음 탭 = 하나로 이은 둥근 박스, 메뉴 사이는 세로 구분선만 (2026-10-25 사용자, 홈 수정 H10). 선택: 글자 굵은 검정 + 진한 외곽선 */
/* 가로로 밀면 박스(테두리 · 둥근 모서리)째 움직이게 — 테두리를 스크롤 상자가 아니라 버튼들이 나눠 가진다 (2026-11-07 사용자 P333, 옛: 상자 테두리가 제자리에 남았다) */
.home-cards #watch-tabs { gap: 0; padding: 0; margin: 12px 0 4px; border: 0; border-radius: 0; background: none; }
.home-cards #watch-tabs .seg { flex: 1 0 auto; padding: 6px 14px; border: 1px solid #E2E8F0; border-radius: 0; background: #fff; color: var(--gray-600); font-weight: 400; text-align: center; }
.home-cards #watch-tabs .seg + .seg { border-left: 0; }
.home-cards #watch-tabs .seg:first-child { border-radius: 7px 0 0 7px; }   /* 모서리는 바깥 네 귀퉁이만 둥글고 안쪽은 직선 (2026-10-25 사용자) */
.home-cards #watch-tabs .seg:last-child { border-radius: 0 7px 7px 0; }
.home-cards #watch-tabs .seg:only-child { border-radius: 7px; }
.home-cards #watch-tabs .seg[aria-selected="true"] { background: #fff; color: #111; font-weight: 700; box-shadow: inset 0 0 0 1px #111; }   /* 선택 외곽선 2 → 1px, 높이 −4 (패딩 8 → 6) */
.home-cards .report-card-date,
.home-cards .section-note { margin-right: 0; }
/* 안쪽 카드는 테두리 · 모서리를 겉 카드에 맡긴다 */
.home-cards .index-card,
.home-cards .rank-card,
.home-cards .sector-card { border: 0; border-radius: 0; background: transparent; }
.home-cards .index-card .fold-btn,
.home-cards .rank-card .fold-btn,
.home-cards .sector-card .fold-btn { border-radius: 0; padding-top: 13px; }   /* 더 보기 위 +5 (2026-10-15 사용자) */
.home-cards .briefing, .home-cards .briefing-body, .home-cards .briefing-main { gap: var(--card-gap); }   /* 리포트 카드 묶음 안쪽도 카드 사이 = 좌우 여백 (2026-10-24 사용자). 옛 20 */
/* 미국 증시 리포트 카드 내용은 글머리표 없이 (2026-10-15 사용자) */
#report-card .report-columns li, #kr-report-card .report-columns li { gap: 0; }
#report-card .report-columns li::before, #kr-report-card .report-columns li::before { content: none; }   /* 한국 증시 카드도 같게 (H24) */
/* 첫 탭(거래상위)은 왼쪽 여백 없이 구분선 시작점에서 (2026-10-15 사용자) */
.home-cards .rank-card .tab:first-child { padding-left: 0; }   /* 제목이 카드 안으로 들어가 쌓일 때 위 여백 +15 는 필요 없음 */
/* 카드 순서: 리포트 → 시총 TOP 10 (주요 지수 · 섹터 현황은 2026-10-20 삭제). PC(901px 이상)는 2열 — 리포트 · 랭킹은 전폭 (2026-10-15 사용자) */
@media (min-width: 901px) {
  .home-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .home-cards > .briefing, .home-cards > .rankings, .home-cards > .event-banner { grid-column: 1 / -1; }   /* 일정 배너도 전폭 (2026-10-28) */
}
/* 테마 · 관심 종목 · 섹터 종목 탭 카드 (2026-10-21 사용자) — 탭 줄 오른쪽 끝 기준일, 관심 종목 묶음은 탭 아래 작은 알약 줄 */
.picks-section .tabs { align-items: flex-end; }
.picks-day { padding: 8px 16px 0; font-family: var(--num); font-size: 14px; line-height: 20px; color: var(--gray-400); text-align: right; }   /* 기준일 — 탭 아래 오른쪽 한 줄 (탭 줄에 두면 폰에서 잘린다) */
.picks-day:empty { display: none; }
.pick-panel[hidden] { display: none; }
.picks-section .rank-table { min-width: 0; width: 100%; }
@media (max-width: 600px) {   /* 폰: 전일 대비는 종가 아래 줄, 머리글은 줄바꿈 — 업종 · 1위 종목 · 종가 세 칸이 한 화면에 들게 */
  .picks-section .rank-table th, .picks-section .rank-table td { white-space: normal; }
  .picks-section .cell-price small { display: block; margin-left: 0; }
}   /* 3칸 표는 폰 폭에 맞춘다 — 시총 TOP 10 의 min-width 760 을 물려받으면 종가 · 업종 칸이 오른쪽으로 밀려 안 보였다 */
/* 종목명은 늘 한 줄, 업종 글자도 한 줄 — 업종 · 종가 칸 좌우 여백 8 → 4, 업종 글자 13px로 자리를 만든다. 폭 374px 이하 폰에서만 업종이 공백 자리에서 두 줄 (2026-10-25 사용자: "종목명이 두 줄로 가면 안 된다") */
.picks-section .stock-name { white-space: nowrap; }
.picks-section #sector-top-body td.col-sector { white-space: nowrap; padding-left: 4px; padding-right: 4px; }
.picks-section #sector-top-body .cell-sector { font-size: 13px; }
.picks-section #sector-top-body td:last-child { padding-left: 4px; }
@media (max-width: 374px) { .picks-section #sector-top-body td.col-sector { white-space: normal; } }
.seg-row { display: flex; gap: 6px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.seg-row::-webkit-scrollbar { display: none; }
.seg { flex: none; padding: 6px 12px; border: 1px solid #E2E8F0; border-radius: 999px; background: #fff; font: inherit; font-size: 14px; line-height: 20px; color: var(--gray-600); white-space: nowrap; cursor: pointer; }
.seg[aria-selected="true"] { background: #111; border-color: #111; color: #fff; font-weight: 700; }
/* 미국 · 한국 알약 — 구획 제목 줄 오른쪽 (2026-10-24 사용자). 묶음 알약(.seg-row)보다 작게 */
.mkt-tabs { display: inline-flex; padding: 3px; gap: 2px; margin-left: auto; align-self: center; overflow: visible; background: #F1F5F9; border-radius: 8px; }   /* 미국 · 한국 = 트럼프 `오늘 | 5일` 전환 버튼 모양 (2026-10-25 사용자, 홈 수정 H7 · H8): 회색 바탕 둥근 상자, 선택은 흰 바탕 · 검정 굵게 */
.mkt-tabs .seg { padding: 4px 12px; border: 0; border-radius: 6px; background: none; font-size: 14px; line-height: 20px; font-weight: 400; color: #6B7280; }
.mkt-tabs .seg[aria-selected="true"] { background: #fff; border: 0; color: #111; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.home-cards .section-head .mkt-tabs { margin: 0 0 0 auto; }
/* 종목 정렬 텍스트 버튼 — 시장 흐름 탭 오른쪽 끝, 글자 앞 삼각형(글자 크기의 70%). 처음엔 탭 글자와 같은 회색(비활성), 누르면 상승 빨강 · 하락 파랑 (2026-10-25 사용자, 홈 수정 H12) */
.sort-toggle { display: flex; flex-direction: column; align-items: center; margin-left: auto; padding: 9px 0 0; border: 0; background: none; font: inherit; font-size: 14px; line-height: 20px;   /* 글자 크기 = 묶음 탭(데이터 센터 · 반도체) 14px (2026-10-25 사용자) */ color: var(--gray-400); white-space: nowrap; cursor: pointer; flex: none; }
.sort-toggle[hidden] { display: none; }
.sort-toggle::after { content: ''; display: block; height: 2px; margin-top: 10px; background: transparent; }   /* 탭과 같은 높이 자리 */
.sort-in { display: inline-flex; align-items: center; }
.sort-tri { flex: none; position: relative; top: .05em; width: .7em; height: .7em; margin-right: 4px; fill: currentColor; }   /* 삼각형은 글자(한글) 세로 가운데 — 실측 0.7px 위라 .05em 내림 (2026-10-25 사용자) */
.sort-toggle[data-state="up"] { color: #d93025; font-weight: 700; }
.sort-toggle[data-state="down"] { color: #1a73e8; font-weight: 700; }
.sort-toggle[data-state="down"] .sort-tri { transform: rotate(180deg); top: calc(.05em + 1px); }   /* 하락순 삼각형은 1px 더 내림 (2026-10-25 사용자) */
.post-body .sort-toggle { padding: 0; }   /* 글 본문 카드 제목 줄 오른쪽 정렬 버튼 — 탭 줄 높이 맞춤(위 여백 · 아래 막대 자리)은 빼고 (2026-10-26 한국 증시 리포트 M3) */
.post-body .sort-toggle::after { display: none; }
/* 테마 목록 — 줄마다 테마 이름(굵게) · 상태 라벨 오른쪽, 아래 줄 핵심 숫자. 줄 전체가 테마 페이지 링크, 줄 사이 구분선 */
.theme-list { margin: 0 16px; }
.theme-row { display: block; padding: 14px 0; border-top: 1px solid #E5E7EB; color: inherit; text-decoration: none; }
.theme-row:first-child { border-top: 0; }
.theme-row.load-status { color: var(--gray-400); text-align: center; padding: 24px 0; }
.theme-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.theme-name { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 26px; }
.theme-state { flex: none; font-size: 14px; font-weight: 700; line-height: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #E2E8F0; background: #F8FAFC; color: #475569; white-space: nowrap; }
.theme-state.positive { background: #FFF7ED; border-color: #FED7AA; color: #d93025; }
.theme-state.negative { background: #EFF6FF; border-color: #BFDBFE; color: #1a73e8; }
.theme-sub { display: block; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--gray-600); }
.theme-sub .up { color: #d93025; font-weight: 700; } .theme-sub .down { color: #1a73e8; font-weight: 700; }
a.theme-row:hover .theme-name { text-decoration: underline; }
/* 섹터 상위 종목 — 2위 · 3위는 1위 아래 작은 줄 */
.sector-sub { display: block; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--gray-600); }   /* 줄바꿈 허용 — nowrap 이면 폰에서 종가 칸이 오른쪽으로 밀려 잘렸다 (2026-10-21) */
.sector-sub-item { display: block; }   /* 종목마다 한 줄, 가운뎃점 없음 (2026-10-25 사용자) */
.sector-sub a { color: inherit; text-decoration: none; }
.sector-sub a:hover { text-decoration: underline; }

/* ==========================================================================
   responsive
   ========================================================================== */

@media (max-width: 1360px) {
  .briefing-body { flex-direction: column; }
  .search-bar { width: 200px; }
}

@media (max-width: 1180px) {
  :root { --gutter: 24px; }
  /* 메뉴 9개와 검색창이 겹치는 폭부터 검색은 아이콘 — 누르면 헤더 아래 한 줄 전체 폭 (2026-10-10) */
  .search-toggle { display: flex; }
  .nav-right { gap: 12px; }
  /* 검색창은 헤더 아래로 내려오는 줄 — 아이콘들은 오른쪽에 그대로 (2026-10-12 사용자: 알림 · 검색 · 메뉴 우측 정렬) */
  .search-bar { display: none; position: absolute; top: calc(100% + 8px); left: var(--gutter); right: var(--gutter); width: auto; box-shadow: 0 8px 24px rgba(15,23,42,.14); }
  .search-bar.is-open { display: flex; }
  /* 카드 넷이 좁아지면 2 × 2 (미디어 데일리 추가, 2026-10-23) */
  .briefing-main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 900px) {
  .navbar { flex-wrap: wrap; height: auto; padding: 12px var(--gutter); }
  .nav-left { gap: 20px; flex: 1; }
  .nav-toggle, .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex: none;
    border: 1px solid var(--border-strong); border-radius: 8px;
    color: var(--gray-600);
  }
  .nav-right { gap: 8px; }
  /* 모바일 메뉴: 메뉴 아이콘을 누르면 오른쪽에서 서랍이 열린다 (2026-10-12 사용자). 열고 닫기는 JS(.is-open) */
  .menu-items {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: min(320px, 84vw);
    flex-direction: column; align-items: stretch; gap: 0;
    padding: 72px 0 24px;
    background: var(--surface);
    box-shadow: -8px 0 30px rgba(15,23,42,.18);
    transform: translateX(100%);
    transition: transform .22s ease;
    overflow-y: auto;
  }
  .menu-items.is-open { transform: none; }
  .nav-item { padding: 14px 24px; font-size: 18px; line-height: 28px; border-bottom: 1px solid var(--border); }
  .nav-item[aria-current="page"]::after { display: none; }
  .nav-close { display: flex; }
  /* 폰 · 태블릿: 로고 오른쪽 · 메뉴 아이콘 앞에 메뉴를 바로 보인다 (2026-11-10 사용자). 서랍 메뉴를 JS 가 복사 — 메뉴 원본은 하나.
     좁아서 넘치면 이 줄만 옆으로 밀린다(가로 스크롤) — 로고 · 아이콘은 줄지 않는다 */
  .menu-quick { display: flex; align-items: center; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .menu-quick::-webkit-scrollbar { display: none; }
  .menu-quick .nav-item { padding: 6px 7px; border-bottom: 0; font-size: 16px; line-height: 22px; }
  .navbar { flex-wrap: nowrap; }
  .nav-left { flex: none; }
  .nav-right { flex: 0 1 auto; min-width: 0; }
  body.has-bar .nav-left { flex: 1 1 auto; min-width: 0; }   /* 바로 보이는 메뉴가 로고 줄에 있을 때 — 아이콘 앞으로 붙인다 */
  body.has-bar .menu-quick { margin-left: auto; }

  .briefing-main { grid-template-columns: minmax(0, 1fr); }
  .briefing-main > .report-col:last-child { grid-column: auto; }
}
@media (max-width: 480px) {
  /* 폰: 로고 · 메뉴 · 아이콘이 한 줄에 다 들어가게 (360 폭 기준) */
  .navbar { gap: 6px; }
  .nav-right { gap: 4px; }
  .logo { gap: 6px; }
  .logo-mark { width: 28px; height: 26px; }   /* 28 → 25.2 → 27 → 28 (5% 키움 28.35 → 정수, 2026-11-10) */
  .logo-word { font-size: 18px; line-height: 26px; letter-spacing: -0.3px; }   /* 19 → 15.2 → 17 → 18 (5% 키움 17.85 → 정수, 2026-11-10) */
  .menu-quick .nav-item { padding: 6px 5px; font-size: 15px; letter-spacing: -0.3px; }
}

@media (max-width: 680px) {
  /* 헤더 로고 · 아이콘도 본문과 같은 좌우 기준선 — 글 보기 14px, 홈 10px (2026-10-13 사용자: "블로그 로고 좌측 여백을 본문 기준에 맞춰") */
  .navbar { padding-left: 14px; padding-right: 14px; }
  body:not(.item-view) .navbar { padding-left: 10px; padding-right: 10px; }
  /* 홈(대시보드)에서는 카드가 화면 가장자리에서 10px (2026-10-10 사용자). 글 보기는 20px 별도 규칙 */
  body:not(.item-view) .main-content { padding-left: 10px; padding-right: 10px; }
  :root { --card-gap: 10px; }   /* 폰 홈 카드 사이 = 좌우 10 (2026-10-24 사용자) */
  .sector-card .sector-table { margin: 0 12px; width: calc(100% - 24px); }
  .tabs { overflow-x: auto; }
  .tab { padding: 8px 13px 0; }   /* 폰 탭 사이 24 → 26 (+10%) */
  /* 폰 제목은 모두 2px 작게 (2026-10-13 사용자, 디자인 가이드 9절) — 홈 · 목록 구획 제목 22 → 20, 홈 리포트 카드 제목 21 → 19 */
  .section-title { font-size: 20px; line-height: 26px; }
  .report-title { font-size: 20px; line-height: 26px; }
}

/* 홈 화면 추가 안내 (2026-10-13 사용자, 디자인 가이드 10-4). 폰에서만 JS가 붙인다 */
.a2hs {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 45;
  max-width: 480px; margin: 0 auto; padding: 14px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(15,23,42,.18);
}
.a2hs[hidden], .a2hs [hidden] { display: none; }
.a2hs-head { display: flex; align-items: center; gap: 12px; }
.a2hs-icon { width: 44px; height: 44px; flex: none; border: 1px solid var(--border-strong); border-radius: 10px; }
.a2hs-text { flex: 1; min-width: 0; }
.a2hs-title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: #111; }
.a2hs-sub { margin: 0; font-size: 14px; line-height: 20px; color: var(--gray-500); }
.a2hs-close { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; color: var(--gray-500); -webkit-tap-highlight-color: transparent; }
.a2hs-btn {
  display: block; width: 100%; margin-top: 12px; padding: 10px 12px;
  background: #111; color: #fff; border-radius: 8px;
  font-size: 16px; line-height: 24px; font-weight: 700; text-align: center;
}
.a2hs-steps { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--border); }
.a2hs-step { display: flex; gap: 8px; font-size: 16px; line-height: 24px; color: #333; }
.a2hs-step + .a2hs-step { margin-top: 6px; }
.a2hs-num { flex: none; width: 20px; font-family: var(--num); font-weight: 700; color: #111; }
.a2hs-step svg { width: 18px; height: 18px; margin: 0 2px; vertical-align: -3px; }

/* ================================================================ 터치 (2026-10-19 사용자)
   "터치하는 영역이 너무 작다 — 종목은 한 행, 독립 링크 카드는 카드 전체" · "눌렀는지 모르겠다 — 터치 효과, 느리면 로딩 표시".
   행 · 카드 전체 이동은 아래 스크립트(터치 장치)가 한다. 여기는 모양만. 가이드라인 10-9 */
.rank-table tbody tr, .post-card, .news-item:not(.load-status), [data-row-link] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a, button, summary, .tab { -webkit-tap-highlight-color: transparent; }
.is-pressed { transition: none !important; }
.rank-table tbody tr.is-pressed, .rank-table tbody tr.is-pressed td,
.news-item.is-pressed, [data-row-link].is-pressed, [data-goto-tab].is-pressed { background-color: #EEF2F7 !important; }
a.report-card.is-pressed, .post-card.is-pressed { background-color: #F1F5F9 !important; transform: scale(.985); }
a.is-pressed:not(.report-card), button.is-pressed, summary.is-pressed, .tab.is-pressed { opacity: .55; }
.news-item:not(.load-status), [data-row-link] { transition: background-color .15s ease; }
.news-item:not(.load-status) { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; border-radius: 8px; }
/* 페이지 이동 표시: 맨 위 진행 막대는 바로, 0.4초 넘게 걸리면 가운데 돌기 */
#nav-progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: #E53E3E; z-index: 10000; opacity: 0; pointer-events: none; transition: width 6s cubic-bezier(.08, .7, .2, 1), opacity .2s; }
#nav-progress.on { opacity: 1; width: 88%; }
#nav-veil { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(255, 255, 255, .5); }
#nav-veil.on { display: flex; }
#nav-veil span { width: 34px; height: 34px; border: 3px solid #CBD5E1; border-top-color: #111; border-radius: 50%; animation: nav-spin .8s linear infinite; }
@keyframes nav-spin { to { transform: rotate(360deg); } }
/* ===== 장중 가격 토글 · 장중 차트 (2026-11-05 사용자) — 구획 제목 줄 오른쪽: 기준 표시 · 토글 · 미국 | 한국 한 줄. 토글 · 표시는 한국 탭에서만 보인다 ===== */
.head-right { display: flex; align-items: center; gap: 12px; margin-left: auto; flex: none; white-space: nowrap; }
.home-cards .section-head .head-right .mkt-tabs { margin: 0; }
.section-title { min-width: 0; }
.live-note { font-size: 12px; color: var(--gray-500); }
.day-note { font-family: var(--num); font-size: 14px; font-weight: 400; line-height: 20px; color: #7A7A7A; white-space: nowrap; }   /* 구획 제목 줄 오른쪽 `11월 11일 기준` — 홈 카드 날짜와 같은 모양 (2026-11-12 사용자: 종가 기준이니 날짜 표기, 한글로 통일) */
.live-note.on { color: #0E7490; font-weight: 600; }
.live-note .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #0E7490; margin-right: 5px; vertical-align: 1px; animation: livepulse 1.6s ease-in-out infinite; }
@keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.live-switch { position: relative; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; font-size: 13px; font-weight: 600; color: var(--ink); }
.live-switch[hidden], .live-note[hidden] { display: none; }
.live-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.live-knob { position: relative; width: 36px; height: 20px; border-radius: 999px; background: #CBD5E1; transition: background .15s; }
.live-knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.live-switch input:checked + .live-knob { background: #0E7490; }
.live-switch input:checked + .live-knob::after { left: 19px; }
.live-switch input:focus-visible + .live-knob { outline: 2px solid #0E7490; outline-offset: 2px; }
.cell-price.live small::after { content: " 지연"; font-size: 10px; color: var(--gray-500); font-weight: 500; }   /* 장중 값임을 숫자 옆에 작게 */
/* 장중 차트 — 줄 끝 작은 버튼, 누르면 그 줄 아래에 우리 15분봉(누르기 전엔 아무것도 불러오지 않는다). 카드마다 하나만 열림 */
.chart-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; font: inherit; font-size: 12px; font-weight: 600; color: var(--gray-600); cursor: pointer; white-space: nowrap; }
.chart-btn:hover { border-color: #0E7490; color: #0E7490; }
.chart-btn[aria-expanded="true"] { background: #0E7490; border-color: #0E7490; color: #fff; }
.chart-btn svg { width: 14px; height: 14px; }
.col-chart { width: 1%; text-align: right !important; }
.chart-row td { padding: 0 !important; background: var(--surface-sub); }
.chart-box { padding: 12px 16px 14px; }
.chart-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--gray-500); margin-bottom: 8px; }
.chart-head b { color: var(--ink); font-weight: 600; }
.chart-frame { min-height: 200px; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: #fff; }
.chart-loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--gray-400); font-size: 13px; }
.chart-stamp { font-size: 12px; line-height: 16px; color: var(--gray-500); padding: 10px 12px 4px; }
@media (max-width: 640px) { .live-note { display: none; } .live-switch .t { display: none; } .chart-btn span { display: none; } .chart-btn { padding: 6px; } }   /* 폰: 제목 줄 한 줄 유지 — 스위치 · 아이콘만 */

/* ==========================================================================
   Blogger — 최신 리포트 카드 목록
   ========================================================================== */

.reports { display: flex; flex-direction: column; gap: 16px; }

.post-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

.post-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: box-shadow .18s ease, transform .18s ease;
}
.post-card:hover {
  box-shadow: 0 6px 24px rgba(15, 23, 42, .07);
  transform: translateY(-2px);
}

.post-card-img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: linear-gradient(140deg, #16324F 0%, #26506F 55%, #3E7396 100%);
}

.post-card-body { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 20px; }
.post-card-meta {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--num);
  font-size: 14px;
  color: var(--gray-400);
}
.post-card-title {
  margin: 0;
  font-weight: 700;
  font-size: 20px;   /* 목록 카드 제목 +1 (2026-10-13) */
  line-height: 1.45;
  letter-spacing: -.3px;
  color: var(--ink);
}
.post-card-title a:hover { color: var(--accent); }
.post-card-snippet, .post-card-snippet p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--gray-500); }
/* 목록 카드 요약 (2026-10-13 사용자): 테마 JS가 홈 카드와 같은 2줄 요약(.report-columns)으로 바꾼다. 바꾸기 전 · 실패 시 블로거 기본 요약은 2줄에서 자른다 */
.post-card-snippet:not(.report-columns) { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

.blog-pager { display: flex; justify-content: center; gap: 12px; padding-top: 4px; }
/* 글 더 보기 — 목록 버튼과 같은 검은 테마 버튼, 가로 30% 넓게 (2026-10-13 사용자: "모든 하단 버튼은 블랙 테마 버튼") */
.blog-pager a {
  padding: 9px 42px;   /* 글 아래 `목록` 버튼과 같은 크기 14px · 9 42 (2026-11-07 가이드라인 10절) */
  background: #111;
  border: 1px solid #111;
  border-radius: 8px;
  font-size: 14px;
  line-height: 20px;
  font-weight: 700;
  color: #fff;
}
.blog-pager a:hover { background: #000; color: #fff; }

/* ==========================================================================
   Blogger — 글 보기
   ========================================================================== */

/* main-content 는 border-box 라 좌우 gutter 가 안쪽 폭을 그만큼 깎는다. gutter 를 더해 콘텐츠 폭이 정확히 --shell(980).
   2026-10-15 부터 홈 · 목록도 테마 .main-content 가 같은 식이라 이 줄은 글 보기용 중복 (지워도 같다) */
body.item-view .main-content { max-width: calc(var(--shell) + var(--gutter) * 2); }

.post-shell { width: 100%; max-width: var(--shell); margin: 0 auto; min-width: 0; }

.post-outer-container {
  padding: 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.post-title {
  margin: 0 0 10px;
  font-weight: 700;
  font-size: 35px;   /* 제목 +1 (2026-10-13 사용자: "타이틀 사이즈도 1포인트 크게") */
  line-height: 49px;   /* 홀짝 — 줄 높이 − 글자 = 짝수 (2026-11-07 가이드라인 3절) */
  letter-spacing: -.6px;
  color: var(--ink);
}
.post-title a { color: inherit; }
.post-title, .post-card-title { word-break: keep-all; overflow-wrap: break-word; }   /* 글 제목 · 목록 카드 제목도 낱말 단위 줄바꿈 (2026-10-23 사용자) */
.post-title .title-logo { width: 32px; height: 32px; border-radius: 50%; margin-right: 5px; vertical-align: -5px; background: #F1F5F9; }   /* 엔비디아 리포트 제목 앞 티커 로고 (2026-10-13 사용자) */
.title-badge { display: inline-flex; align-items: center; justify-content: center; background: #E2E8F0; color: #334155; font-weight: 700; font-size: 13px; line-height: 1; }   /* 2026-10-21: 로고 핫링크 대신 티커 두 글자 배지 (운영지침 4-6) */
.post-card-title .title-logo { width: 24px; height: 24px; border-radius: 50%; margin-right: 5px; vertical-align: -5px; background: #F1F5F9; }   /* 목록 카드 제목 앞 로고 (2026-10-22) */
.post-card-title .title-badge { width: 24px; height: 24px; border-radius: 50%; margin-right: 5px; vertical-align: -5px; font-size: 11px; }
@media (max-width: 680px) { .post-title { --logo-size: 26px; } .post-title .title-logo { width: 26px; height: 26px; vertical-align: -4px; } .post-title .title-badge { font-size: 11px; } }
/* 글 제목 끝의 날짜는 16px, 볼드 없이 — 모든 리포트·모든 화면 폭 (2026-10-12 사용자). 테마 JS가 span.post-title-date 로 감싼다.
   날짜는 오른쪽 정렬 (2026-10-18 사용자: "글 제목에 날짜는 우측 정렬하고 기호는 삭제") — 목록 카드는 제목 줄 오른쪽 끝, 좁으면 다음 줄 오른쪽 */
.post-title .post-title-date, .post-card-title .post-title-date { font-size: 16px; font-weight: 400; white-space: nowrap; }
.post-card-title a:has(.post-title-date) { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.post-card-title .post-title-date { margin-left: auto; }
.post-title .post-title-date { font-size: 14px; line-height: 20px; }   /* 제목 행간(49 · 37 · 33)을 물려받으면 홀짝이 어긋난다 (2026-11-07) */
.post-title-sub { font-size: 13px; line-height: 19px; font-weight: 400; letter-spacing: 0; color: #6B7280; white-space: nowrap; margin-left: 9px; }   /* 13/19 = 기준 상자 글씨와 같은 가장 작은 글씨 (2026-11-11 사용자, 옛 14/20) · 종목 제목 꼬리 `주가 실적 일정` — 숨기지 않고 작게만 (2026-10-27 사용자 P20) · 14px = `넘겨 보기` 와 같게 (P29) */
/* 이름 ~ 꼬리 사이 = 띄어쓰기의 1.5배(실측 5.7 · 5.1 · 4.6px → 9 · 8 · 7px), 꼬리는 이름 줄의 세로 가운데 (2026-10-27 사용자 P21). 칸이 flex 라 띄어쓰기는 접히고 여백만 남는다 */
.post-title-label:has(> .post-title-sub) { display: flex; flex-wrap: wrap; align-items: center; }
@media (max-width: 900px) { .post-title-sub { margin-left: 8px; } }
@media (max-width: 680px) { .post-title-sub { margin-left: 7px; } }
/* 공유 버튼이 없는 화면(초안 미리보기 · 목업)에서도 날짜는 제목 줄 오른쪽 끝 (2026-10-18 사용자) */
.post-title:has(> .post-title-date), .post-title a:has(> .post-title-date) { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.post-title > .post-title-date, .post-title a > .post-title-date { margin-left: auto; }   /* 글 보기 제목 옆 날짜 = 홈 리포트 제목 옆 날짜(.report-card-date) 14px (2026-10-13 사용자) */
/* 글 보기 제목: 날짜 줄 오른쪽 끝에 공유 아이콘 버튼 (2026-10-12 사용자) — 테마 JS가 날짜 + 버튼을 .post-title-meta 로 묶는다.
   날짜 · 버튼 둘 다 오른쪽 끝 (2026-10-18 사용자: 날짜 우측 정렬) — 제목과 같은 줄에 들어가면 그 줄 오른쪽, 모자라면 다음 줄 오른쪽 */
.post-title:has(.post-title-meta) { display: flex; flex-wrap: nowrap; align-items: center; column-gap: 8px; }   /* 한 줄 고정 — 긴 제목은 글자 칸 안에서 줄바꿈, 공유 버튼은 오른쪽 끝 (2026-10-23 사용자) */
.post-title-text { flex: 1 1 auto; min-width: 0; display: flex; align-items: flex-start; gap: 5px; }   /* 로고(왼쪽 따로) + 글자 칸 — 줄바꿈된 둘째 줄은 로고 아래가 아니라 첫 글자 선에 맞는다 (2026-10-23 사용자) */
.post-title-label { flex: 1 1 auto; min-width: 0; }
.post-title-text .title-logo { flex: none; margin-right: 0; vertical-align: top; margin-top: calc((1lh - var(--logo-size, 32px)) / 2); }   /* 로고는 첫 줄 글자 높이의 가운데에 — 가운데 정렬 아님 (2026-10-23 사용자) */
.post-title-text .title-badge { line-height: inherit; }   /* 글자 배지(한국 종목 · ETF `T`)는 line-height:1 이라 1lh 가 배지 글자 크기가 되어 위로 떴다 → 제목 줄 높이를 물려받아 첫 줄 가운데 (2026-11-13 사용자 P537 "미들 정렬") */
.post-title-meta { flex: none; margin-left: auto; display: flex; align-items: center; justify-content: flex-end; gap: 8px; letter-spacing: 0; }
.post-title-meta .title-share { margin-left: 0; }
.title-share { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: auto; padding: 0;
  background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; color: #111; cursor: pointer; }
.title-share:hover { border-color: #111; }
/* 공유 팝업 (툴팁 팝업과 같은 상자) — 플랫폼 버튼은 왼쪽부터 한 줄로, 넘치면 다음 줄 */
.share-pop .share-buttons { justify-content: flex-start !important; }
/* 링크 복사 강조 (2026-11-14 사용자): 맨 위 한 줄 가득 · 높이 48 · 16 굵게 · 흰 바탕 · 진한 테두리 */
.share-pop .share-buttons li.share-main { flex: 1 0 100%; }
.share-pop .share-buttons li.share-main .sharing-platform-button { display: flex; width: 100%; justify-content: center; gap: 8px; padding: 11px 16px; font-size: 16px; line-height: 24px; background: #fff; border-color: #B5BAC0; color: #111; }
.share-pop .share-buttons { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 8px; }   /* 채널 = 링크 복사 아래 4칸 격자, 칸 = 로고 22 위 · 이름 12 보통 아래 (2026-11-14 사용자) */
.share-pop .share-buttons li.share-main { grid-column: 1 / -1; }
.share-pop .share-buttons li:not(.share-main) { min-width: 0; }
.share-pop .share-buttons li:not(.share-main) .sharing-platform-button { display: flex; flex-direction: column; width: 100%; justify-content: center; gap: 4px; padding: 10px 4px 8px; font-size: 12px; line-height: 18px; font-weight: 400; }
.share-pop .share-buttons li:not(.share-main) svg { width: 22px !important; height: 22px !important; }
/* 제목 아래 날짜 줄(October 11, 2026) 삭제 (2026-10-12 사용자) */
.post-timestamp { display: none !important; }
/* 글 보기: 첫 제목 위 여백 70% 줄임 (2026-10-12 사용자) — 위 32+40 → 10+12 */
body.item-view .main-content, body.item-view.no-dashboard .main-content { padding-top: 25px; }   /* 상세 제목 줄 위 여백 −5 (2026-10-25 사용자) */
/* 글 제목 위 보이는 여백 30px (2026-10-12 사용자 20 → 2026-10-13 사용자: "상단 타이틀의 위쪽 여백을 10픽셀 추가"). 행간 반쪽만큼 뺀 값 */
body.item-view .post-outer-container { padding-top: 13px; }

/* 리포트 본문은 인라인 스타일을 갖고 있어 컨테이너만 잡아준다 */
.post-body { font-size: 19px; line-height: 35px; color: #333; overflow-wrap: anywhere; word-break: keep-all; }   /* 줄바꿈은 낱말(띄어쓰기) 단위 — 한 글자씩 떨어지지 않게. 한 낱말이 줄보다 길 때만 글자 사이에서 끊는다 (2026-10-23 사용자: 모든 기사 제목 · 타이틀) */   /* 행간 px 정수 — 리포트 본문과 같은 34px (2026-10-12 사용자) */
/* 데일리 문단: PC 는 문장마다 한 줄(data-sent 블록), 모바일은 문장이 이어 흐른다(아래 @media) — 좁은 화면에서 "니다." 만 남는 고아 줄 방지 (2026-10-16 사용자).
   keep-all 로 단어 중간에서 끊지 않고, text-wrap: pretty 로 마지막 줄이 너무 짧지 않게 (지원 브라우저만) */
.post-body [data-para] { word-break: keep-all; text-wrap: pretty; }
.post-body [data-sent] { display: block; }
.post-body img { max-width: 100%; height: auto; border-radius: 12px; }
.post-body table { width: 100%; border-collapse: collapse; }
/* 셀에 nowrap 이 있는 표(리포트 본문)는 글 폭을 밀어내지 않고 표 안에서만 가로 스크롤한다 */
.post-body table { display: block; max-width: 100%; overflow-x: auto; }
/* 표 칸은 글자 중간에서 끊지 않는다 — 좁은 화면에서 칸을 쥐어짜지 말고 표가 옆으로 넘쳐 스크롤되게 (2026-10-11 사용자) */
.post-body td, .post-body th { word-break: keep-all; overflow-wrap: normal; }
/* 아코디언 (리포트 details[data-acc]): 기본 삼각형 숨기고 화살표 아이콘을 펼치면 위로 (2026-10-11) */
.post-body details[data-acc] > summary::-webkit-details-marker { display: none; }
.post-body details[data-acc][open] > summary .acc-chev { transform: rotate(180deg); }
/* 가격 정보 강조 카드 펼침 = 가격 범위 (1년)가 카드 안으로 이어진다 — 머리 줄 아래 모서리를 편다 (2026-10-26 사용자, render_html.year_range_in) */
.post-body details[data-acc][open] > summary:has(+ [data-in-card]) > span:first-child { border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; border-bottom-color: transparent !important; }   /* 머리 아래 선은 펼침 맨 위에 좌우 12px 안쪽으로 그린다 (2026-10-27 P22, render_html.price_in) */
/* 카드 안 펼침 (details[data-fold], 2026-10-13 사용자): 테마 JS가 펼친 줄을 버튼 위로 옮기고 글자를 '접기'로 — .is-open 이면 화살표 위로 */
.post-body details[data-fold] > summary::-webkit-details-marker { display: none; }
.post-body details[data-fold].is-open > summary .acc-chev { transform: rotate(180deg); }
.post-body [data-fold-more][hidden] { display: none !important; }
/* 툴팁 (리포트 [data-tip]) → 팝업창 (2026-10-12 사용자: "툴팁은 팝업창으로, 내용 18포인트"). ? 아이콘을 누르면(PC 클릭 · 폰 탭 · Enter) 화면 가운데 창이 뜬다.
   테마 JS가 .rt-pop 을 만든다. 닫기: × 버튼 · 바깥 누르기 · Esc. 줄바꿈(&#10;)은 창 안에서 줄을 바꾼다 */
.post-body [data-tip] { outline: none; cursor: pointer; }
.post-body [data-tip]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
.rt-pop { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: transparent; }
.rt-pop::before, .as-search-layer::before { content: ""; position: fixed; top: -100px; right: 0; bottom: -100px; left: 0; z-index: -1; background: rgba(15,23,42,.45); pointer-events: none; }   /* 가림막 = 화면보다 위아래 100 더 — 폰 브라우저 아래 주소 줄 · 도구 줄 자리까지 덮는다(inset:0 만으로는 아래가 밝게 남았다, 2026-11-14 사용자). 누르면 팝업 바깥(.rt-pop) 누르기로 닫힌다 */
html.pop-lock, html.pop-lock body { overflow: hidden !important; }   /* 팝업이 열린 동안 뒤 본문이 스크롤되지 않게 (2026-11-07 사용자 P350) */
.rt-pop[hidden] { display: none; }
.rt-pop-box { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 520px; max-height: 80vh; overflow: hidden; padding: 0; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
/* 팝업 제목 · 닫기는 위에 고정, 내용만 스크롤 (2026-10-13 사용자) */
.rt-pop-head { position: relative; flex: none; padding: 20px 60px 12px 20px; }
.rt-pop-head::after { content: ""; position: absolute; left: 20px; right: 12px; bottom: 0; border-bottom: 1px solid #E2E8F0; }   /* 제목 아래 가로 구분선 = 카드 테두리 색 (2026-10-18 사용자). 폭은 제목 왼쪽 선(20px) ~ 닫기 버튼 오른쪽 선(12px)까지 (같은 날 사용자) */
.rt-pop-body, .share-pop-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 20px 22px; }

.post-body .rt-seg[aria-pressed="true"] { background: #fff; color: #111; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.post-body [data-switch-panel][hidden], .post-body [data-hz-panel][hidden] { display: none; }
.post-body .rt-segs--in-sub { margin: 0 0 4px auto; flex: none; }
/* 하위탭 (부정 발언 · 긍정 발언 · 전체): 서브탭보다 한 단계 아래 — 16px, 밑줄 2px 검정, 줄 아래 선 없음. 표본이 모자란 탭은 흐리게 (2026-10-11) */
.post-body .rt-dirs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 0 8px; }
.post-body .rt-dirs[hidden] { display: none; }
.post-body .rt-dir { flex: none; padding: 4px 9px; font: inherit; font-size: 19px; line-height: 25px; font-weight: 400; color: #6B7280; background: none; border: 0; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.post-body .rt-dir[aria-selected="true"] { color: #111; font-weight: 700; border-bottom-color: #111; }
.post-body .rt-dir[data-empty] { color: #CBD5E1; }
/* E 2열 카드는 폰에서도 2열 (2026-10-12 사용자: "왜 2열로 적용 안 했냐") — 예전의 폰 한 칸 쌓기 규칙 삭제.
   반 폭 칸에는 이름과 값이 한 줄에 들었다 안 들었다 해서, 폰에서는 칸마다 이름 위 · 값 아래 오른쪽으로 고르게 둔다 */
@media (max-width: 680px) {
  .post-body [data-pair] > span > span:last-child { flex-basis: 100% !important; text-align: right; }
}
/* 테마가 ul 을 전역 초기화(list-style:none, padding 0)하므로 글 본문의 목록은 글머리표를 되살린다 (2026-10-11).
   글머리표는 글 바깥 칸에(outside) — 줄이 바뀌어도 글이 글머리표 아래로 들어가지 않는다 (2026-10-12 사용자: "블릿과 글을 분리, 모든 블로그 글").
   리포트 목록은 인라인 padding:0 · list-style:none + 점 칸(dot_li)이라 이 규칙을 받지 않는다 — 옛 글 목록용 */
.post-body ul { list-style: disc outside; padding-left: 20px; }
.post-body ol { list-style: decimal outside; padding-left: 24px; }
.post-body a { color: var(--down); }

.byline, .post-footer, .post-bottom, .post-labels {
  font-size: 14px;
  color: var(--gray-400);
}
/* 글 아래 라벨(데일리 브리핑 · 미국 증시 · 자동 리포트 …)은 보이지 않게 (2026-10-12 사용자: "이런 태그는 삭제").
   라벨 자체는 글에 남긴다 — 홈 카드 · 목록 · 메뉴가 라벨 피드로 글을 찾는다 */
.post-labels { display: none !important; }
/* 헤더 아래 빈 띠는 두지 않는다 — 제목 위 여백은 본문 영역이 갖는다(홈 · 글 보기 모두 보이는 20px, 2026-10-12 사용자) */
.header-bar { height: 0 !important; padding: 0 !important; }
.post-labels a {
  display: inline-block;
  margin: 6px 6px 0 0;
  padding: 3px 10px;
  background: var(--surface-sub);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-600);
}
.jump-link { display: none; }

/* 글 아래 목록으로 돌아가는 버튼 */
.post-nav { display: flex; justify-content: center; margin: 40px 0 0; }
.post-nav-list {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px clamp(42px, calc((100vw - 238px) / 2), 70px);   /* 가로 50% 넓게 42 → 70(목록 114 → 170px, 2026-11-11 사용자). 폰이 좁으면 양옆 댓글 · TOP 자리를 남기고 줄어든다 — 375 폭 ≈ 167 · 360 ≈ 152 · 320 이하 = 옛 42. 높이 −6(위아래 3씩, 홀수면 글자가 반 px 치우침) (2026-11-01 사용자 P213) */
  background: #111;
  border: 1px solid #111;
  border-radius: 8px;
  font-size: 14px;   /* 16 → 14 한 단계 작게 (P213) */
  line-height: 20px;   /* 홀짝 14/20 (2026-11-07, 옛 물려받은 21) */
  font-weight: 700;
  color: #fff;
}
.post-nav-list:hover { background: #000; color: #fff; }   /* 검은 테마 버튼 (2026-10-12 사용자) */
/* 글 아래 줄: 목록(검은 버튼)은 가운데, 오른쪽 끝에 TOP 글자 버튼 16px (2026-10-13 사용자) */
.post-nav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.post-nav .post-nav-list { grid-column: 2; }
.post-nav-top { grid-column: 3; justify-self: end; display: inline-flex; align-items: center; gap: 4px; padding: 8px 0; background: none; border: 0;
  font: inherit; font-size: 14px; line-height: 24px; font-weight: 700; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* `TOP` 글자 16 → 14 (P517, 2026-11-11 사용자) — 화살표 원 22 그대로 */
.post-nav-top:hover { color: var(--accent); }
.post-nav-top { gap: 6px; }   /* 화살표는 원형 외곽선 22px 안 (2026-10-14 사용자: "top 버튼 우측의 화살표 아이콘에 원형 외각선") */
.post-nav .post-nav-top { margin-right: 10px; }   /* 오른쪽 끝에서 10px 안쪽 (2026-10-13 사용자) */
.post-nav-cm { grid-column: 1; grid-row: 1; justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; padding: 8px 0; background: none; border: 0;
  font: inherit; font-size: 14px; line-height: 24px; font-weight: 700; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* 글자 16 → 14 = TOP 과 같게 (2026-11-11 사용자) · 댓글 = 왼쪽 끝 글자 버튼, 말풍선 · 댓글 — TOP 과 거울 (2026-11-10 사용자) */
.post-nav-cm:hover { color: var(--accent); }   /* TOP 과 같은 규칙 — 열린 상태 색은 두지 않는다(빨강 = ▲상승과 겹침) */
.post-nav .post-nav-list, .post-nav .post-nav-top { grid-row: 1; }
/* 목록 버튼 위: 본문과 40px. 본문이 카드 밖 글로 끝나면 20px · 구분선 · 20px (테마 JS .ends-text, 2026-10-12 사용자) */
body.item-view .post-outer-container { padding-bottom: 0 !important; }
body.item-view .post-bottom, body.item-view .post-footer { margin: 0; padding: 0; }
.post-shell .post-nav { margin: 40px 0 0; }
.post-shell.ends-text .post-nav { margin-top: 17px; padding-top: 20px; border-top: 1px solid #E2E8F0; }   /* 끝 글자 → 구분선 20 (행간 반쪽 3 을 뺌) */

/* 이미 게시된 글 보정 — 리포트 본문은 인라인 font-size 를 달고 나오므로 CSS 가 밀린다.
   옛 글(15/14/12px)만 골라 덮어쓰도록 태그 종류까지 지정한다. 새 글은 렌더러가
   이미 18/17/14px 로 내보내므로 아래 선택자에 걸리지 않는다. */
.post-body > div[style*="font-size:15px"] { font-size: 18px !important; }
.post-body table[style*="font-size:14px"] { font-size: 17px !important; }
.post-body div[style*="font-size:14px"] { font-size: 17px !important; }
.post-body p[style*="font-size:12px"] { font-size: 14px !important; }
.post-body img[style*="max-width:760px"] { max-width: 1024px !important; }
/* 새 디자인 글(data-design="2", 2026-10-11 디자인 가이드라인 적용분)은 위 보정에서 제외 — 안내 글 14px·표를 그대로 둔다 */
.post-body [data-design="2"] div[style*="font-size:14px"] { font-size: 14px !important; }
.post-body [data-design="2"] table[style*="font-size:14px"] { font-size: 14px !important; }
.post-body [data-design="2"] > div[style*="font-size:15px"] { font-size: 15px !important; }

/* 공유 버튼 (2026-10-12 사용자: 공유 아이콘을 누르면 소셜 아이콘이 보이게) — b:css='false' 라 블로거 위젯 CSS 가 없다.
   기본은 "공유" 버튼 하나, 누르면(.is-open, 테마 JS) 플랫폼 버튼 줄이 아래에 펼쳐진다. 창을 여는 JS 도 테마가 직접 단다 */
.post-share-buttons { margin: 20px 0 0; }
.post-share-buttons-bottom { display: flex; justify-content: flex-end; margin: 28px 0 0; padding-top: 16px; border-top: 1px solid var(--border); }   /* 공유는 콘텐츠 오른쪽 (2026-10-12 사용자) */
.goog-inline-block { display: inline-block; }
.sharing { position: relative; display: flex; flex-direction: column; align-items: flex-end; }
/* 공유 버튼은 16px 작은 버튼 (2026-10-12 사용자: "16포인트의 작은 버튼으로 콘텐츠 우측에 정렬") */
.sharing-button {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; line-height: 24px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
  font-size: 16px; font-weight: 700; color: var(--ink); cursor: pointer;
}
.sharing-button::after { content: '공유'; }
.sharing-button:hover, .sharing.is-open .sharing-button { border-color: #111; }
.share-buttons-container { display: none; margin-top: 10px; }
.sharing.is-open .share-buttons-container { display: block; }
.share-buttons, .share-buttons.hidden { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; list-style: none; }
.share-buttons li { margin: 0; }
.sharing-platform-button {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  background: var(--surface-sub); border: 1px solid var(--border-strong); border-radius: 8px;
  font-size: 14px; line-height: 20px; font-weight: 700; color: var(--gray-600); cursor: pointer;   /* 홀짝 14/20 (2026-11-07) */
}
.sharing-platform-button:hover { border-color: #111; color: #111; }
.platform-sharing-text { white-space: nowrap; }
.post-share-buttons svg, .sharing svg, svg.svg-icon-24, .touch-icon { width: 20px; height: 20px; flex: none; fill: currentColor; }
.sharing-button svg, .sharing-button .touch-icon { width: 16px; height: 16px; }

/* 댓글 — 우리 것 (2026-10-14 사용자: "우리가 댓글 프로그램을 만드는 건 어때?" — 폰에서 블로거 댓글 입력창이 좁다. 디자인 가이드 10-2).
   블로거 댓글(blogger.com iframe · 전체 페이지)을 버리고 테마 JS 가 Firebase(Firestore REST + Google 로그인)로 그린다.
   마크업은 테마 JS "댓글" IIFE 가 만든다 — 열기 버튼만 카드, 펼친 목록 · 쓰기 칸은 카드 밖 본문 폭 전체, 댓글 사이 1px 구분선.
   글자: 이름 16px 굵게, 글 19px · 행간 25, 날짜 · 안내 · 버튼 14px. 사진 24px. 입력창은 본문 폭 전체(폰 화면 − 28px). */
.comments {
  width: 100%; max-width: var(--shell); margin: 0 auto;   /* 열기 버튼이 버튼 줄로 올라가 닫히면 빈 자리 (2026-11-10 사용자, 옛 40px) */
  font-size: 19px; line-height: 25px; color: #333; word-break: keep-all;
}
.comments .comments-title { margin: 0; padding: 0; border: 0; font-size: 16px; line-height: 24px; }
/* 열기 버튼 = 흰 카드, `댓글 n` 16px 굵게 · 오른쪽 공식 접기 화살표(테두리 없이). 기본 닫힘, 주소가 #comments · #c… 면 열린 채로 (2026-10-12 · 13 사용자) */
.comments-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; margin: 0; padding: 8px 8px 8px 16px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 700; line-height: 24px; color: #111; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.comments-panel[hidden] { display: none; }
.comments .comments-title[hidden] { display: none; }
.post-nav ~ .comments .comments-panel { padding-top: 2px; }   /* 버튼 줄 바로 아래에 열린다 — 첫 댓글(위 18) · 로그인 버튼(위 14)까지 20px대 (2026-11-10 사용자) */
.post-shell .post-nav { padding-bottom: 20px; border-bottom: 1px solid #E2E8F0; }   /* 목록 · 홈으로 버튼 줄 아래 구분선 — 버튼 → 20 · 선 · 20 → 다음(함께 보는 페이지 · 열린 댓글), 위쪽 `20 · 구분선 · 20`(.ends-text)과 같은 모양 (2026-11-10 사용자: 모든 목록으로 가는 버튼 아래) */
.post-shell > [data-related].is-moved { margin-top: 65px !important; }   /* 버튼 줄(+ 댓글 판) 아래 `함께 보는 페이지` — 40 → 55 → 65 (2026-11-11 사용자: 15 더 · 10 더, 옛 2026-11-10 본문 → 버튼 줄과 같은 40) */
.post-shell > [data-related].is-moved > div:first-child { font-size: 14px !important; line-height: 20px !important; padding-bottom: 8px !important; color: #6B7280 !important; }   /* 제목 = 푸터 제목과 같은 14/20 굵게 (2026-11-11 사용자, 옛 16/26) */
.post-shell > [data-related].is-moved > a { font-size: 14px !important; line-height: 20px !important; padding-top: 9px !important; padding-bottom: 9px !important; }   /* 줄 = 14/20 · 위아래 9 (옛 16/26 · 12) — 이미 게시된 글의 인라인 값을 덮는다 (2026-11-11 사용자) */
body.item-view .main-content { padding-bottom: 0; }   /* 글 끝 → 푸터 제목 76 → 38 (2026-11-10 사용자: 50% 줄여) = 본문 아래 40 → 0 · 푸터 위 36 → 38. 홈 · 목록은 그대로 */
body.item-view .site-footer { padding-top: 19px; }   /* 38 → 19 (50%, 2026-11-11 사용자) */   /* 제목 = 아래 줄 글씨(16)와 같은 크기 · 굵게 (2026-11-10 사용자, 옛 19) — 게시된 글 인라인 값을 덮는다 */
/* 공식 접기 버튼 (가이드 10-6) — 31px 네모 · 모서리 7 · 화살표 18 · 왼쪽 4 */
.fold-box { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 31px; height: 31px; box-sizing: border-box; margin-left: 4px; border: 1px solid #E2E8F0; border-radius: 7px; background: #fff; color: #111; }
.comments-toggle .fold-box { border: 0; }   /* 댓글 열기 화살표는 테두리 없이 (2026-10-13 사용자) */
.comments-toggle .fold-box .acc-chev { transition: transform .15s; }
.comments.is-open .comments-toggle .fold-box .acc-chev { transform: rotate(180deg); }
/* 댓글 목록 — 댓글 사이 1px 구분선(위아래 14), 첫 댓글은 선 없이 위 18 */
.comments .cm-list, .comments .cm-replies { list-style: none; margin: 0; padding: 0; }
.comments .cm-list > .cm-item { padding: 18px 0; border-top: 1px solid #E2E8F0; }   /* 댓글 사이 위아래 14 → 18 (+30%, 2026-10-14 사용자) */
.comments .cm-list > .cm-item:first-child { border-top: 0; padding-top: 18px; }
/* 댓글 한 개 = 두 칸 grid(사진 | 글). 답글 묶음 · 답글 쓰기 칸은 글 칸 아래 줄 (2026-10-13 사용자: "댓글에 댓글은 레이아웃이 깨진다") */
.comments .cm-item { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 7px; align-items: start; }   /* 사진 · 이름 10 → 7 (−30%, 2026-10-14 사용자) */
.comments .cm-avatar { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-top: 0; border-radius: 50%; overflow: hidden; background: #94A3B8; color: #fff; font-family: var(--num); font-weight: 700; font-size: 12px; line-height: 24px; }   /* 사진 24px (2026-10-13 사용자) — 사진이 없으면 머리글자 원 */
.comments .cm-avatar img { width: 24px; height: 24px; display: block; }
.comments .cm-avatar.is-owner { background: #fff; border: 1px solid #E2E8F0; box-sizing: border-box; }   /* 운영자 = AlphaScope 로고 (2026-10-14 사용자) */
.comments .cm-avatar.is-owner svg { width: 14px; height: 13px; display: block; }
.comments .cm-body { grid-column: 2; grid-row: 1; min-width: 0; }
.comments .cm-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 0; line-height: 24px; }
.comments .cm-name { font-size: 14px; line-height: 20px; font-weight: 400; color: #111; }   /* 작성자 이름 = 가장 작은 글씨 14/20 보통 (2026-11-10 사용자, 옛 16 굵게) */
.comments .cm-tag { display: inline-block; margin: 0; padding: 3px 5px 2px; border: 1px solid #CBD5E1; border-radius: 4px; background: #fff; font-size: 14px; font-weight: 400; line-height: 1; color: #334155; vertical-align: middle; position: relative; top: -1px; }   /* 운영자 라벨 — 영역 라벨 모양 (가이드 5절) */
.comments .cm-date { font-family: var(--num); font-size: 14px; line-height: 20px; color: #7A7A7A; white-space: nowrap; }
.comments .cm-text { margin: 4px 0 0; font-size: 16px; line-height: 26px; color: #333; white-space: pre-wrap; overflow-wrap: anywhere; }   /* 댓글 글 16/26 어디서나 (2026-11-10 사용자: 16 · 행간 20% — 옛 폰 19/25 · PC 16/21) */
.comments .cm-text.is-deleted { color: #94A3B8; font-size: 14px; line-height: 20px; }   /* 원 댓글이 지워진 답글 묶음의 자리 */
/* 동작 버튼(답글 · 삭제)은 할 수 있는 사람에게만 — 로그인 전에는 보이지 않는다 (2026-10-13 사용자: "로그인 전에는 기능이 안 되는 버튼은 노출하지 마라") */
.comments .cm-actions { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; margin-top: 8px; }
.comments .cm-actions:empty { display: none; }
.comments .cm-btn { display: inline-flex; align-items: center; margin: 0; padding: 5px 12px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; font: inherit; font-size: 14px; line-height: 22px; font-weight: 700; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.comments .cm-btn:hover { border-color: #111; }
.comments .cm-btn[disabled] { opacity: .4; cursor: default; }
.comments .cm-replies { grid-column: 2; margin: 0; }   /* 답글은 원 댓글 글 왼쪽 선에 맞춰 */
.comments .cm-replies > .cm-item { padding: 18px 0 0; border-top: 0; }
.comments .cm-replybox { grid-column: 2; margin-top: 10px; }

.comments .cm-more { display: block; width: 100%; margin: 14px 0 0; padding: 11px 12px; background: #fff; border: 1px solid #B5BAC0; border-radius: 8px; color: #111; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* `이전 댓글 n개 더 보기` — 목록 위, 로그인 버튼과 같은 공식 흰 버튼 (2026-11-09 댓글 20개씩) */

.comments .cm-write-row { display: flex; justify-content: flex-end; }
.comments .cm-write-btn { display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 5px 12px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; font: inherit; font-size: 14px; line-height: 22px; font-weight: 700; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.comments .cm-login { display: block; width: 100%; padding: 11px 12px; background: #fff; border: 1px solid #B5BAC0; border-radius: 8px; color: #111; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* 공식 흰 버튼 — 외곽선 #E2E8F0 → 20% 진하게 #B5BAC0 (2026-10-14 사용자, 가이드 2-3 흰 버튼) */
.comments .cm-login:hover { border-color: #111; }

/* 입력창 — 본문 폭 전체, 테두리 #E2E8F0 · 모서리 8, 안쪽 11 · 12, 글 19px · 행간 24, 처음 4줄 높이. 글을 쓰면 아래로 늘어난다 */
.comments .cm-input { display: block; width: 100%; min-height: 128px; margin: 0; padding: 11px 12px; box-sizing: border-box; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; font: inherit; font-size: 16px; line-height: 26px; color: #333; resize: none; overflow: hidden; }   /* 입력창 16/26 = 댓글 글과 같게 · 처음 4줄 높이 128 = 26 × 4 + 위아래 22 + 테두리 2 (2026-11-10 사용자, 옛 19/25 · 118) */
.comments .cm-input:focus { outline: none; border-color: #111; }

.comments .cm-submit { display: inline-flex; align-items: center; margin: 0; padding: 8px 24px; background: #111; border: 1px solid #111; border-radius: 8px; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* 등록 — 검은 테마 버튼 (2026-10-13 사용자: "모든 하단 버튼은 블랙 테마 버튼") */
.comments .cm-submit:hover { background: #000; }
.comments .cm-submit[disabled] { opacity: .4; cursor: default; }
.comments .cm-error { margin-top: 8px; font-size: 14px; line-height: 20px; color: #B91C1C; text-align: center; }   /* 오류 안내는 가운데 (2026-10-14 사용자) */
.comments .cm-error:empty { display: none; }

/* 레이아웃 모드에서만 보이는 보관용 위젯 */

  .post-body [data-sent] { display: inline; }   /* 모바일: 문장 줄바꿈 없이 이어 흐른다 — 문단(빈 줄)만 남는다 (2026-10-16 사용자) */
  /* 데스크톱용 커버 이미지 확대 규칙(1024px !important)이 모바일에서 글 폭을 벌리지 않게 */
  .post-body img, .post-body img[style*="max-width"] { max-width: 100% !important; }
}

/* AlphaScope 검색 즉답 · 질문하기 (2026-11-10 목업) — 테마 변수(--ink · --up · --down · --border …)를 그대로 쓴다 */
.as-search-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: transparent; color: var(--ink, #0F172A); cursor: pointer; }
.as-search-btn:hover { background: var(--surface-sub, #F8FAFC); }
.as-search-btn svg, .as-search-form svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
html.as-lock, html.as-lock body { overflow: hidden; }

.as-search-layer { position: fixed; inset: 0; z-index: 200; background: transparent; overflow-y: auto; }   /* 가림막은 ::before (팝업과 같이, 2026-11-14 사용자) */
.as-search-layer[hidden], .as-chat[hidden], .as-chat-fab[hidden] { display: none; }
.as-search-box { max-width: 760px; margin: 0 auto; min-height: 120px; background: var(--bg, #fff); border-radius: 0 0 16px 16px; padding: 18px 24px 28px;
  box-shadow: 0 12px 40px rgba(15, 23, 42, .18); font-family: var(--sans); color: var(--ink, #0F172A); }
.as-search-form { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink, #0F172A); padding: 6px 0 10px; }
.as-search-form input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 20px; background: transparent; color: inherit; }
.as-search-form input::-webkit-search-cancel-button { display: none; }
.as-x { flex: none; display: inline-flex; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.as-x { align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid #E2E8F0; border-radius: 8px; background: #fff; color: #111; } .as-x svg { width: 30px; height: 30px; } .as-x circle { display: none; } .as-x path { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; } .as-x:hover { border-color: #111; }   /* 검색 · 질문하기 닫기 = 테두리 네모 32 (팝업 닫기와 같게, 2026-11-14 사용자) — 옛 `닫기` 글자 */
.as-search-out { padding-top: 16px; }
.as-hint { color: #6B7280; font-size: 14px; margin: 12px 0 0; }

.as-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
.as-chips button { border: 1px solid var(--border-strong, #E2E8F0); background: var(--surface-sub, #F8FAFC); color: var(--ink, #0F172A);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.as-chips button:hover { border-color: var(--ink, #0F172A); }

/* 즉답 카드 */
.as-card { border: 1px solid var(--border-strong, #E2E8F0); border-radius: 12px; padding: 16px 18px; margin: 0 0 14px; background: var(--surface, #fff); }
.as-card header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.as-card h3 { margin: 0; font-size: 19px; font-weight: 700; }
.as-tk { color: #6B7280; font-family: var(--num); font-weight: 500; font-size: .85em; }
.as-mkt { font-size: 12px; font-weight: 700; color: #fff; border-radius: 4px; padding: 2px 6px; }
.as-mkt.as-us { background: var(--badge-blue, #4963CA); }
.as-mkt.as-kr { background: var(--badge-teal, #0F766E); }
.as-day { margin-left: auto; color: #6B7280; font-size: 13px; }

.as-up { color: var(--up, #E53E3E); }

.as-sec { border-top: 1px solid var(--border, #F0F0F0); margin-top: 10px; padding-top: 10px; }
.as-sec.as-first { border-top: 0; margin-top: 0; padding-top: 0; }   /* 검색한 내용이 카드 첫 칸 — 머리 바로 아래 (2026-11-10) */
.as-sec h4, .as-related h4 { margin: 0 0 6px; font-size: 14px; color: #475569; font-weight: 700; }
.as-related h4 small { font-weight: 400; color: #94A3B8; }
.as-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 15px; }
.as-k { color: #475569; flex: none; }
.as-v { text-align: right; word-break: keep-all; }
.as-v small, .as-news small { color: #94A3B8; }
.as-note { color: #6B7280; font-size: 13px; line-height: 21px; margin: 6px 0; }
.as-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.as-grid div { background: var(--surface-sub, #F8FAFC); border-radius: 8px; padding: 8px 4px; text-align: center; }
.as-grid span { display: block; font-size: 12px; color: #6B7280; }

.as-bars div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; }

.as-bars span { color: #6B7280; }
