
/* look_why.py 가 look_band_page.html 의 <style> 앞부분(디자인 가이드라인 값)을 붙이고 이어서 이 파일을 붙인다. */
.ev{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #EAEDF2;font-size:16px;line-height:24px}
.ev:first-child{border-top:0}
.ev .dt{flex:none;width:86px;font-family:Inter,'Noto Sans KR',sans-serif;font-size:14px;line-height:24px;color:var(--sub)}
.ev .bd{flex:1;min-width:0}.ev .bd .box{margin-right:6px}
.ev .x{font-size:14px;line-height:20px;color:var(--sub);margin-top:2px}
.ev .rv{flex:none;font-size:16px;line-height:24px}
.ev a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.ev.in{}.box.k-실적{background:#FEF3C7;border-color:#FDE68A;color:#92400E}.box.k-공시{background:#EDE9FE;border-color:#DDD6FE;color:#5B21B6}
.box.k-돌{background:#FDECEA;border-color:#F8D3CF;color:#B42318}.box.k-시장{background:#E8EDF3;border-color:#D6DEE8;color:#475569}
.cmp{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 6px}
.cmp .nm{font-size:16px;line-height:24px;font-weight:700;color:var(--ink)}
.cmp .rw{padding:6px 0}
.seen{margin:0;padding:0;list-style:none}.seen li{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:17px;line-height:29px;color:var(--body)}
.seen li>i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--body);margin-top:13px}
.gl{margin:0;padding:0 0 0 6px;list-style:none}.gl li{font-size:14px;line-height:20px;color:var(--sub);margin:6px 0}
.sec{font-size:16px;line-height:24px;font-weight:700;color:var(--ink);margin:18px 0 6px;padding-left:6px}
.sec small{font-weight:400;font-size:14px;color:var(--sub)}
</style></head><body><main>
<h1 id="h1"></h1>
<div class="stamp" id="stamp"></div>
<p class="lead" id="lead"></p>
<h2>본 것</h2>
<div class="emph"><ul class="seen" id="seen"></ul></div>
<p class="guide">판정이 아니라 본 것입니다. 까닭인지는 이 화면으로 정하지 않습니다.</p>
<h2>구간마다 대부분의 종목과 견줌</h2>
<div id="charts"></div>
<div class="legend"><span><u style="background:#E2E8F0"></u>대부분의 종목(가운데 80%)</span><span><u style="background:#F59E0B;height:3px"></u>테슬라</span><span><u style="background:#FDECEA"></u>개성이 드러난 시기</span></div>
<h2>드러난 시기 안과 뒤</h2>
<div id="cmp"></div>
<h2>그동안 있었던 일</h2>
<p class="guide">우리가 가진 자료만 날짜순으로 적었습니다. 실적 발표 · 회사 공시(항목 이름만, 본문은 안 읽음) · 시장 전체가 흔들린 날 · 하루 5% 넘게 움직인 날.</p>
<div id="events"></div>
<h2>이 자료로 볼 수 없는 것</h2>
<ul class="gl" id="cant"></ul>
</main>
<script>
const D=__DATA__,$=id=>document.getElementById(id);
const dk=s=>s.replace(/-/g,'.'),ym=s=>`${s.slice(0,4)}.${s.slice(5,7)}`;
const L=D.labels.map(s=>s.split(' ~ ')),[A,B]=D.run,np=L.length;
const CHEV='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
$('h1').textContent=`${D.ko}(${D.sym}) 개성이 드러난 시기의 앞뒤`;
$('stamp').textContent=`기준일 ${dk(D.last)} · 최근 3년을 20거래일씩 ${np}구간 · 대부분의 종목 = 구간마다 S&P 500 ${D.nkids}종목의 가운데 80% · 드러난 시기 = 범위 밖 3구간 이상 이어짐`;
$('lead').textContent=`${D.ko}는 ${ym(L[A][0])} ~ ${ym(L[B][1])}(${B-A+1}구간) 내내 대부분의 종목 범위 밖에 있었고, ${ym(L[B+1][0])}부터는 대체로 범위 안입니다. 시작은 살펴본 3년의 첫 구간이라 언제 시작됐는지는 이 자료로 볼 수 없습니다. 그래서 끝난 때를 봅니다.`;
// 본 것 — 견주기 표의 값을 말로
const C=D.cmp,pre=D.ev.filter(e=>e.k==='공시'&&e.p<=B),post=D.ev.filter(e=>e.k==='공시'&&e.p>B);
const lastF=pre[pre.length-1],firstF=post[0];
$('seen').innerHTML=[
  `끝난 때 ${D.ko}의 평소 하루 폭은 ${C[0][1]}에서 ${C[0][2]}로 조금 줄었습니다. 같은 때 대부분의 종목 범위의 위 끝은 ${C[0][3]}에서 <b>${C[0][4]}로 올라왔습니다</b>. ${D.ko}가 잔잔해진 것보다 대부분의 종목이 거칠어진 폭이 더 컸습니다.`,
  `예고 없는 돌은 드러난 시기에 구간마다 ${C[1][1]}에서 그 뒤 ${C[1][2]}로 줄었습니다.`,
  `실적 발표 뒤 첫 거래일 등락은 드러난 시기에 ${C[3][1]}, 그 뒤 ${C[3][2]}입니다. 같은 때 S&P 500 은 ${C[3][3]}, ${C[3][4]}입니다.`,
  `회사 공시(실적 외)는 ${dk(lastF.d)} ${lastF.x} 뒤로 ${firstF?dk(firstF.d)+'까지':'기준일까지'} 없었습니다. 드러난 시기가 끝난 ${ym(L[B][1])}은 그 사이입니다.`
].map(t=>`<li><i></i><span>${t}</span></li>`).join('');
// 그래프 — 회색 띠 = 대부분의 종목, 주황 선 = 테슬라, 분홍 바탕 = 드러난 시기, 마지막 값 = 점 오른쪽
function chart(ci,title,unit,dec){const w=Math.min(652,$('charts').clientWidth-26),H=170,pl=30,pr=46,pt=10,pb=24;
  const ymax=Math.max(...D.v.map((v,p)=>v?Math.max(v[ci],D.lim[p][ci][2]):0))*1.1||1;
  const X=p=>Math.round(pl+p*(w-pl-pr)/(np-1)),Y=v=>Math.round(H-pb-Math.max(0,v)/ymax*(H-pt-pb));
  const all=[...Array(np).keys()],band=all.map(p=>`${X(p)},${Y(D.lim[p][ci][2])}`).concat(all.slice().reverse().map(p=>`${X(p)},${Y(D.lim[p][ci][0])}`)).join(' ');
  const line=all.filter(p=>D.v[p]).map(p=>`${X(p)},${Y(D.v[p][ci])}`).join(' ');
  const sh=`<rect x="${X(A)-4}" y="${pt}" width="${X(B)-X(A)+8}" height="${H-pt-pb}" fill="#FDECEA"/>`;
  const ys=[];let last='';all.forEach(p=>{const y=L[p][0].slice(0,4);if(y!==last){ys.push([X(p),y]);last=y}});
  const yr=ys.map(([px,y],k)=>`<line x1="${px}" y1="${pt}" x2="${px}" y2="${H-pb}" stroke="#ECF0F5"/>`+(k===ys.length-1||ys[k+1][0]-px>=40?`<text x="${px+2}" y="${H-7}" font-size="13" fill="#6B7280">${y}</text>`:'')).join('');
  const lp=np-1,lv=D.v[lp][ci];
  return `<span class="ct">※ 구간마다 ${title} <small>(${unit})</small></span><div class="white"><svg width="${w}" height="${H}" role="img" aria-label="구간마다 ${title}">${sh}${yr}`+
    `<line x1="${pl}" y1="${H-pb}" x2="${w-pr}" y2="${H-pb}" stroke="#CBD5E1"/><text x="${pl-4}" y="${pt+8}" text-anchor="end" font-size="10" fill="#6B7280">${ymax.toFixed(dec)}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end" font-size="10" fill="#6B7280">0</text>`+
    `<polygon points="${band}" fill="#E2E8F0"/><polyline points="${line}" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`+
    `<circle cx="${X(lp)}" cy="${Y(lv)}" r="3" fill="#F59E0B"/><text x="${X(lp)+7}" y="${Y(lv)+4}" font-size="13" font-weight="700" fill="#111" font-family="Inter,sans-serif">${lv.toFixed(dec)}${unit==='%'?'%':''}</text></svg></div>`}
function charts(){$('charts').innerHTML=chart(0,'평소 하루 폭','%',1)+chart(1,'예고 없는 돌 수','일',0)}
charts();addEventListener('resize',charts);
// 견주기
$('cmp').innerHTML=C.map(c=>`<div class="cmp"><div class="nm">${c[0]}</div><div class="rows">`+
  `<div class="rw"><span>${D.ko} 안 → 뒤</span><span>${c[1]} → ${c[2]}</span></div>`+
  (c[3]?`<div class="rw"><span>${c[0]==='실적 외 공시'||c[0]==='실적 발표 반응'?'S&P 500 안 → 뒤':'대부분의 종목 위 끝'}</span><span>${c[3]} → ${c[4]}</span></div>`:'')+
  `</div><div class="ksub">${c[5]}</div></div>`).join('');
// 일 목록 — 끝 언저리(드러난 시기 마지막 3구간 ~ 뒤 3구간)는 다 펼치고, 나머지는 5개 + 접기
const evRow=e=>{const r=e.r==null?'':`<span class="rv ${e.r>0?'up':'dn'}"><span class="tr">${e.r>0?'▲':'▼'}</span>${Math.abs(e.r).toFixed(1)}%</span>`;
  const x=e.u?`<a href="${e.u}" target="_blank" rel="noopener">${e.x} ↗</a>`:e.x;
  return `<div class="ev"><span class="dt">${dk(e.d)}</span><div class="bd"><span class="box k-${e.k.split(' ')[0]}">${e.k}</span>${e.k==='공시'?`<div class="x">${x}</div>`:`<div class="x">${x}</div>`}</div>${r}</div>`};
const fold=(list,noun)=>{if(!list.length)return '<div class="empty">없음</div>';const h=list.slice(0,5).map(evRow).join(''),rest=list.slice(5);
  return `<div class="white" data-box>${h}${rest.length?`<div data-rest hidden>${rest.map(evRow).join('')}</div>`:''}</div>`+(rest.length?`<button class="fbtn" data-tg data-c="${noun} ${rest.length}건 더 보기"><span class="lb">${noun} ${rest.length}건 더 보기</span>${CHEV}</button>`:'')};
const e1=B-2,e2=B+3,near=D.ev.filter(e=>e.p>=e1&&e.p<=e2),inn=D.ev.filter(e=>e.p<e1).reverse(),aft=D.ev.filter(e=>e.p>e2).reverse();
$('events').innerHTML=`<div class="sec">끝 언저리 <small>${ym(L[e1][0])} ~ ${ym(L[e2][1])} · 날짜순</small></div><div class="white">${near.map(evRow).join('')||'<div class="empty">없음</div>'}</div>`+
  `<div class="sec">그 뒤 <small>${ym(L[e2+1][0])} ~ ${ym(D.last)} · 최근 먼저</small></div>${fold(aft,'그 뒤 일')}`+
  `<div class="sec">드러난 시기 안 <small>${ym(L[A][0])} ~ ${ym(L[e1][0])} · 최근 먼저</small></div>${fold(inn,'드러난 시기 일')}`;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-tg]');if(!b)return;const r=b.previousElementSibling.querySelector('[data-rest]');
  r.hidden=!r.hidden;b.classList.toggle('open',!r.hidden);b.querySelector('.lb').textContent=r.hidden?b.dataset.c:'접기'});
$('cant').innerHTML=['시작한 때: 드러난 시기가 살펴본 3년의 첫 구간부터라 그 앞은 안 봤습니다(3년보다 늘리지 않음).',
  '뉴스: 3년치 회사 뉴스가 없습니다. 공시도 항목 이름만 보고 본문은 읽지 않았습니다.',
  '대부분의 종목이 2026년 초부터 거칠어진 까닭: 이 화면은 테슬라 한 명만 봅니다.'].map(t=>`<li>${t}</li>`).join('');
</script></body></html>
